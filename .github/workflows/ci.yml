name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub's own actions are referenced by major tag; pin any third-party action to a full commit SHA.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit gets a complete result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.diff.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Documentation-only changes skip every other job. THIRD-PARTY-NOTICES.md is packaged and checked, so it counts as source.
      - name: Check for source changes
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "source=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          source="$(git diff --name-only "$BASE" HEAD | grep -E -v '\.md$|^\.github/ISSUE_TEMPLATE/' ; git diff --name-only "$BASE" HEAD | grep -E '^THIRD-PARTY-NOTICES\.md$')" || true
          printf '%s\n' "$source"
          if [ -n "$source" ]; then echo "source=true"; else echo "source=false"; fi >> "$GITHUB_OUTPUT"

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.source == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Portable builds from jellyfin/jellyfin-ffmpeg releases.
        include:
          - os: ubuntu-latest
            platform: portable_linux64-gpl.tar.xz
            binary: ffmpeg
            fixtures: ~/.cache/hwprobe/fixtures
          - os: macos-latest
            platform: portable_macarm64-gpl.tar.xz
            binary: ffmpeg
            fixtures: ~/Library/Caches/hwprobe/fixtures
          - os: windows-latest
            platform: portable_win64-clang-gpl.zip
            binary: ffmpeg.exe
            fixtures: ~/AppData/Local/hwprobe/fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JELLYFIN_FFMPEG_VERSION: 8.1.3-1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: dotnet build -warnaserror
      - name: Test
        if: runner.os == 'Linux'
        run: dotnet test --no-build
      # macOS and Windows runners are scarcer; there only tests whose result can differ by OS run.
      - name: Test platform-dependent code
        if: runner.os != 'Linux'
        run: dotnet test --no-build -- --filter-trait "Category=Platform"
      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: .ffmpeg
          key: jellyfin-ffmpeg_${{ env.JELLYFIN_FFMPEG_VERSION }}_${{ matrix.platform }}
      - name: Download jellyfin-ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$JELLYFIN_FFMPEG_VERSION" -R jellyfin/jellyfin-ffmpeg -p "jellyfin-ffmpeg_${JELLYFIN_FFMPEG_VERSION}_${{ matrix.platform }}" -O "${{ matrix.platform }}"
      - name: Extract (tar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: mkdir -p .ffmpeg && tar -xf "${{ matrix.platform }}" -C .ffmpeg
      - name: Extract (zip)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "${{ matrix.platform }}" -DestinationPath .ffmpeg
      - name: Point the tests at it
        run: |
          dir="$PWD/.ffmpeg"
          if [ "$RUNNER_OS" = Windows ]; then dir="$(cygpath -w "$dir")"; fi
          echo "HWPROBE_TEST_FFMPEG=$dir/${{ matrix.binary }}" >> "$GITHUB_ENV"
      # Keyed on the fixture catalog too: GitHub caches never update under an existing key, so a new or
      # changed fixture would otherwise be rebuilt every run.
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.fixtures }}
          key: fixtures-${{ env.JELLYFIN_FFMPEG_VERSION }}-${{ matrix.platform }}-${{ hashFiles('src/HwProbe.Core/Fixtures/FixtureCatalog.cs') }}
          restore-keys: fixtures-${{ env.JELLYFIN_FFMPEG_VERSION }}-${{ matrix.platform }}-
      # Only Core.Tests has RealFfmpeg tests.
      - name: Test with jellyfin-ffmpeg
        env:
          HWPROBE_HW_TESTS: "1"
          # Tests never fetch samples; a fixture that only downloads is reported as untested.
          HWPROBE_NO_DOWNLOADS: "1"
        run: dotnet test --no-build --project tests/HwProbe.Core.Tests -- --filter-trait "Category=RealFfmpeg"
      - name: Run hwprobe
        env:
          HWPROBE_NO_DOWNLOADS: "1"
        run: dotnet run --no-build --project src/HwProbe.Cli -- --ffmpeg "$HWPROBE_TEST_FFMPEG" --json hwprobe-report.json --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: hwprobe-report-${{ matrix.os }}
          path: hwprobe-report.json

  # Separate from build-test so the format check's own compile runs in parallel with the build.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: dotnet format --verify-no-changes
      - name: Check the plugin page script
        run: sh scripts/check-page.sh
      - name: Check the third-party notices
        run: python3 scripts/notices.py --check
      # Enforces .editorconfig on everything dotnet format doesn't cover; exclusions are in .editorconfig-checker.json.
      - name: Check .editorconfig rules
        env:
          GH_TOKEN: ${{ github.token }}
          EC_VERSION: 4.0.2
          EC_SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
        run: |
          gh release download "v$EC_VERSION" -R editorconfig-checker/editorconfig-checker -p editorconfig-checker-linux-amd64.tar.gz -D "$RUNNER_TEMP"
          echo "$EC_SHA256  $RUNNER_TEMP/editorconfig-checker-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/editorconfig-checker-linux-amd64.tar.gz" -C "$RUNNER_TEMP" editorconfig-checker
          "$RUNNER_TEMP/editorconfig-checker"

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Package
        run: python3 scripts/package.py --out artifacts/dist
      - uses: actions/upload-artifact@v7
        with:
          name: hwprobe-dist
          path: artifacts/dist

  # The one check branch rules require: it passes when every job passed or was skipped for a documentation-only change.
  ci:
    name: CI
    needs: [changes, build-test, lint, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
