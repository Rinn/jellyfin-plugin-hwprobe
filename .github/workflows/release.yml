name: Release

# Run by hand on main. Builds the plugin zip and CLI builds, attaches them to a draft release and
# publishes it; immutable releases can't take assets after publishing. For full releases, adds the
# version to manifest.json on the manifest branch, which is the plugin repository URL users add in
# Jellyfin. Nothing is pushed to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 1.2.3
        required: true
      notes:
        description: Release notes, which become the plugin's changelog
        required: true
      prerelease:
        description: Prerelease (not added to the plugin repository)
        type: boolean
        default: false

permissions:
  contents: read

# Two releases at once would race on the manifest branch.
concurrency:
  group: release-manifest
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: v${{ inputs.version }}

jobs:
  check:
    name: Check the inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ needs.check.outputs.version }}
    steps:
      # The commit's CI covered build, lint, and tests on every OS, so the release only packages.
      - name: Check the version, branch, tag, and CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' must look like 1.2.3"; exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this on main"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          ci="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI" --jq '.check_runs[0].conclusion // "missing"')"
          if [ "$ci" != success ]; then
            echo "::error::CI on $GITHUB_SHA is $ci, not success"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  plugin-e2e:
    name: Plugin in Jellyfin ${{ matrix.jellyfin }} (${{ matrix.install }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (Jellyfin.Controller in Directory.Packages.props) and the newest release.
        jellyfin: ["12.1", "12.2"]
        # copy: DLLs copied into the plugins folder. repository: installed from a plugin repository, as users do.
        install: [copy, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the plugin into Jellyfin and probe through its API
        run: scripts/container-plugin.sh
        env:
          HWPROBE_INSTALL: ${{ matrix.install }}
          JELLYFIN_IMAGE: docker.io/jellyfin/jellyfin:${{ matrix.jellyfin }}
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-e2e-logs-${{ matrix.jellyfin }}-${{ matrix.install }}
          path: artifacts/plugin-e2e/config/log

  release:
    name: Build and publish
    needs: [check, plugin-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Sign and store the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuget-cache: package

      # The SDK ad-hoc signs osx-arm64 executables on Linux too (checked with codesign on macOS).
      - name: Package
        run: python3 scripts/package.py --version "${{ needs.check.outputs.version }}" --out artifacts/dist

      # Verifiable with: gh attestation verify <file> -R Rinn/jellyfin-plugin-hwprobe
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/dist/*

      # A draft left by an earlier failed run is replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          fi
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          gh release create "$TAG" --draft $flags --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" artifacts/dist/*
          gh release edit "$TAG" --draft=false

      - name: Add the version to the plugin repository
        if: ${{ !inputs.prerelease }}
        env:
          CHANGELOG: ${{ inputs.notes }}
        run: |
          version="${{ needs.check.outputs.version }}.0"
          zip="hwprobe-plugin_$version.zip"
          dir="$RUNNER_TEMP/manifest"
          if git fetch --depth 1 origin manifest; then
            git worktree add -B manifest "$dir" FETCH_HEAD
          else
            git worktree add --orphan -b manifest "$dir"
          fi
          python3 scripts/manifest.py --build-yaml build.yaml --zip "artifacts/dist/$zip" --version "$version" \
            --source-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
            --changelog "$CHANGELOG" --manifest "$dir/manifest.json" --out "$dir/manifest.json"
          git -C "$dir" add manifest.json
          git -C "$dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Add HwProbe $version"
          # Pushed from the main checkout, where actions/checkout stored the token; the branch is shared.
          git push origin manifest
