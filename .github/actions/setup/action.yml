name: Set up .NET
description: Installs the .NET 10 SDK and restores the NuGet package cache.
inputs:
  nuget-cache:
    description: build, or package for jobs that publish self-contained CLI builds, whose runtime packs the other jobs don't need.
    default: build
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ inputs.nuget-cache }}-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'global.json') }}
        restore-keys: nuget-${{ inputs.nuget-cache }}-${{ runner.os }}-
