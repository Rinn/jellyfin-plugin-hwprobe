defaultVideos: [drama]

# Outputs are every codec at every quality, as a player asks for them, plus decoding alone; keys are codec-quality, e.g. hevc-8mbps.
# Every video codec Jellyfin transcodes to (EncodingHelper.GetVideoEncoder, v12.2).
codecs:
  - { key: h264, name: H.264 }
  - { key: hevc, name: HEVC }
  - { key: av1, name: AV1 }

# jellyfin-web's player quality choices (qualityOptions.js getVideoQualityOptions, v12.2). The server picks the output size from the bitrate and codec (StreamingHelpers.GetStreamingState, ResolutionNormalizer).
qualities:
  - { key: 120mbps, name: 120 Mbps, bitrate: 120000000 }
  - { key: 80mbps, name: 80 Mbps, bitrate: 80000000 }
  - { key: 60mbps, name: 60 Mbps, bitrate: 60000000 }
  - { key: 40mbps, name: 40 Mbps, bitrate: 40000000 }
  - { key: 20mbps, name: 20 Mbps, bitrate: 20000000 }
  - { key: 15mbps, name: 15 Mbps, bitrate: 15000000 }
  - { key: 10mbps, name: 10 Mbps, bitrate: 10000000 }
  - { key: 8mbps, name: 8 Mbps, bitrate: 8000000 }
  - { key: 6mbps, name: 6 Mbps, bitrate: 6000000 }
  - { key: 4mbps, name: 4 Mbps, bitrate: 4000000 }
  - { key: 3mbps, name: 3 Mbps, bitrate: 3000000 }
  - { key: 1.5mbps, name: 1.5 Mbps, bitrate: 1500000 }
  - { key: 720kbps, name: 720 kbps, bitrate: 720000 }
  - { key: 420kbps, name: 420 kbps, bitrate: 420000 }

decode: { key: decode, label: Decode only }

defaultOutputs: [h264-8mbps]

# Audio inputs, as a music library holds them (Jellyfin's audio file extensions, NamingOptions.AudioFileExtensions, v12.2), in the page's order: lossless, lossy, surround, then legacy.
# description: what the page adds to the name. Each clip is made with the server's ffmpeg where it has the encoder, else downloaded from FFmpeg's FATE suite: Monkey's Audio, Musepack, RealAudio, and AMR have no encoder.
audios:
  - { key: wav, name: WAV, description: PCM 16-bit, codec: pcm_s16le, channels: 2, sampleRate: 44100, clip: { file: audio_wav.wav, codec: pcm_s16le, encoder: pcm_s16le, arguments: "{stereo} -c:a pcm_s16le" } }
  - { key: aiff, name: AIFF, description: PCM 16-bit, codec: pcm_s16be, channels: 2, sampleRate: 44100, clip: { file: audio_aiff.aiff, codec: pcm_s16be, encoder: pcm_s16be, arguments: "{stereo} -c:a pcm_s16be" } }
  - { key: flac, name: FLAC, description: 16-bit, codec: flac, channels: 2, sampleRate: 44100, clip: { file: audio_flac.flac, codec: flac, encoder: flac, arguments: "{stereo} -c:a flac -sample_fmt s16" } }
  - { key: flac-24bit, name: FLAC 24-bit, description: 24-bit, codec: flac, channels: 2, sampleRate: 96000, clip: { file: audio_flac_24bit.flac, codec: flac, encoder: flac, arguments: "{stereoHires} -c:a flac -sample_fmt s32 -bits_per_raw_sample 24" } }
  - { key: alac, name: ALAC, description: 16-bit, codec: alac, channels: 2, sampleRate: 44100, clip: { file: audio_alac.m4a, codec: alac, encoder: alac, arguments: "{stereo} -c:a alac -sample_fmt s16p" } }
  - { key: wavpack, name: WavPack, description: 16-bit, codec: wavpack, channels: 2, sampleRate: 44100, clip: { file: audio_wavpack.wv, codec: wavpack, encoder: wavpack, arguments: "{stereo} -c:a wavpack -sample_fmt s16p" } }
  # FFmpeg's cut copies of Monkey's Audio files end mid-frame, so each loop ends with a decoding error ffmpeg carries on from.
  - { key: ape, name: Monkey's Audio, description: 16-bit, codec: ape, channels: 2, sampleRate: 44100, clip: { file: audio_ape.ape, codec: ape, download: "https://fate-suite.ffmpeg.org/lossless-audio/luckynight-mac394b1-c2000.ape", sha256: c17918e48df298a648bc3efa23e948bcd055af8cc2a631af183b10e6a198c1bc, size: 328000 } }
  - { key: mp3, name: MP3, description: 320 kbps, codec: mp3, channels: 2, sampleRate: 44100, clip: { file: audio_mp3.mp3, codec: mp3, encoder: libmp3lame, arguments: "{stereo} -c:a libmp3lame -b:a 320k" } }
  - { key: aac, name: AAC, description: 256 kbps, codec: aac, channels: 2, sampleRate: 44100, clip: { file: audio_aac.m4a, codec: aac, encoder: aac, arguments: "{stereo} -c:a aac -b:a 256k" } }
  - { key: opus, name: Opus, description: 128 kbps, codec: opus, channels: 2, sampleRate: 48000, clip: { file: audio_opus.opus, codec: opus, encoder: libopus, arguments: "{stereo} -c:a libopus -b:a 128k" } }
  - { key: vorbis, name: Vorbis, description: quality 6, codec: vorbis, channels: 2, sampleRate: 44100, clip: { file: audio_vorbis.ogg, codec: vorbis, encoder: libvorbis, arguments: "{stereo} -c:a libvorbis -q:a 6" } }
  - { key: ac3, name: AC-3, description: 640 kbps, codec: ac3, channels: 6, sampleRate: 48000, clip: { file: audio_ac3.ac3, codec: ac3, encoder: ac3, arguments: "{surround} -c:a ac3 -b:a 640k" } }
  - { key: eac3, name: E-AC-3, description: 640 kbps, codec: eac3, channels: 6, sampleRate: 48000, clip: { file: audio_eac3.eac3, codec: eac3, encoder: eac3, arguments: "{surround} -c:a eac3 -b:a 640k" } }
  # ffmpeg's DTS and TrueHD encoders are experimental, so they're allowed with -strict -2.
  - { key: dts, name: DTS, description: core, codec: dts, channels: 6, sampleRate: 48000, clip: { file: audio_dts.dts, codec: dts, encoder: dca, arguments: "{surround} -c:a dca -strict -2" } }
  - { key: truehd, name: Dolby TrueHD, description: 24-bit, codec: truehd, channels: 6, sampleRate: 48000, clip: { file: audio_truehd.mka, codec: truehd, encoder: truehd, arguments: "{surround} -c:a truehd -strict -2" } }
  - { key: mp2, name: MP2, description: 256 kbps, codec: mp2, channels: 2, sampleRate: 44100, legacy: true, clip: { file: audio_mp2.mp2, codec: mp2, encoder: mp2, arguments: "{stereo} -c:a mp2 -b:a 256k" } }
  - { key: wma, name: WMA, description: "WMA 2, 192 kbps", codec: wmav2, channels: 2, sampleRate: 44100, legacy: true, clip: { file: audio_wma.wma, codec: wmav2, encoder: wmav2, arguments: "{stereo} -c:a wmav2 -b:a 192k" } }
  - { key: musepack, name: Musepack, description: SV7, codec: musepack7, channels: 2, sampleRate: 44100, legacy: true, clip: { file: audio_musepack.mpc, codec: musepack7, download: "https://fate-suite.ffmpeg.org/musepack/inside-mp7.mpc", sha256: 0e23d692f39d3c874286ef0b479ec8d1d1586fdcf93b906dee316fc11b694301, size: 249701 } }
  - { key: realaudio, name: RealAudio, description: Cook, codec: cook, channels: 2, sampleRate: 44100, legacy: true, clip: { file: audio_realaudio.rm, codec: cook, download: "https://fate-suite.ffmpeg.org/real/ra_cook.rm", sha256: 5c7a13412f8cf544896c11fe8bc5440ac21b830e699bd6b14817dfc3745ec577, size: 50000 } }
  - { key: amr, name: AMR-NB, description: 12.2 kbps, codec: amr_nb, channels: 1, sampleRate: 8000, legacy: true, clip: { file: audio_amr.amr, codec: amr_nb, download: "https://fate-suite.ffmpeg.org/amrnb/12.2k.amr", sha256: 34445340325350fb5f4e15893c7b1e6bfd3a6f87cd5dc8fc95989f2c3e8164fc, size: 9094 } }
  - { key: au, name: Sun AU, description: μ-law, codec: pcm_mulaw, channels: 1, sampleRate: 8000, legacy: true, clip: { file: audio_au.au, codec: pcm_mulaw, encoder: pcm_mulaw, arguments: "{mono8k} -c:a pcm_mulaw" } }

# Audio outputs, as a client asks Jellyfin's progressive audio endpoint for them (UniversalAudioController, AudioHelper, v12.2): stereo for AAC, MP3, and Opus, 5.1 for AC-3 and E-AC-3, at the bitrate EncodingHelper.GetAudioBitrateParam picks with no limit asked. Audio is measured in software alone, as no backend uses the GPU for it.
audioOutputs:
  - { key: audio-decode, label: Decode only }
  - { key: audio-aac, label: AAC stereo, codec: aac, channels: 2 }
  - { key: audio-mp3, label: MP3 stereo, codec: mp3, channels: 2 }
  - { key: audio-opus, label: Opus stereo, codec: opus, channels: 2 }
  - { key: audio-ac3, label: AC-3 5.1, codec: ac3, channels: 6 }
  - { key: audio-eac3, label: E-AC-3 5.1, codec: eac3, channels: 6 }

subtitles:
  # An ASS subtitle shown for the whole of any run: "hwprobe subtitle burn-in" from 0:00 to 10:00:00, as base64 SRT.
  text: { file: speed_subtitles.ass, codec: ass, bitDepth: 8, encoder: ass, arguments: "{quiet} -f srt -i \"data:text/plain;base64,MQowMDowMDowMCwwMDAgLS0+IDEwOjAwOjAwLDAwMApod3Byb2JlIHN1YnRpdGxlIGJ1cm4taW4K\" -c:s ass" }
  # FFmpeg's PGS sample; ffmpeg has no PGS encoder, so it's downloaded.
  image: { file: speed_pgs_sub.sup, codec: PGSSUB, bitDepth: 8, download: "https://fate-suite.ffmpeg.org/sub/pgs_sub.sup", sha256: ce6d8ed89cf557e34b90d49c5ce955731935c485b93892f69ab276cfe0c36c27 }

# Accuracy, keyed by SpeedMethod. Seconds per measurement are from runs on real hosts, for the page's estimate; making or downloading clips adds to the first.
methods:
  - { key: Quick, name: Fast, description: "Fast: measures one transcode's speed; concurrent streams aren't counted", seconds: [10, 30] }
  - { key: Confirm, name: Standard, description: "Standard: also counts concurrent streams, starting from one transcode's speed", seconds: [20, 60] }
  - { key: Full, name: Thorough, description: "Thorough: also counts concurrent streams, running 1, 2, 4, 8 and 16 at once; takes longest", seconds: [50, 120] }

defaultMethod: Confirm

repeats:
  - { value: 1, label: Measure each once }
  - { value: 2, label: "Measure each twice, report the median" }
  - { value: 3, label: "Measure each three times, report the median" }

# The run's settings, in the order of Jellyfin's Transcoding page (transcoding.tsx, v12.2), then the client's choices. Labels are jellyfin-web's (en-us.json).
# server: the EncodingOptions property a setting defaults to; switch: on or off; range: whole numbers from low to high; choices: keyed values. Keys are applied by SpeedSettingsOptions.
options:
  # Shown with the backends when QSV works and its probe found the encoder; applied to QSV alone, so VAAPI keeps the server's. note: a line under any suggestion for it, here Jellyfin's Intel guide (Low-Power Encoding).
  - { key: QsvLowPowerH264, label: Enable Intel Low-Power H.264 hardware encoder, server: EnableIntelLowPowerH264HwEncoder, outputCodec: h264, backend: qsv, report: EnableIntelLowPowerH264HwEncoder, switch: true, note: "Low-Power encoding can offload the GPU usage with the help of the HuC firmware. This can be useful for speeding up the OpenCL based HDR/DV tone-mapping.", description: "Low-Power Encoding can keep unnecessary CPU-GPU sync. On Linux they must be disabled if the i915 HuC firmware is not configured." }
  - { key: QsvLowPowerHevc, label: Enable Intel Low-Power HEVC hardware encoder, server: EnableIntelLowPowerHevcHwEncoder, outputCodec: hevc, backend: qsv, report: EnableIntelLowPowerHevcHwEncoder, switch: true, note: "Low-Power encoding can offload the GPU usage with the help of the HuC firmware. This can be useful for speeding up the OpenCL based HDR/DV tone-mapping.", description: "Low-Power Encoding can keep unnecessary CPU-GPU sync. On Linux they must be disabled if the i915 HuC firmware is not configured." }
  - { key: EnhancedNvdec, label: Enable enhanced NVDEC decoder, server: EnableEnhancedNvdecDecoder, switch: true, description: "Enhanced NVDEC implementation, disable this option to use CUVID if you encounter decoding errors." }
  - { key: PreferNativeDecoder, label: Prefer OS native DXVA or VA-API hardware decoders, server: PreferSystemNativeHwDecoder, switch: true }
  - { key: VppTonemap, label: Enable VPP Tone mapping, server: EnableVppTonemapping, switch: true, description: "Full Intel driver based tone-mapping. Currently works only on certain hardware with HDR10 videos. This has a higher priority compared to another OpenCL implementation." }
  # Tone mapping only changes HDR inputs; the labels and choices are the Transcoding page's (jellyfin-web transcoding.tsx, en-us.json, v12.2).
  - { key: VideoToolboxTonemap, label: Enable VideoToolbox Tone mapping, server: EnableVideoToolboxTonemapping, switch: true, help: Only HDR inputs are tone mapped., description: "Hardware-accelerated tone-mapping provided by VideoToolbox. It works with most HDR formats, including HDR10, HDR10+, and HLG, but does not work with Dolby Vision Profile 5. This has a higher priority compared to another Metal implementation." }
  - { key: Tonemap, label: Enable Tone mapping, server: EnableTonemapping, switch: true, description: "Tone-mapping can transform the dynamic range of a video from HDR to SDR while maintaining image details and colors, which are very important information for representing the original scene. Currently works only with 10bit HDR10, HLG and DoVi videos. This requires the corresponding GPGPU runtime." }
  - key: TonemapAlgorithm
    description: "Tone mapping can be fine-tuned. If you are not familiar with these options, just keep the default. The recommended value is 'BT.2390'."
    label: Tone mapping algorithm
    server: TonemappingAlgorithm
    choices:
      - { key: none, label: None }
      - { key: clip, label: Clip }
      - { key: linear, label: Linear }
      - { key: gamma, label: Gamma }
      - { key: reinhard, label: Reinhard }
      - { key: hable, label: Hable }
      - { key: mobius, label: Mobius }
      - { key: bt2390, label: BT.2390 }
  - key: TonemapMode
    description: "Select the tone mapping mode. If you experience blown out highlights try switching to the RGB mode."
    label: Tone mapping mode
    server: TonemappingMode
    choices:
      - { key: auto, label: Auto }
      - { key: max, label: MAX }
      - { key: rgb, label: RGB }
      - { key: lum, label: LUM }
      - { key: itp, label: ITP }
  - key: TonemapRange
    description: "Select the output color range. Auto is the same as the input range."
    label: Tone mapping range
    server: TonemappingRange
    choices:
      - { key: auto, label: Auto }
      - { key: tv, label: TV }
      - { key: pc, label: PC }
  # The page takes any number for these three; the choices are the default and a few others.
  - key: TonemapDesat
    description: "Apply desaturation for highlights that exceed this level of brightness. The recommended value is 0 (disable)."
    label: Tone mapping desat
    server: TonemappingDesat
    choices:
      - { key: "0", label: "0" }
      - { key: "0.5", label: "0.5" }
      - { key: "1", label: "1" }
      - { key: "2", label: "2" }
  - key: TonemapPeak
    description: "Override the embedded metadata value for the input signal with this peak value instead. The default value is 100 (1000nit)."
    label: Tone mapping peak
    server: TonemappingPeak
    choices:
      - { key: "100", label: "100" }
      - { key: "400", label: "400" }
      - { key: "1000", label: "1000" }
  - key: TonemapParam
    description: "Tune the tone mapping algorithm. Generally leave it blank."
    label: Tone mapping param
    server: TonemappingParam
    choices:
      - { key: "0", label: "0" }
      - { key: "0.5", label: "0.5" }
      - { key: "1", label: "1" }
  # EncodingHelper.GetNumberOfThreads treats Auto (-1) and Max (0) alike: ffmpeg picks (v12.2). The caveat is jellyfin-web's own (LabelTranscodingThreadCountHelp).
  - key: EncodingThreadCount
    description: "Select the maximum number of threads to use when transcoding. Reducing the thread count will lower CPU usage but may not convert fast enough for a smooth playback experience."
    label: Transcoding thread count
    server: EncodingThreadCount
    help: The most CPU threads each transcode uses.
    recommended: "-1"
    recommendedReason: "Jellyfin's default, which lets ffmpeg pick the number of threads."
    namesBackend: true
    caveat: "Reducing the thread count will lower CPU usage but may not convert fast enough for a smooth playback experience."
    choices:
      - { key: "-1", label: Auto }
      - { key: "1", label: "1" }
      - { key: "2", label: "2" }
      - { key: "3", label: "3" }
      - { key: "4", label: "4" }
      - { key: "5", label: "5" }
      - { key: "6", label: "6" }
      - { key: "7", label: "7" }
      - { key: "8", label: "8" }
      - { key: "9", label: "9" }
      - { key: "10", label: "10" }
      - { key: "11", label: "11" }
      - { key: "12", label: "12" }
      - { key: "13", label: "13" }
      - { key: "14", label: "14" }
      - { key: "15", label: "15" }
      - { key: "16", label: "16" }
      - { key: "0", label: Max }
  # caveat: jellyfin-web's own help (LabelEnableAudioVbrHelp), shown with any suggestion to change it; compatibleValue: the value without it, suggested beside the better-quality one.
  - { key: AudioVbr, label: Enable VBR audio encoding, server: EnableAudioVbr, switch: true, qualityOrder: ["true", "false"], caveat: "Variable bitrate offers better quality to average bitrate ratio, but in some rare cases may cause buffering and compatibility issues.", compatibleValue: "false", description: "Variable bitrate offers better quality to average bitrate ratio, but in some rare cases may cause buffering and compatibility issues." }
  # Downmixing only changes transcoded 5.1 audio.
  - key: DownmixBoost
    description: "Boost audio when downmixing. A value of one will preserve the original volume."
    label: Audio boost when downmixing
    server: DownMixAudioBoost
    choices:
      - { key: "1", label: "1" }
      - { key: "1.5", label: "1.5" }
      - { key: "2", label: "2" }
      - { key: "3", label: "3" }
  - key: DownmixAlgorithm
    description: "Algorithm used to downmix multi-channel audio to stereo."
    label: Stereo Downmix Algorithm
    server: DownMixStereoAlgorithm
    help: Only transcoded 5.1 audio is downmixed.
    choices:
      - { key: None, label: None }
      - { key: Dave750, label: Dave750 }
      - { key: NightmodeDialogue, label: NightmodeDialogue }
      - { key: Rfc7845, label: RFC7845 }
      - { key: Ac4, label: AC-4 }
  # Auto, per encoder (EncodingHelper.GetEncoderParam, v12.2).
  - key: EncoderPreset
    description: "Pick a faster value to improve performance, or a slower value to improve quality."
    label: Encoding preset
    server: EncoderPreset
    backendNotes:
      none: "Software: veryfast for H.264 and HEVC, preset 10 for AV1"
      amf: "AMD AMF: speed"
      nvenc: "Nvidia NVENC: p1, the fastest"
      qsv: "Intel Quicksync (QSV): veryfast"
      vaapi: "VAAPI: the driver's default"
      rkmpp: "Rockchip MPP: the encoder's default"
      videotoolbox: "Apple VideoToolBox: prio_speed 1 (speed first)"
      v4l2m2m: "Video4Linux2: the encoder's default"
    choices:
      - { key: auto, label: Auto }
      - { key: veryslow, label: veryslow }
      - { key: slower, label: slower }
      - { key: slow, label: slow }
      - { key: medium, label: medium }
      - { key: fast, label: fast }
      - { key: faster, label: faster }
      - { key: veryfast, label: veryfast }
      - { key: superfast, label: superfast }
      - { key: ultrafast, label: ultrafast }
    qualityOrder: [veryslow, slower, slow, medium, fast, faster, veryfast, superfast, ultrafast]
    # Auto is recommended whenever measured: runs don't measure picture quality, and preset speeds can differ more between runs than between presets.
    recommended: auto
    recommendedReason: "Jellyfin's default, which picks a preset for each encoder."
  - { key: H265Crf, label: H.265 encoding CRF, server: H265Crf, outputCodec: hevc, range: [0, 51], lowerIsBetter: true, description: "The 'Constant Rate Factor' (CRF) is the default quality setting for the x264 and x265 software encoders. You can set the values between 0 and 51, where lower values would result in better quality (at the expense of higher file sizes). Sane values are between 18 and 28. The default for x264 is 23, and for x265 is 28, so you can use this as a starting point. Hardware encoders do not use these settings." }
  - { key: H264Crf, label: H.264 encoding CRF, server: H264Crf, outputCodec: h264, range: [0, 51], lowerIsBetter: true, help: CRF only applies to software encoders., description: "The 'Constant Rate Factor' (CRF) is the default quality setting for the x264 and x265 software encoders. You can set the values between 0 and 51, where lower values would result in better quality (at the expense of higher file sizes). Sane values are between 18 and 28. The default for x264 is 23, and for x265 is 28, so you can use this as a starting point. Hardware encoders do not use these settings." }
  - key: DeinterlaceMethod
    description: "Select the deinterlacing method to use when software transcoding interlaced content. When hardware acceleration supporting hardware deinterlacing is enabled the hardware deinterlacer will be used instead of this setting."
    label: Deinterlacing method
    server: DeinterlaceMethod
    help: Only interlaced inputs are deinterlaced.
    choices:
      - { key: yadif, label: Yet Another DeInterlacing Filter (YADIF) }
      - { key: bwdif, label: Bob Weaver DeInterlacing Filter (BWDIF) }
    # Neither Jellyfin nor ffmpeg claims either gives the better picture; ffmpeg's filter docs describe BWDIF as motion adaptive deinterlacing based on YADIF with W3FDIF and cubic interpolation (doc/filters.texi, bwdif), so it's ranked above.
    qualityOrder: [bwdif, yadif]
  - { key: DoubleRate, label: Double the frame rate when deinterlacing, server: DeinterlaceDoubleRate, switch: true, qualityOrder: ["true", "false"], description: "This setting uses the field rate when deinterlacing, often referred to as bob deinterlacing, which doubles the frame rate of the video to provide full motion like what you would see when viewing interlaced video on a TV." }
  - key: Audio
    label: Audio
    help: Copying passes the source's audio through, as for a client that plays it, so only the video is transcoded.
    choices:
      - { key: transcode, label: Transcode to stereo AAC }
      - { key: copy, label: Copy (passthrough) }
  - key: BurnIn
    label: Burn subtitles
    help: Subtitles drawn onto the picture, as for a client that can't show them.
    choices:
      - { key: none, label: None }
      - { key: text, label: Text (ASS) }
      - { key: image, label: Image (PGS) }

# Links the page, the CLI, and the advice point to.
links:
  # The project's home, given as the contact in the User-Agent of downloads, as Wikimedia asks.
  repository: https://github.com/Rinn/jellyfin-plugin-hwprobe
  issueForm: https://github.com/Rinn/jellyfin-plugin-hwprobe/issues/new?template=hardware-report.yml
  # Jellyfin's hardware acceleration guides; vendor pages and anchors are added to it (checked against jellyfin.org on 2026-10-01).
  jellyfinGuides: https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/
  intelLowPowerGuide: https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/intel/#configure-and-verify-lp-mode-on-linux
  # FFmpeg's FATE sample suite, where clips that can't be made are downloaded from.
  fateSuite: https://fate-suite.ffmpeg.org/

# Test suites: a sequence of performance runs that differ in one setting, saved to Test Results like any run, so the
# suggestions compare them. backends: configuredAndSoftware (default), configured, or software. requires: lowPower offers
# the suite only when the configured backend is QSV and its probe found a low-power encoder. threadSteps adds Auto, then
# 1, 2, 4 ... and the server's logical CPU count. A step's videos or outputs replace the suite's for that step. options sets
# settings every step shares; suites copy the audio, so only video is measured, except the VBR suite, which compares audio
# encoding, and the audio suite, which has no video. method replaces suiteMethod.
suites:
  - key: presets
    name: Encoder presets
    description: Encodes H.264 and HEVC at each encoder preset.
    videos: [drama]
    outputs: [h264-8mbps, hevc-8mbps]
    options: { Audio: copy }
    steps:
      - { label: Auto, options: { EncoderPreset: auto } }
      - { label: faster, options: { EncoderPreset: faster } }
      - { label: fast, options: { EncoderPreset: fast } }
      - { label: medium, options: { EncoderPreset: medium } }
      - { label: slow, options: { EncoderPreset: slow } }
  - key: quality
    name: Quality ladder
    description: Encodes H.264 and HEVC at each player quality.
    videos: [drama]
    outputs: [h264-40mbps, h264-20mbps, h264-8mbps, h264-4mbps, h264-1.5mbps, hevc-40mbps, hevc-20mbps, hevc-8mbps, hevc-4mbps, hevc-1.5mbps]
    options: { Audio: copy }
    steps:
      - { label: "40, 20, 8, 4, and 1.5 Mbps" }
  - key: decode
    name: Decoding
    description: Decodes every input codec on the configured backend and in software.
    videos: [pattern, pattern-hevc, pattern-hevc10, pattern-vp9, pattern-av1, pattern-4k-hdr]
    outputs: [decode]
    steps:
      - { label: "H.264, HEVC, HEVC 10-bit, VP9, AV1, and 4K HDR HEVC" }
  - key: 4k
    name: 4K
    description: Decodes 4K inputs and transcodes them to 4K output.
    # 40 Mbps is past ResolutionNormalizer's 2560-wide band (28 Mbps H.264-equivalent at 30 fps), and ScaleBitrate leaves 30 Mbps and up unscaled, so every codec keeps 4K (v12.2).
    videos: [drama-4k, digital-animation-4k, anime-4k]
    outputs: [decode, h264-40mbps, hevc-40mbps, av1-40mbps]
    options: { Audio: copy }
    steps:
      - { label: "Decode only, H.264, HEVC, and AV1" }
  - key: legacy
    name: Legacy formats
    description: Transcodes legacy, low-quality inputs to H.264.
    videos: [sports-576i, theora-240p, xvid-240p, flv-280p, realvideo-240p, wmv-480p]
    outputs: [decode, h264-4mbps]
    options: { Audio: copy }
    steps:
      - { label: "MPEG-2 576i, Theora, Xvid AVI, Flash video, RealVideo, and WMV" }
  - key: tonemap
    name: Tone mapping
    description: Encodes HDR video to H.264 with each tone-mapping method Jellyfin offers on this backend, and with tone mapping off.
    videos: [digital-animation-4k]
    outputs: [h264-8mbps]
    options: { Audio: copy }
    # Jellyfin uses VPP tone mapping on Intel and VideoToolbox tone mapping on Apple when they're on, else the general method (OpenCL, CUDA, Metal, Vulkan, or software); EncodingHelper, v12.2. Each method step leaves the general one on, so software still tone maps.
    steps:
      - { label: Tone mapping, options: { Tonemap: "true", VppTonemap: "false", VideoToolboxTonemap: "false" } }
      - { label: VPP tone mapping, backends: [qsv, vaapi], options: { Tonemap: "true", VppTonemap: "true", VideoToolboxTonemap: "false" } }
      - { label: VideoToolbox tone mapping, backends: [videotoolbox], options: { Tonemap: "true", VppTonemap: "false", VideoToolboxTonemap: "true" } }
      - { label: Tone mapping off, options: { Tonemap: "false", VppTonemap: "false", VideoToolboxTonemap: "false" } }
  - key: threads
    name: Thread count
    description: Encodes H.264 and HEVC in software at each thread limit.
    videos: [drama]
    outputs: [h264-8mbps, hevc-8mbps]
    options: { Audio: copy }
    backends: software
    threadSteps: true
    threadLabel: "{n} threads"
    threadLabelOne: 1 thread
  - key: lowpower
    name: Intel low power
    description: Encodes H.264 and HEVC on QSV with low power on and off.
    videos: [drama]
    outputs: [h264-8mbps, hevc-8mbps]
    options: { Audio: copy }
    backends: configured
    requires: lowPower
    steps:
      - { label: Low power off, options: { QsvLowPowerH264: "false", QsvLowPowerHevc: "false" } }
      - { label: Low power on, options: { QsvLowPowerH264: "true", QsvLowPowerHevc: "true" } }
  - key: subtitles
    name: Subtitle burn-in
    description: Encodes H.264 with no subtitles, then text and PGS subtitles burned in.
    # Burn-in is the client's choice, so no server setting is compared; the labels are jellyfin-web's (en-us.json).
    note: "Burn-in costs speed, so avoid it where possible: keep Allow subtitle extraction on the fly on (Transcoding), and in clients set Burn subtitles to Auto, turn on Experimental PGS and VobSub subtitle rendering where offered, and leave Always burn in subtitle when transcoding off."
    videos: [drama]
    outputs: [h264-8mbps]
    options: { Audio: copy }
    steps:
      - { label: None, options: { BurnIn: none } }
      - { label: Text, options: { BurnIn: text } }
      - { label: PGS, options: { BurnIn: image } }
  - key: deinterlace
    name: Deinterlacing
    description: Encodes interlaced video to H.264 with each deinterlacing method.
    videos: [sports-576i]
    outputs: [h264-8mbps]
    options: { Audio: copy }
    # Every step sets both settings, so none takes the server's double rate and turns into another step.
    steps:
      - { label: YADIF, options: { DeinterlaceMethod: yadif, DoubleRate: "false" } }
      - { label: YADIF double rate, options: { DeinterlaceMethod: yadif, DoubleRate: "true" } }
      - { label: BWDIF, options: { DeinterlaceMethod: bwdif, DoubleRate: "false" } }
      - { label: BWDIF double rate, options: { DeinterlaceMethod: bwdif, DoubleRate: "true" } }
  - key: audio
    name: VBR audio
    description: Encodes H.264 with stereo AAC audio, with VBR audio encoding off and on.
    videos: [drama]
    outputs: [h264-8mbps]
    steps:
      - { label: VBR off, options: { Audio: transcode, AudioVbr: "false" } }
      - { label: VBR on, options: { Audio: transcode, AudioVbr: "true" } }
  # Fast accuracy: a music listener needs one stream, and audio runs hundreds of times real time.
  - key: audio-formats
    name: Audio formats
    description: Decodes each audio format and transcodes it to AAC, MP3, Opus, AC-3, and E-AC-3, as for music.
    videos: []
    audios: [wav, aiff, flac, flac-24bit, alac, wavpack, ape, mp3, aac, opus, vorbis, ac3, eac3, dts, truehd, mp2, wma, musepack, realaudio, amr, au]
    outputs: [audio-decode, audio-aac, audio-mp3, audio-opus, audio-ac3, audio-eac3]
    backends: software
    method: Quick
    steps:
      - { label: "Decode only, AAC, MP3, Opus, AC-3, and E-AC-3" }

# What a run does when the server starts transcoding for a player; keyed by TranscodeAction.
whenTranscoding:
  - { key: Pause, label: "Pause, then repeat the interrupted measurement" }
  - { key: Continue, label: Keep measuring }
  - { key: Cancel, label: Cancel the test }

defaultWhenTranscoding: Pause

# Whether runs measure resource usage when the page or CLI doesn't say. Only the single copy is sampled, every 200 ms.
defaultMeasureResources: true

# description: jellyfin-web's own help text for an option (src/strings/en-us.json, v12.2), shown when hovering its name in a suggestion.
# Settings that together pick one thing, suggested as one table with a row per choice the runs used, in this order; a run is the first row whose backends and conditions it meets.
# applies: settings Apply on the row also sets, beyond its conditions. note: a line under the table when the row is in it.
# Tone mapping: VPP on Intel and VideoToolbox on Apple take precedence over Enable Tone mapping when on, and work with it off; it tone maps the HDR formats they don't (EncodingHelper IsIntelVppTonemapAvailable, IsVideoToolboxTonemapAvailable, IsHwTonemapAvailable, v12.2).
# The notes are jellyfin-web's help for each setting (en-us.json, v12.2); its deinterlacing method help is left out, as it says the method only applies to software, but CUDA, OpenCL, and VideoToolbox use it too (EncodingHelper.GetHwDeinterlaceFilter).
settingGroups:
  - key: deinterlace
    label: Deinterlacing
    settings: [DeinterlaceMethod, DoubleRate]
    rows:
      - { label: "Yet Another DeInterlacing Filter (YADIF), single rate", describes: DeinterlaceMethod, when: { DeinterlaceMethod: yadif, DoubleRate: "false" } }
      - { label: "Yet Another DeInterlacing Filter (YADIF), double rate", describes: DoubleRate, when: { DeinterlaceMethod: yadif, DoubleRate: "true" }, note: "Double rate: This setting uses the field rate when deinterlacing, often referred to as bob deinterlacing, which doubles the frame rate of the video to provide full motion like what you would see when viewing interlaced video on a TV." }
      - { label: "Bob Weaver DeInterlacing Filter (BWDIF), single rate", describes: DeinterlaceMethod, when: { DeinterlaceMethod: bwdif, DoubleRate: "false" } }
      - { label: "Bob Weaver DeInterlacing Filter (BWDIF), double rate", describes: DoubleRate, when: { DeinterlaceMethod: bwdif, DoubleRate: "true" }, note: "Double rate: This setting uses the field rate when deinterlacing, often referred to as bob deinterlacing, which doubles the frame rate of the video to provide full motion like what you would see when viewing interlaced video on a TV." }
  - key: tonemap
    label: Tone mapping
    settings: [Tonemap, VppTonemap, VideoToolboxTonemap]
    rows:
      - { label: VPP, describes: VppTonemap, backends: [qsv, vaapi], when: { VppTonemap: "true" }, applies: { Tonemap: "true" }, note: "VPP: Full Intel driver based tone-mapping. Currently works only on certain hardware with HDR10 videos." }
      - { label: VideoToolbox, describes: VideoToolboxTonemap, backends: [videotoolbox], when: { VideoToolboxTonemap: "true" }, applies: { Tonemap: "true" }, note: "VideoToolbox: Hardware-accelerated tone-mapping provided by VideoToolbox. It works with most HDR formats, including HDR10, HDR10+, and HLG, but does not work with Dolby Vision Profile 5." }
      - { label: Tone mapping, describes: Tonemap, when: { Tonemap: "true" }, note: "Tone mapping: Currently works only with 10bit HDR10, HLG and DoVi videos. This requires the corresponding GPGPU runtime." }
      - { label: "Off", describes: Tonemap, when: { Tonemap: "false" }, note: "Off: HDR videos aren't tone mapped, so their colors look wrong on SDR players." }

# Seconds between one measurement ending and the next starting, so the system winds down from the last; a result reused from an earlier run doesn't wait.
testDelay: 1

# Thresholds the suggestions, the page, and the CLI judge measurements by.
advice:
  # Runs of the same command vary by a few percent, so smaller differences count as alike.
  noise: 0.05
  # A better-quality value is suggested only while it keeps this multiple of real time on real video,
  headroom: 1.5
  # and loses no more than this share of concurrent streams.
  maxStreamLoss: 0.5
  # A resource counts as saved, or as costing more, from this share's difference.
  resourceMargin: 0.10

# Test suites count concurrent streams, which their comparisons use, without Thorough's length.
suiteMethod: Confirm

# Seconds an audio measurement takes, low and high, for the page's estimate: audio runs hundreds of times real time, on one CPU core.
audioSeconds: [1, 4]

softwareName: Software

# Measured resources, as suggestions name them.
resourceNames: { Cpu: CPU, Memory: memory, Gpu: GPU, GpuMemory: GPU memory, Power: power }

# The same, as the Resource Usage view's column headers, kept short since each backend has one of each.
resourceHeaders: { Cpu: CPU, Memory: Mem, Gpu: GPU, GpuMemory: GPU mem, Power: Power }

# Energy meters' domains, as the Resource Usage view names them.
powerDomains: { Cpu: CPU package, Gpu: GPU }

# Server settings suggestions change that aren't run options; labels are jellyfin-web's (en-us.json).
labels:
  # The server's own value: as a run option's first choice, and after a suite step or suggestion's value.
  ServerSetting: Server setting
  ServerSettingAfter: server setting
  RemoteClientBitrateLimit: Internet streaming bitrate limit
  RemoteClientBitrateLimitDescription: An optional per-stream bitrate limit for all out of network devices. This is useful to prevent devices from requesting a higher bitrate than your internet connection can handle. This may result in increased CPU load on your server in order to transcode videos on the fly to a lower bitrate.

# The report's remedies, fix links, and findings, by key; {name} is filled in by the code that picks the text.
texts:
  # Remedies, shown next to a failed probe.
  codecUnsupported: This GPU or driver does not support this codec. Leave it unticked in Jellyfin's hardware decoding list.
  filterUnsupported: A filter in the pipeline failed. The driver may lack a feature; see the stderr tail.
  timeout: ffmpeg hung and was killed, which usually means a wedged driver. Retry with no transcodes running.
  softwareFallback: ffmpeg finished but decoded in software. Jellyfin would silently use the CPU here.
  skipped: "Not run: a prerequisite is missing (a software encoder for the fixture, or the build lacks it)."
  untested: "Not verified: no hardware or sample was available to test this."
  notUsed: Software only with this ffmpeg build, so the setting has no effect.
  permissionDeniedContainer: The render node is not accessible. Add the host's render group to the container (--group-add).
  permissionDeniedHost: Add the jellyfin user to the render group (usermod -aG render jellyfin), then restart Jellyfin.
  permissionDenied: The device exists but this user cannot open it.
  deviceUnavailableQsvWindows: No Direct3D 11 adapter opened. Check the Intel graphics driver is installed.
  deviceUnavailableAmf: No Direct3D 11 adapter opened. Check the AMD graphics driver is installed.
  deviceUnavailableNvencContainer: ffmpeg has CUDA but no NVIDIA device opened. Run the container with the NVIDIA runtime (--gpus all).
  deviceUnavailableNvenc: ffmpeg has CUDA but no NVIDIA device opened. Check the NVIDIA driver is installed (nvidia-smi).
  deviceUnavailableNodeContainer: No render node opened. Pass it into the container (--device /dev/dri/renderD128).
  deviceUnavailableNode: No render node opened. Check the GPU driver is loaded (ls /dev/dri).
  deviceUnavailable: The device could not be opened. Check the GPU driver is installed.
  noVendorAdapter: No {maker} adapter found. Check the {maker} graphics driver is installed.
  noVendorAdapterDevice: Adapter {device} isn't an {maker} adapter.
  # The official image installs intel-opencl-icd, and intel-opencl-icd-legacy1 for Gen 11 and older (jellyfin-packaging, docker/Dockerfile); the linuxserver mod installs both at start (docker-mods, jellyfin-opencl-intel).
  openclUnavailableContainer: Install Intel's OpenCL runtime in the container. The official jellyfin/jellyfin image includes it (intel-opencl-icd, and intel-opencl-icd-legacy1 for Gen 11 and older GPUs). On linuxserver/jellyfin, set DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel and check the container's start-up log shows the packages installing.
  openclUnavailableHost: "Install Intel's OpenCL runtime: intel-opencl-icd, or intel-opencl-icd-legacy1 for Gen 11 and older GPUs."
  legacyCopyBack: Filters run in software (copy-back). Install the OpenCL runtime (intel-opencl-icd on Intel) to reach the full hardware pipeline.
  legacyCopyBackFfmpeg: Filters run in software (copy-back). This ffmpeg lacks {filters}; use jellyfin-ffmpeg for the {pipeline} pipeline.
  # Low power, from Jellyfin's Intel guide ("Low-Power Encoding"): Gen 9.x has low-power H.264 only, and older i915 GPUs need HuC firmware with enable_guc=2.
  lowPowerNone: This GPU is Gen 8 Intel graphics or older, which has no low-power encoders, so this is expected and no firmware change helps.
  lowPowerHevcGen9: This GPU is Gen 9 Intel graphics, which has low-power H.264 only, so this is expected and no firmware change helps.
  lowPowerHevcMaybeGen9: "Gen 9 Intel graphics (Skylake to Comet Lake, Apollo Lake, Gemini Lake) have low-power H.264 only, so there this is expected and no firmware change helps. On newer GPUs: {remedy}"
  lowPowerNotLinux: This GPU's driver doesn't support low-power encoding here. Leave the Intel Low-Power encoder option off.
  lowPowerNoI915: "Low-power encoding failed, and the i915 driver isn't loaded (the xe driver requires no firmware option). Check the Intel firmware package is installed. Guide: {guide}"
  lowPowerFirmware: "Low-power encoding on Linux requires Intel's HuC firmware. {where} the firmware package (firmware-intel-graphics on Debian, linux-firmware on Ubuntu and Arch). Except on DG1, 12th-gen and newer, or Arc A-series GPUs, which load HuC by default, add 'options i915 enable_guc=2' to /etc/modprobe.d/i915.conf, update the initramfs, and reboot. {current} Guide: {guide}"
  lowPowerFirmwareContainer: On the host (not in the container), install
  lowPowerFirmwareHost: Install
  lowPowerEnableGuc: enable_guc is currently {value}.
  # enable_guc is mode 0400 (the kernel's i915_params.c), so a server not running as root can't read it.
  lowPowerEnableGucRootOnly: Only root can read enable_guc here ({path}).
  # jellyfin-ffmpeg's qsvenc turns low power off when its parameters aren't supported (debian/patches/0071). Low-power bitrate control requires HuC (intel/media-driver README); when enable_guc shows HuC isn't requested, the firmware remedy is shown instead.
  lowPowerDropped: "Low power doesn't work with Jellyfin's bitrate settings here, so ffmpeg uses normal mode. Low-power bitrate control requires Intel's HuC firmware; check it loaded (dmesg | grep -i huc)."
  # Fix links: a short action, with the flag or package in brackets.
  fixRenderGroupContainer: Add render group (--group-add render)
  fixRenderGroupHost: Add jellyfin to render group (usermod)
  fixGpusAll: Pass GPU to container (--gpus all)
  fixDeviceDri: Pass GPU to container (--device /dev/dri)
  fixLoadDriver: Load GPU driver
  fixOpenclContainer: Install Intel OpenCL runtime
  fixOpenclHost: Install Intel OpenCL runtime (intel-opencl-icd)
  fixJellyfinFfmpeg: Use jellyfin-ffmpeg
  # Findings; each starts with the backend and device.
  findingEnableLowPower: "normal {codec} encoding fails but low-power works; this GPU only has low-power encoders. Turn on '{option}'."
  findingLowPowerAvailable: "low-power {codec} encoding works. Turning on '{option}' frees the GPU, which speeds up OpenCL tone-mapping."
  findingLowPowerDropped: "'{option}' has no effect: {reason}"
  findingLowPowerUnavailable: "leave '{option}' off. {reason}"
  findingVulkanUnprobed: Vulkan DRM interop is not probed, so FullVulkan is never reported.
  findingUnvalidated: "hwprobe's {backend} checks have not been validated on real hardware."
  findingOpenclUnavailable: "OpenCL doesn't start, but Jellyfin still picks its OpenCL pipeline because this ffmpeg was built with OpenCL, so OpenCL tone-mapping fails. {remedy}"
  # Performance test notes.
  noteSoftwareDecode: Decoded in software with this backend, then encoded on the GPU.
  noteSoftwareDecodeFailed: Decoded in software, as the probe found this GPU can't decode it, then encoded on the GPU.
  noteDecodeFailed: "Not measured: the probe found this GPU can't decode it."
  noteLowPowerDropped: Low power was dropped (see the Hardware Probe finding); ffmpeg used normal mode, so this is the normal-mode speed.
  lowPowerOptionH264: Intel Low-Power H.264 hardware encoder
  lowPowerOptionHevc: Intel Low-Power HEVC hardware encoder

# Codecs as the page and CLI name them, keyed by ffmpeg's codec name; others are shown upper-cased.
codecNames: { aac: AAC, mp3: MP3, opus: Opus, ac3: AC-3, eac3: E-AC-3, h264: H.264, hevc: HEVC, av1: AV1, vp9: VP9, vp8: VP8, mpeg2video: MPEG-2, mpeg4: MPEG-4, vc1: VC-1, theora: Theora, flv1: Sorenson Spark, rv30: RealVideo 3, rv40: RealVideo 4, wmv3: WMV 9 }

# Seconds per measurement; no value for no limit.
timeLimits:
  - { label: No limit }
  - { value: 30, label: 30 seconds }
  - { value: 60, label: 1 minute }
  - { value: 120, label: 2 minutes }
  - { value: 300, label: 5 minutes }

# Jellyfin's Hardware acceleration dropdown, in its order and with its names (jellyfin-web transcoding.tsx), keyed by HwType.
# Jellyfin's ffmpeg leaves out backends for other platforms (AMF needs d3d11va, so Windows only).
# V4L2 and Rockchip encoders are parts of ARM chips, though x86 jellyfin-ffmpeg includes V4L2.
backends:
  - { type: amf, name: AMD AMF, platforms: [windows], platformNote: Windows only }
  - { type: nvenc, name: Nvidia NVENC, platforms: [linux, windows], platformNote: Windows and Linux only }
  - { type: qsv, name: Intel Quicksync (QSV), platforms: [linux, windows], platformNote: Windows and Linux only }
  - { type: vaapi, name: Video Acceleration API (VAAPI), platforms: [linux], platformNote: Linux only }
  - { type: rkmpp, name: Rockchip MPP (RKMPP), platforms: [linux], platformNote: Linux only, armNote: Rockchip devices only }
  - { type: videotoolbox, name: Apple VideoToolBox, platforms: [macos], platformNote: macOS only }
  - { type: v4l2m2m, name: Video4Linux2 (V4L2), platforms: [linux], platformNote: Linux only, armNote: ARM devices only }

# Keyed by PipelineTier.
# GPU engine names as Windows's GPU Engine counters (engtype) and Linux's DRM fdinfo (i915, xe, amdgpu) give them, and what the page calls them.
# Intel's Linux video engine both decodes and encodes, so it can't be split.
gpuEngines:
  VideoDecode: decode
  VideoEncode: encode
  VideoProcessing: video processing
  3D: 3D
  Copy: copy
  Cuda: compute
  video: decode and encode
  vcs: decode and encode
  video-enhance: video processing
  vecs: video processing
  render: 3D
  rcs: 3D
  gfx: 3D
  dec: decode
  enc: encode
  copy: copy
  bcs: copy
  compute: compute
  ccs: compute

tiers:
  FullOpencl: Full GPU pipeline (OpenCL)
  FullVulkan: Full GPU pipeline (Vulkan)
  FullMetal: Full GPU pipeline (Metal)
  FullCuda: Full GPU pipeline (CUDA)
  Limited: GPU scaling only, no GPU tone mapping
  LegacyCopyBack: "Copy-back: filters run on the CPU"

# Keyed by BackendVerdict, for backends that don't work.
verdicts:
  NotPresent: No device found
  PermissionDenied: No permission to open the device
  DevicePresentPipelineBroken: Device found, test transcode failed
  Untested: Not tested

# Keyed by the report's finding codes.
findings:
  opencl-unavailable: "OpenCL unavailable: OpenCL tone mapping fails"
  legacy-copyback: "Copy-back pipeline: filters run on the CPU"
  vulkan-interop-unprobed: Vulkan interop not tested
  unvalidated-backend: Not validated on real hardware

# The settings a speed run started from, as the results list them, in the Transcoding page's order; keyed by SpeedSettings property.
settings:
  enhancedNvdec: Enhanced NVDEC
  preferNativeDecoder: OS native decoders
  lowPower: Intel low power
  tonemap: Tone mapping
  downmix: Stereo downmix
  encodingThreadCount: Transcoding threads
  audioVbr: VBR audio
  encoderPreset: Encoding preset
  crf: Encoding CRF
  deinterlace: Deinterlacing
  audio: Audio
  burnIn: Burned-in subtitles
