# What the plugin page lists and what a speed run can measure. Compiled into HwProbe.Core and read by Data/Catalog.cs.
# {name} in ffmpeg arguments expands from vars; {piece} is left for the fixture builder.

vars:
  quiet: -hide_banner -loglevel error -y
  # The test videos copy one 5.1 AAC track, made once.
  audio: "-i {clip:speed_audio_51.mka}"
  audioOut: -map 0:v -map 1:a -c:a copy
  hdr10: -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc
  testSource: "{quiet} -f lavfi -i testsrc2=size=1920x1080:rate=24 {audio} -t 10"
  x265: -c:v libx265 -preset medium -x265-params log-level=error

# Shared fields, merged into entries below with <<.
templates:
  # Clips are 10 s, as long as one copy's run, and looped with -stream_loop for longer runs. Encoded at each encoder's middle preset, as typical files are.
  # Test videos carry 5.1 AAC, as films usually do, so the audio Jellyfin encodes (and its VBR setting) is part of the cost.
  testVideo: &testVideo
    frameRate: 24
    width: 1920
    height: 1080
    audio: 5.1 AAC
    # ffmpeg's testsrc2 (ffmpeg-filters, "testsrc").
    description: Colour bars, a scrolling gradient, and a timestamp
  sampleVideo: &sampleVideo
    frameRate: 24
    width: 1920
  # A 10-second piece of a film on Wikimedia Commons, checked against its pinned hash and measured as downloaded.
  sampleClip: &sampleClip
    codec: vp9
    bitDepth: 8
    audioCodec: opus
    audioChannels: 2
    keepAcrossBuilds: true

# The 5.1 AAC track every test video copies, made once (a 440 Hz tone).
testAudio: { file: speed_audio_51.mka, codec: aac, encoder: aac, arguments: "{quiet} -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -ac 6 -c:a aac -b:a 384k" }

# Every video, in the order the page lists them; the library video is added from a chosen file.
videos:
  - <<: *sampleVideo
    key: drama
    name: Live action
    # Films are wider than 16:9.
    height: 804
    audio: stereo Opus
    sample: &manBehindTheMachine
      title: The Man Behind the Machine
      credit: The Man Behind the Machine, Dalano’s Films, CC BY 3.0, via Wikimedia Commons
      holder: Dalano’s Films
      holderUrl: https://www.youtube.com/@dalano_films
      # No Wikipedia article; the film's own release page, as the Commons credit gives it.
      article: https://www.youtube.com/watch?v=Qn2wb3-iuRk
      license: https://creativecommons.org/licenses/by/3.0/
      licenseName: CC BY 3.0
      source: https://commons.wikimedia.org/wiki/File:The_Man_Behind_the_Machine_(sci-fi_thriller_short_film).webm
    # 3:08.7 to 3:19.6 of Commons' 1080p VP9 transcode: a cluttered warehouse, wide shots and close-ups, no visual effects.
    clip:
      <<: *sampleClip
      file: sample_live_action_only.webm
      seconds: 10.9
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/transcoded/9/9d/The_Man_Behind_the_Machine_%28sci-fi_thriller_short_film%29.webm/The_Man_Behind_the_Machine_%28sci-fi_thriller_short_film%29.webm.1080p.vp9.webm", headerLength: 860, start: 53023790, length: 3697127, sha256: a90475735cc01e67c6ee27e96f40a1595acaa78a8e457dbfbc05da07584f3aff }
  - <<: *sampleVideo
    key: drama-4k
    name: Live action 4K
    width: 3840
    height: 1608
    audio: stereo Opus
    sample: *manBehindTheMachine
    # The same scene from Commons' original 4K VP9 file: 3:08.7 to 3:17.3, ending on the cluster before the 1080p piece's.
    clip:
      <<: *sampleClip
      file: sample_live_action_4k.webm
      seconds: 8.6
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/9/9d/The_Man_Behind_the_Machine_%28sci-fi_thriller_short_film%29.webm", headerLength: 632, start: 110647202, length: 6719911, sha256: 487d78ebf149d52f0e65dd1ac764d7aa78e17ec23c3091b44ba5648d60f63449 }
  - <<: *sampleVideo
    key: drama-8k
    name: Live action 8K
    frameRate: 25
    width: 8192
    height: 4320
    sample:
      title: Sherman "Fury" at Tankfest 2021
      credit: Fury Tank tankfest 2021, Geni, CC BY-SA 4.0, via Wikimedia Commons
      holder: Geni
      holderUrl: https://commons.wikimedia.org/wiki/User:Geni
      license: https://creativecommons.org/licenses/by-sa/4.0/
      licenseName: CC BY-SA 4.0
      source: https://commons.wikimedia.org/wiki/File:Fury_Tank_tankfest_2021.webm
    # The whole 10 s file, one cluster: VP9 profile 0, 58 Mbps, no audio; Jellyfin outputs at most 4K (EncodingHelper.GetFixedOutputSize).
    clip:
      file: sample_live_action_8k.webm
      seconds: 10.1
      codec: vp9
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/4/45/Fury_Tank_tankfest_2021.webm", headerLength: 495, start: 495, length: 73946061, sha256: b398285f93f25d56962f67e5d7c49f4478d26497d84c7e34db02866628992107 }
      keepAcrossBuilds: true
  - <<: *sampleVideo
    key: live-action
    name: Live-action + CGI
    # Films are wider than 16:9.
    height: 858
    audio: stereo Opus
    sample:
      title: Tears of Steel
      credit: Tears of Steel, Blender Foundation (mango.blender.org), CC BY 3.0, via Wikimedia Commons
      holder: Blender Foundation (mango.blender.org)
      holderUrl: https://mango.blender.org/
      license: https://creativecommons.org/licenses/by/3.0/
      licenseName: CC BY 3.0
      source: https://commons.wikimedia.org/wiki/File:Tears_of_Steel_in_4k_-_Official_Blender_Foundation_release.webm
      article: https://en.wikipedia.org/wiki/Tears_of_Steel
    # 6:39 to 6:49 of Commons' 1080p VP9 transcode.
    clip:
      <<: *sampleClip
      file: sample_live_action.webm
      seconds: 10.1
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/transcoded/1/10/Tears_of_Steel_in_4k_-_Official_Blender_Foundation_release.webm/Tears_of_Steel_in_4k_-_Official_Blender_Foundation_release.webm.1080p.vp9.webm", headerLength: 530, start: 131614236, length: 2131288, sha256: 0da88a6b1572b095bac20cb490485652feee5ab7fc45e82438174871ce657e96 }
  - <<: *sampleVideo
    key: digital-animation
    name: 3D animation
    height: 818
    audio: 5.1 Opus
    sample:
      title: Sintel
      credit: Sintel, Blender Foundation (durian.blender.org), CC BY 3.0, via Wikimedia Commons
      holder: Blender Foundation (durian.blender.org)
      holderUrl: https://durian.blender.org/
      license: https://creativecommons.org/licenses/by/3.0/
      licenseName: CC BY 3.0
      source: https://commons.wikimedia.org/wiki/File:Sintel_movie_4K.webm
      article: https://en.wikipedia.org/wiki/Sintel
    # 5:30 to 5:42; pieces end on a keyframe.
    clip:
      <<: *sampleClip
      file: sample_digital_animation.webm
      seconds: 11.9
      audioChannels: 6
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/transcoded/f/f1/Sintel_movie_4K.webm/Sintel_movie_4K.webm.1080p.vp9.webm", headerLength: 559, start: 96184958, length: 5440342, sha256: b9b721186ca9cb06bb1b1d961566b56e9f355a7b55df4ba37ab4c55529901902 }
  - <<: *sampleVideo
    key: digital-animation-4k
    name: 3D animation 4K HDR
    width: 3840
    height: 1608
    audio: stereo Opus
    sample:
      title: SINGULARITY
      credit: SINGULARITY, Blender Studio, CC BY 4.0, via Wikimedia Commons
      holder: Blender Studio
      holderUrl: https://studio.blender.org/
      # No Wikipedia article; the film's own release page, as the Commons credit gives it.
      article: https://www.youtube.com/watch?v=l5OZu-IrXpw
      license: https://creativecommons.org/licenses/by/4.0/
      licenseName: CC BY 4.0
      source: https://commons.wikimedia.org/wiki/File:SINGULARITY_-_Blender_Open_Movie-full_movie.webm
    # 2:15 to 2:22.5 of Commons' original: HDR10 AV1 Main 10-bit, which current GPUs decode.
    clip:
      <<: *sampleClip
      file: sample_3d_animation_4k_hdr10.webm
      seconds: 7.5
      codec: av1
      bitDepth: 10
      hdr10: true
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/f/f2/SINGULARITY_-_Blender_Open_Movie-full_movie.webm", headerLength: 834, start: 254455210, length: 14293364, sha256: 7a9812153aae92b8b58d608c8d8a2fca5351c5bbdb6254646079307bd4480764 }
  - <<: *sampleVideo
    key: anime
    name: Animation
    height: 1080
    audio: stereo Opus
    sample: &solLevante
      title: Sol Levante
      credit: Sol Levante, Netflix and Production I.G, CC BY 4.0, via Wikimedia Commons
      holder: Netflix and Production I.G
      holderUrl: https://opencontent.netflix.com/
      license: https://creativecommons.org/licenses/by/4.0/
      licenseName: CC BY 4.0
      source: https://commons.wikimedia.org/wiki/File:Sol_Levante.webm
      article: https://en.wikipedia.org/wiki/Sol_Levante
    # 1:31 to 1:43.
    clip:
      <<: *sampleClip
      file: sample_anime.webm
      seconds: 12.5
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/transcoded/4/44/Sol_Levante.webm/Sol_Levante.webm.1080p.vp9.webm", headerLength: 991, start: 45210548, length: 5534544, sha256: b922a2619a09f50e4e07ea31a083000c5d0b87ee789a36cf7673e8a4385ef5e5 }
  - <<: *sampleVideo
    key: anime-4k
    name: Animation 4K HDR
    width: 3840
    height: 2160
    audio: stereo Opus
    sample: *solLevante
    # 1:30 to 1:35 of Commons' 4K HDR10 AV1 copy: Professional profile, 4:4:4 12-bit, which GPUs don't decode. 5 s, since it's the largest download.
    clip:
      file: sample_anime_4k_hdr10.webm
      seconds: 5
      codec: av1
      bitDepth: 12
      hdr10: true
      pixelFormat: yuv444p12le
      profile: Professional
      audioCodec: opus
      audioChannels: 2
      piece: { url: "https://upload.wikimedia.org/wikipedia/commons/4/44/Sol_Levante.webm", headerLength: 1022, start: 563867512, length: 21230224, sha256: d1d4c263e3ab895dad850c4110e9161f563414ca5c4609ae095434d4911ac8ae }
      keepAcrossBuilds: true
  - <<: *testVideo
    key: pattern
    name: Test video, H.264
    clip: { file: speed_1080p_h264.mkv, seconds: 10, codec: h264, bitDepth: 8, encoder: libx264, arguments: "{testSource} -c:v libx264 -preset medium -pix_fmt yuv420p {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-hevc
    name: Test video, HEVC
    clip: { file: speed_1080p_hevc.mkv, seconds: 10, codec: hevc, bitDepth: 8, encoder: libx265, arguments: "{testSource} {x265} -pix_fmt yuv420p {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-hevc10
    name: Test video, HEVC 10-bit
    clip: { file: speed_1080p_hevc10.mkv, seconds: 10, codec: hevc, bitDepth: 10, encoder: libx265, arguments: "{testSource} {x265} -pix_fmt yuv420p10le {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-vp9
    name: Test video, VP9
    clip: { file: speed_1080p_vp9.mkv, seconds: 10, codec: vp9, bitDepth: 8, encoder: libvpx-vp9, arguments: "{testSource} -c:v libvpx-vp9 -deadline good -cpu-used 4 -row-mt 1 -b:v 4M -pix_fmt yuv420p {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-av1
    name: Test video, AV1
    # SVT-AV1 runs its C code, as the matrix clips do.
    clip: { file: speed_1080p_av1.mkv, seconds: 10, codec: av1, bitDepth: 8, encoder: libsvtav1, arguments: "{testSource} -c:v libsvtav1 -preset 8 -svtav1-params asm=c -pix_fmt yuv420p {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-1080i
    name: Test video, interlaced
    frameRate: 25
    # Top field first.
    clip: { file: speed_1080i_h264.mkv, seconds: 10, codec: h264, bitDepth: 8, encoder: libx264, interlaced: true, arguments: "{quiet} -f lavfi -i testsrc2=size=1920x1080:rate=25 {audio} -t 10 -vf setfield=tff -c:v libx264 -preset medium -flags +ildct+ilme -x264-params tff=1 -pix_fmt yuv420p {audioOut}", generateMinutes: 10 }
  - <<: *testVideo
    key: pattern-4k-hdr
    name: Test video, 4K HDR
    width: 3840
    height: 2160
    clip: { file: speed_2160p_hdr10.mkv, seconds: 10, codec: hevc, bitDepth: 10, hdr10: true, encoder: libx265, arguments: "{quiet} -f lavfi -i testsrc2=size=3840x2160:rate=24 {audio} -t 10 {x265} -pix_fmt yuv420p10le {hdr10} {audioOut}", generateMinutes: 10 }

defaultVideos: [drama]

# Outputs are every codec at every quality, as a player asks for them, plus decoding alone; keys are codec-quality, e.g. hevc-8mbps.
# Every video codec Jellyfin transcodes to (EncodingHelper.GetVideoEncoder, v12.1).
codecs:
  - { key: h264, name: H.264 }
  - { key: hevc, name: HEVC }
  - { key: av1, name: AV1 }

# jellyfin-web's player quality choices (qualityOptions.js getVideoQualityOptions, v12.1). The server picks the output size from the bitrate and codec (StreamingHelpers.GetStreamingState, ResolutionNormalizer).
qualities:
  - { key: 120mbps, name: 120 Mbps, bitrate: 120000000 }
  - { key: 80mbps, name: 80 Mbps, bitrate: 80000000 }
  - { key: 60mbps, name: 60 Mbps, bitrate: 60000000 }
  - { key: 40mbps, name: 40 Mbps, bitrate: 40000000 }
  - { key: 20mbps, name: 20 Mbps, bitrate: 20000000 }
  - { key: 15mbps, name: 15 Mbps, bitrate: 15000000 }
  - { key: 10mbps, name: 10 Mbps, bitrate: 10000000 }
  - { key: 8mbps, name: 8 Mbps, bitrate: 8000000 }
  - { key: 6mbps, name: 6 Mbps, bitrate: 6000000 }
  - { key: 4mbps, name: 4 Mbps, bitrate: 4000000 }
  - { key: 3mbps, name: 3 Mbps, bitrate: 3000000 }
  - { key: 1.5mbps, name: 1.5 Mbps, bitrate: 1500000 }
  - { key: 720kbps, name: 720 kbps, bitrate: 720000 }
  - { key: 420kbps, name: 420 kbps, bitrate: 420000 }

decode: { key: decode, label: Decode only }

defaultOutputs: [h264-8mbps]

subtitles:
  # An ASS subtitle shown for the whole of any run: "hwprobe subtitle burn-in" from 0:00 to 10:00:00, as base64 SRT.
  text: { file: speed_subtitles.ass, codec: ass, bitDepth: 8, encoder: ass, arguments: "{quiet} -f srt -i \"data:text/plain;base64,MQowMDowMDowMCwwMDAgLS0+IDEwOjAwOjAwLDAwMApod3Byb2JlIHN1YnRpdGxlIGJ1cm4taW4K\" -c:s ass" }
  # FFmpeg's PGS sample; ffmpeg has no PGS encoder, so it's downloaded.
  image: { file: speed_pgs_sub.sup, codec: PGSSUB, bitDepth: 8, download: "https://fate-suite.ffmpeg.org/sub/pgs_sub.sup", sha256: ce6d8ed89cf557e34b90d49c5ce955731935c485b93892f69ab276cfe0c36c27 }

# Accuracy, keyed by SpeedMethod. Seconds per measurement are from runs on real hosts, for the page's estimate; making or downloading clips adds to the first.
methods:
  - { key: Quick, name: Fast, description: "Fast: measures one transcode's speed; concurrent streams aren't counted", seconds: [10, 30] }
  - { key: Confirm, name: Standard, description: "Standard: also counts concurrent streams, starting from one transcode's speed", seconds: [20, 60] }
  - { key: Full, name: Thorough, description: "Thorough: also counts concurrent streams, running 1, 2, 4, 8 and 16 at once; takes longest", seconds: [50, 120] }

defaultMethod: Confirm

repeats:
  - { value: 1, label: Measure each once }
  - { value: 2, label: "Measure each twice, report the median" }
  - { value: 3, label: "Measure each three times, report the median" }

# The run's settings, in the order of Jellyfin's Transcoding page (transcoding.tsx, v12.1), then the client's choices. Labels are jellyfin-web's (en-us.json).
# server: the EncodingOptions property a setting defaults to; switch: on or off; range: whole numbers from low to high; choices: keyed values. Keys are applied by SpeedSettingsOptions.
options:
  # Shown with the backends when QSV works and its probe found the encoder; applied to QSV alone, so VAAPI keeps the server's.
  - { key: QsvLowPowerH264, label: Enable Intel Low-Power H.264 hardware encoder, server: EnableIntelLowPowerH264HwEncoder, backend: qsv, report: EnableIntelLowPowerH264HwEncoder, switch: true }
  - { key: QsvLowPowerHevc, label: Enable Intel Low-Power HEVC hardware encoder, server: EnableIntelLowPowerHevcHwEncoder, backend: qsv, report: EnableIntelLowPowerHevcHwEncoder, switch: true }
  - { key: EnhancedNvdec, label: Enable enhanced NVDEC decoder, server: EnableEnhancedNvdecDecoder, switch: true }
  - { key: PreferNativeDecoder, label: Prefer OS native DXVA or VA-API hardware decoders, server: PreferSystemNativeHwDecoder, switch: true }
  - { key: VppTonemap, label: Enable VPP Tone mapping, server: EnableVppTonemapping, switch: true }
  # Tone mapping only changes HDR inputs; the labels and choices are the Transcoding page's (jellyfin-web transcoding.tsx, en-us.json, v12.1).
  - { key: VideoToolboxTonemap, label: Enable VideoToolbox Tone mapping, server: EnableVideoToolboxTonemapping, switch: true, help: Only HDR inputs are tone mapped. }
  - { key: Tonemap, label: Enable Tone mapping, server: EnableTonemapping, switch: true }
  - key: TonemapAlgorithm
    label: Tone mapping algorithm
    server: TonemappingAlgorithm
    choices:
      - { key: none, label: None }
      - { key: clip, label: Clip }
      - { key: linear, label: Linear }
      - { key: gamma, label: Gamma }
      - { key: reinhard, label: Reinhard }
      - { key: hable, label: Hable }
      - { key: mobius, label: Mobius }
      - { key: bt2390, label: BT.2390 }
  - key: TonemapMode
    label: Tone mapping mode
    server: TonemappingMode
    choices:
      - { key: auto, label: Auto }
      - { key: max, label: MAX }
      - { key: rgb, label: RGB }
      - { key: lum, label: LUM }
      - { key: itp, label: ITP }
  - key: TonemapRange
    label: Tone mapping range
    server: TonemappingRange
    choices:
      - { key: auto, label: Auto }
      - { key: tv, label: TV }
      - { key: pc, label: PC }
  # The page takes any number for these three; the choices are the default and a few others.
  - key: TonemapDesat
    label: Tone mapping desat
    server: TonemappingDesat
    choices:
      - { key: "0", label: "0" }
      - { key: "0.5", label: "0.5" }
      - { key: "1", label: "1" }
      - { key: "2", label: "2" }
  - key: TonemapPeak
    label: Tone mapping peak
    server: TonemappingPeak
    choices:
      - { key: "100", label: "100" }
      - { key: "400", label: "400" }
      - { key: "1000", label: "1000" }
  - key: TonemapParam
    label: Tone mapping param
    server: TonemappingParam
    choices:
      - { key: "0", label: "0" }
      - { key: "0.5", label: "0.5" }
      - { key: "1", label: "1" }
  # EncodingHelper.GetNumberOfThreads treats Auto (-1) and Max (0) alike: ffmpeg picks (v12.1).
  - key: EncodingThreadCount
    label: Transcoding thread count
    server: EncodingThreadCount
    help: The most CPU threads each transcode uses.
    choices:
      - { key: "-1", label: Auto }
      - { key: "1", label: "1" }
      - { key: "2", label: "2" }
      - { key: "3", label: "3" }
      - { key: "4", label: "4" }
      - { key: "5", label: "5" }
      - { key: "6", label: "6" }
      - { key: "7", label: "7" }
      - { key: "8", label: "8" }
      - { key: "9", label: "9" }
      - { key: "10", label: "10" }
      - { key: "11", label: "11" }
      - { key: "12", label: "12" }
      - { key: "13", label: "13" }
      - { key: "14", label: "14" }
      - { key: "15", label: "15" }
      - { key: "16", label: "16" }
      - { key: "0", label: Max }
  - { key: AudioVbr, label: Enable VBR audio encoding, server: EnableAudioVbr, switch: true }
  # Downmixing only changes transcoded 5.1 audio.
  - key: DownmixBoost
    label: Audio boost when downmixing
    server: DownMixAudioBoost
    choices:
      - { key: "1", label: "1" }
      - { key: "1.5", label: "1.5" }
      - { key: "2", label: "2" }
      - { key: "3", label: "3" }
  - key: DownmixAlgorithm
    label: Stereo Downmix Algorithm
    server: DownMixStereoAlgorithm
    help: Only transcoded 5.1 audio is downmixed.
    choices:
      - { key: None, label: None }
      - { key: Dave750, label: Dave750 }
      - { key: NightmodeDialogue, label: NightmodeDialogue }
      - { key: Rfc7845, label: RFC7845 }
      - { key: Ac4, label: AC-4 }
  # Auto, per encoder (EncodingHelper.GetEncoderParam, v12.1).
  - key: EncoderPreset
    label: Encoding preset
    server: EncoderPreset
    backendNotes:
      none: "Software: veryfast for H.264 and HEVC, preset 10 for AV1"
      amf: "AMD AMF: speed"
      nvenc: "Nvidia NVENC: p1, the fastest"
      qsv: "Intel Quicksync (QSV): veryfast"
      vaapi: "VAAPI: the driver's default"
      rkmpp: "Rockchip MPP: the encoder's default"
      videotoolbox: "Apple VideoToolBox: prio_speed 1 (speed first)"
      v4l2m2m: "Video4Linux2: the encoder's default"
    choices:
      - { key: auto, label: Auto }
      - { key: veryslow, label: veryslow }
      - { key: slower, label: slower }
      - { key: slow, label: slow }
      - { key: medium, label: medium }
      - { key: fast, label: fast }
      - { key: faster, label: faster }
      - { key: veryfast, label: veryfast }
      - { key: superfast, label: superfast }
      - { key: ultrafast, label: ultrafast }
    qualityOrder: [veryslow, slower, slow, medium, fast, faster, veryfast, superfast, ultrafast]
  - { key: H265Crf, label: H.265 encoding CRF, server: H265Crf, range: [0, 51], lowerIsBetter: true }
  - { key: H264Crf, label: H.264 encoding CRF, server: H264Crf, range: [0, 51], lowerIsBetter: true, help: CRF only applies to software encoders. }
  - key: DeinterlaceMethod
    label: Deinterlacing method
    server: DeinterlaceMethod
    help: Only interlaced inputs are deinterlaced.
    choices:
      - { key: yadif, label: Yet Another DeInterlacing Filter (YADIF) }
      - { key: bwdif, label: Bob Weaver DeInterlacing Filter (BWDIF) }
    qualityOrder: [bwdif, yadif]
  - { key: DoubleRate, label: Double the frame rate when deinterlacing, server: DeinterlaceDoubleRate, switch: true, qualityOrder: ["true", "false"] }
  - key: Audio
    label: Audio
    help: Copying passes the source's audio through, as for a client that plays it, so only the video is transcoded.
    choices:
      - { key: transcode, label: Transcode to stereo AAC }
      - { key: copy, label: Copy (passthrough) }
  - key: BurnIn
    label: Burn subtitles
    help: Subtitles drawn onto the picture, as for a client that can't show them.
    choices:
      - { key: none, label: None }
      - { key: text, label: Text (ASS) }
      - { key: image, label: Image (PGS) }

# Links the page, the CLI, and the advice point to.
links:
  issueForm: https://github.com/Rinn/jellyfin-plugin-hwprobe/issues/new?template=hardware-report.yml
  notices: https://github.com/Rinn/jellyfin-plugin-hwprobe/blob/main/THIRD-PARTY-NOTICES.md
  # Jellyfin's hardware acceleration guides; vendor pages and anchors are added to it (checked against jellyfin.org on 2026-10-01).
  jellyfinGuides: https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/
  intelLowPowerGuide: https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/intel/#configure-and-verify-lp-mode-on-linux
  # FFmpeg's FATE sample suite, where clips that can't be made are downloaded from.
  fateSuite: https://fate-suite.ffmpeg.org/

# What a run does when the server starts transcoding for a player; keyed by TranscodeAction.
whenTranscoding:
  - { key: Pause, label: "Pause, then repeat the interrupted measurement" }
  - { key: Continue, label: Keep measuring }
  - { key: Cancel, label: Cancel the test }

defaultWhenTranscoding: Pause

# Seconds per measurement; no value for no limit.
timeLimits:
  - { label: No limit }
  - { value: 30, label: 30 seconds }
  - { value: 60, label: 1 minute }
  - { value: 120, label: 2 minutes }
  - { value: 300, label: 5 minutes }

# Jellyfin's Hardware acceleration dropdown, in its order and with its names (jellyfin-web transcoding.tsx), keyed by HwType.
# Jellyfin's ffmpeg leaves out backends for other platforms (AMF needs d3d11va, so Windows only).
# V4L2 and Rockchip encoders are parts of ARM chips, though x86 jellyfin-ffmpeg includes V4L2.
backends:
  - { type: amf, name: AMD AMF, platforms: [windows], platformNote: Windows only }
  - { type: nvenc, name: Nvidia NVENC, platforms: [linux, windows], platformNote: Windows and Linux only }
  - { type: qsv, name: Intel Quicksync (QSV), platforms: [linux, windows], platformNote: Windows and Linux only }
  - { type: vaapi, name: Video Acceleration API (VAAPI), platforms: [linux], platformNote: Linux only }
  - { type: rkmpp, name: Rockchip MPP (RKMPP), platforms: [linux], platformNote: Linux only, armNote: Rockchip devices only }
  - { type: videotoolbox, name: Apple VideoToolBox, platforms: [macos], platformNote: macOS only }
  - { type: v4l2m2m, name: Video4Linux2 (V4L2), platforms: [linux], platformNote: Linux only, armNote: ARM devices only }

# Keyed by PipelineTier.
# GPU engine names as Windows's GPU Engine counters (engtype) and Linux's DRM fdinfo (i915, xe, amdgpu) give them, and what the page calls them.
# Intel's Linux video engine both decodes and encodes, so it can't be split.
gpuEngines:
  VideoDecode: decode
  VideoEncode: encode
  VideoProcessing: video processing
  3D: 3D
  Copy: copy
  Cuda: compute
  video: decode and encode
  vcs: decode and encode
  video-enhance: video processing
  vecs: video processing
  render: 3D
  rcs: 3D
  gfx: 3D
  dec: decode
  enc: encode
  copy: copy
  bcs: copy
  compute: compute
  ccs: compute

tiers:
  FullOpencl: Full GPU pipeline (OpenCL)
  FullVulkan: Full GPU pipeline (Vulkan)
  FullMetal: Full GPU pipeline (Metal)
  FullCuda: Full GPU pipeline (CUDA)
  Limited: GPU scaling only, no GPU tone mapping
  LegacyCopyBack: "Copy-back: filters run on the CPU"

# Keyed by BackendVerdict, for backends that don't work.
verdicts:
  NotPresent: No device found
  PermissionDenied: No permission to open the device
  DevicePresentPipelineBroken: Device found, test transcode failed
  Untested: Not tested

# Keyed by the report's finding codes.
findings:
  opencl-unavailable: "OpenCL unavailable: OpenCL tone mapping fails"
  legacy-copyback: "Copy-back pipeline: filters run on the CPU"
  vulkan-interop-unprobed: Vulkan interop not tested
  unvalidated-backend: Not validated on real hardware

# The settings a speed run started from, as the results list them, in the Transcoding page's order; keyed by SpeedSettings property.
settings:
  enhancedNvdec: Enhanced NVDEC
  preferNativeDecoder: OS native decoders
  lowPower: Intel low power
  tonemap: Tone mapping
  downmix: Stereo downmix
  encodingThreadCount: Transcoding threads
  audioVbr: VBR audio
  encoderPreset: Encoding preset
  crf: Encoding CRF
  deinterlace: Deinterlacing
  audio: Audio
  burnIn: Burned-in subtitles
