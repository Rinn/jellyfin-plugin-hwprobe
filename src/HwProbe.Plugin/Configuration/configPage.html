<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HwProbe</title>
</head>
<body>
    <div id="HwProbeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <style>
            #HwProbeConfigPage table { border-collapse: collapse; margin: 0.25em 0 1em; }
            #HwProbeConfigPage td, #HwProbeConfigPage th { padding: 0.2em 1.5em 0.2em 0; text-align: left; vertical-align: middle; height: 1.8em; }
            #HwProbeConfigPage th { font-weight: 500; opacity: 0.7; }
            #HwProbeConfigPage .hwprobe-section { margin-top: 2em; }
            #HwProbeConfigPage .hwprobe-backends td:first-child, #HwProbeConfigPage .hwprobe-backends th:first-child { width: 18em; }
            #HwProbeConfigPage .hwprobe-backends td:nth-child(2), #HwProbeConfigPage .hwprobe-backends th:nth-child(2) { width: 12em; }
            #HwProbeConfigPage .hwprobe-group td { padding-top: 0.8em; font-weight: 500; }
            #HwProbeConfigPage .hwprobe-group td:nth-child(2) { opacity: 0.7; }
            #HwProbeConfigPage .hwprobe-mark { width: 1.2em; font-weight: bold; }
            #HwProbeConfigPage .hwprobe-on { color: #52b54b; }
            #HwProbeConfigPage .hwprobe-off { color: #e05555; }
            #HwProbeConfigPage .hwprobe-none { opacity: 0.5; }
            #HwProbeConfigPage .hwprobe-reason { opacity: 0.7; }
            #HwProbeConfigPage .hwprobe-warn { color: #e0a030; font-weight: 500; }
            #HwProbeConfigPage .hwprobe-tabs button { margin: 0 0.5em 0.75em 0; padding: 0.4em 1em; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 0.2em; background: transparent; color: inherit; font: inherit; cursor: pointer; }
            #HwProbeConfigPage .hwprobe-tabs button.hwprobe-selected { background: #00a4dc; border-color: #00a4dc; color: #fff; }
            #HwProbeConfigPage details { margin-top: 2em; }
            #HwProbeConfigPage .hwprobe-change { display: flex; align-items: center; gap: 0.5em; margin: 0 0 0.5em; }
            #HwProbeConfigPage .hwprobe-disclosure { padding: 0; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
            #HwProbeConfigPage .hwprobe-change-list { margin: 0 0 1em 1.5em; }
            #HwProbeConfigPage .hwprobe-action { padding: 0 0.6em; line-height: 1.5; font-size: 0.9em; border: 1px solid #00a4dc; border-radius: 0.2em; background: transparent; color: #00a4dc; font: inherit; cursor: pointer; }
            #HwProbeConfigPage .hwprobe-action:disabled { opacity: 0.5; cursor: default; }
            #HwProbeConfigPage .hwprobe-action.hwprobe-danger { border-color: #c62828; color: #c62828; font-weight: bold; }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2>HwProbe</h2>
                <p>Tests which hardware transcoding options work on a Jellyfin server.</p>
                <button is="emby-button" type="button" id="hwprobeRun" class="raised button-submit block">
                    <span>Run probe</span>
                </button>
                <p id="hwprobeStatus"></p>
                <div id="hwprobeChange"></div>
                <p id="hwprobeMessage" class="hwprobe-warn"></p>
                <div id="hwprobeResults"></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                // The server's API uses PascalCase; the report keeps hwprobe's own camelCase schema.
                // No template literals: jellyfin-web's translateHtml treats every dollar sign followed by
                // a brace in the page, scripts included, as a translation key and replaces it.
                const page = document.querySelector('#HwProbeConfigPage');
                const statusText = page.querySelector('#hwprobeStatus');
                const results = page.querySelector('#hwprobeResults');
                const changeText = page.querySelector('#hwprobeChange');
                const messageText = page.querySelector('#hwprobeMessage');
                const columns = ['decode', 'encode', 'tonemap', 'deinterlace', 'subtitles'];
                let pollTimer = null;
                let report = null;
                // Only used to open the configured backend's settings first.
                let encoding = null;
                let trickplay = null;
                let selected = null;
                let history = [];
                let restartRequired = false;

                // The names and order of Jellyfin's Hardware acceleration dropdown.
                const names = {
                    amf: 'AMD AMF',
                    nvenc: 'Nvidia NVENC',
                    qsv: 'Intel Quicksync (QSV)',
                    vaapi: 'Video Acceleration API (VAAPI)',
                    rkmpp: 'Rockchip MPP (RKMPP)',
                    videotoolbox: 'Apple VideoToolBox',
                    v4l2m2m: 'Video4Linux2 (V4L2)'
                };
                const order = Object.keys(names);
                const byDropdown = (a, b) => order.indexOf(a.type) - order.indexOf(b.type);
                const tiers = {
                    FullOpencl: 'Full GPU pipeline (OpenCL)',
                    FullVulkan: 'Full GPU pipeline (Vulkan)',
                    FullMetal: 'Full GPU pipeline (Metal)',
                    Limited: 'GPU scaling only, no GPU tone mapping',
                    LegacyCopyBack: 'Copy-back: filters run on the CPU'
                };
                const verdicts = {
                    NotPresent: 'No device found',
                    PermissionDenied: 'No permission to open the device',
                    DevicePresentPipelineBroken: 'Device found, test transcode failed',
                    Untested: 'Not tested'
                };
                const notes = {
                    'opencl-unavailable': 'OpenCL unavailable: OpenCL tone mapping fails',
                    'legacy-copyback': 'Copy-back pipeline: filters run on the CPU',
                    'vulkan-interop-unprobed': 'Vulkan interop not tested',
                    'unvalidated-backend': 'Not validated on real hardware'
                };

                function el(tag, text, className) {
                    const node = document.createElement(tag);
                    if (text !== undefined && text !== null) {
                        node.textContent = text;
                    }
                    if (className) {
                        node.className = className;
                    }
                    return node;
                }

                function row(table, cells) {
                    const tr = el('tr');
                    for (const c of cells) {
                        tr.appendChild(c instanceof Node ? c : el('td', c));
                    }
                    table.appendChild(tr);
                    return tr;
                }

                function section(title) {
                    const div = el('div', null, 'hwprobe-section');
                    div.appendChild(el('h3', title));
                    results.appendChild(div);
                    return div;
                }

                // Available and Unavailable share one layout: backend, device, status.
                function backendTable(rows) {
                    const table = el('table', null, 'hwprobe-backends');
                    row(table, [el('th', 'Backend'), el('th', 'Device'), el('th', 'Status')]);
                    for (const [type, device, status, fix] of rows) {
                        row(table, [names[type] || type, device || '-', resultCell(status, fix, 'hwprobe-reason')]);
                    }
                    return table;
                }

                // Jellyfin's ffmpeg leaves out backends for other platforms (AMF needs d3d11va, so Windows only).
                const platforms = {
                    videotoolbox: [['macos'], 'macOS only'],
                    amf: [['windows'], 'Windows only'],
                    rkmpp: [['linux'], 'Linux only'],
                    vaapi: [['linux'], 'Linux only'],
                    v4l2m2m: [['linux'], 'Linux only'],
                    qsv: [['linux', 'windows'], 'Windows and Linux only'],
                    nvenc: [['linux', 'windows'], 'Windows and Linux only'],
                };

                function notBuilt(type) {
                    const platform = platforms[type];
                    return wrongVendor(type)
                        || (platform && platform[0].indexOf(report.host.os) === -1 ? platform[1] : null)
                        || wrongArchitecture(type)
                        || 'Not built into ffmpeg';
                }

                // V4L2 and Rockchip encoders are parts of ARM chips, though x86 jellyfin-ffmpeg includes V4L2.
                const armOnly = { v4l2m2m: 'ARM devices only', rkmpp: 'Rockchip devices only' };

                function wrongArchitecture(type) {
                    const arch = report.host.architecture || 'unknown';
                    return armOnly[type] && arch !== 'unknown' && arch.indexOf('arm') !== 0 ? armOnly[type] : null;
                }

                // From the host's PCI display controllers, listed even without a driver and seen from containers too;
                // Windows and non-PCI GPUs report none, so nothing is said there.
                const vendors = { qsv: ['0x8086', 'Intel only'], nvenc: ['0x10de', 'NVIDIA only'] };

                function wrongVendor(type) {
                    const gpus = (report.host.gpuVendors || []).map(v => v.toLowerCase());
                    const vendor = vendors[type];
                    return vendor && gpus.length && gpus.indexOf(vendor[0]) === -1 ? vendor[1] : null;
                }

                // A result with a fix links to the fix's guide; the fix's action is the tooltip.
                function resultCell(text, fix, className) {
                    const td = el('td', null, className);
                    if (fix && fix.url) {
                        const a = el('a', text || fix.action, 'button-link');
                        a.href = fix.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.title = fix.action;
                        td.appendChild(a);
                    } else {
                        td.textContent = text || '';
                        if (fix) {
                            td.title = fix.action;
                        }
                    }
                    return td;
                }

                function groupRow(table, title) {
                    row(table, [el('td'), el('td', title)]).className = 'hwprobe-group';
                }

                function mark(state) {
                    if (state === 'TurnOn' || state === 'Optional') {
                        return el('td', '✓', 'hwprobe-mark hwprobe-on');
                    }
                    return state === 'LeaveOff' ? el('td', '✗', 'hwprobe-mark hwprobe-off') : el('td', '–', 'hwprobe-mark hwprobe-none');
                }

                function outcomeRow(table, label, outcome) {
                    const state = outcome === 'Pass' ? 'TurnOn' : (outcome ? 'LeaveOff' : 'NotTested');
                    const reason = outcome === 'Pass' ? '' : (outcome ? 'Test failed' : 'Not tested');
                    row(table, [mark(state), label, el('td', reason, 'hwprobe-reason'), el('td')]);
                }

                function firstOutcome(cells) {
                    const values = Object.values(cells || {});
                    return values.indexOf('Pass') !== -1 ? 'Pass' : values[0];
                }

                function action(text, onClick) {
                    const button = el('button', text, 'hwprobe-action');
                    button.type = 'button';
                    button.addEventListener('click', () => {
                        button.disabled = true;
                        onClick();
                    });
                    return button;
                }

                // The server's current value for a setting key, or undefined when unknown.
                function current(setting) {
                    if (!encoding) {
                        return undefined;
                    }
                    if (setting.indexOf('Trickplay:') === 0) {
                        return trickplay ? trickplay[setting.substring('Trickplay:'.length)] : undefined;
                    }
                    if (setting === 'DeinterlaceMethod:bwdif') {
                        return encoding.DeinterlaceMethod === 'bwdif';
                    }
                    const prefix = 'HardwareDecodingCodecs:';
                    if (setting.indexOf(prefix) === 0) {
                        return (encoding.HardwareDecodingCodecs || []).indexOf(setting.substring(prefix.length)) !== -1;
                    }
                    return encoding[setting];
                }

                function differs(advice) {
                    const value = current(advice.setting);
                    return advice.state !== 'NotTested' && typeof value === 'boolean' && value !== (advice.state === 'TurnOn' || advice.state === 'Optional');
                }

                function isConfigured(backend) {
                    if (!encoding || encoding.HardwareAccelerationType !== backend.type) {
                        return false;
                    }
                    const device = backend.type === 'vaapi' ? encoding.VaapiDevice : (backend.type === 'qsv' ? encoding.QsvDevice : '');
                    return !device || device === backend.device;
                }

                function post(path, body) {
                    messageText.textContent = '';
                    const request = { type: 'POST', url: ApiClient.getUrl(path), dataType: 'json' };
                    if (body) {
                        request.data = JSON.stringify(body);
                        request.contentType = 'application/json';
                    }
                    return ApiClient.ajax(request).then(result => {
                        messageText.textContent = result.Reason || '';
                    }, response => (response && response.json ? response.json() : Promise.resolve({})).then(
                        result => { messageText.textContent = (result && result.Reason) || 'The change was refused.'; },
                        () => { messageText.textContent = 'The change was refused.'; })).then(loadReport);
                }

                function apply(advice) {
                    return post('HwProbe/Apply', advice.map(a => ({ Setting: a.setting, Value: a.state === 'TurnOn' || a.state === 'Optional' })));
                }

                // The old server can still answer for a moment after the restart request, so wait until the
                // plugin reports no pending restart, which only a new server does.
                function waitForServer(deadline) {
                    const retry = () => {
                        if (Date.now() > deadline) {
                            messageText.textContent = 'Jellyfin didn\'t come back. Reload the page.';
                            return;
                        }
                        setTimeout(() => waitForServer(deadline), 2000);
                    };
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(pending => {
                            if (pending === true) {
                                retry();
                                return;
                            }
                            messageText.textContent = '';
                            loadStatus();
                        }, retry);
                }

                function restart() {
                    messageText.textContent = 'Restarting…';
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('System/Restart') })
                        .then(() => waitForServer(Date.now() + 180000), () => { messageText.textContent = 'Restart failed.'; });
                }

                function renderChange() {
                    changeText.replaceChildren();
                    const last = history.filter(e => e.Kind !== 'Revert' && !e.RevertedUtc).pop();
                    if (!last) {
                        return;
                    }
                    // A disclosure button beside Revert rather than a summary around it: buttons can't nest, and a
                    // details element would widen with its table and push Revert along.
                    const line = el('div', null, 'hwprobe-change');
                    const toggle = el('button', '▸ Last change: ' + new Date(last.TimeUtc).toLocaleString(), 'hwprobe-disclosure');
                    toggle.type = 'button';
                    toggle.setAttribute('aria-expanded', 'false');
                    line.appendChild(toggle);
                    line.appendChild(action('Revert', () => post('HwProbe/Revert')));
                    changeText.appendChild(line);

                    // What Revert sets each option to, marked as on the settings list.
                    const table = el('table', null, 'hwprobe-change-list');
                    table.style.display = 'none';
                    toggle.addEventListener('click', () => {
                        const open = table.style.display === 'none';
                        table.style.display = open ? '' : 'none';
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = (open ? '▾' : '▸') + toggle.textContent.substring(1);
                    });
                    for (const c of last.Changes) {
                        // Revert leaves a setting that was changed again since; the server skips it too.
                        const kept = currentText(c.Setting) !== undefined && currentText(c.Setting) !== c.NewValue;
                        const value = kept ? currentText(c.Setting) : c.OldValue;
                        const flag = value === 'true' || value === 'false';
                        const label = c.Label || settingLabel(c.Setting);
                        const note = kept ? 'Changed since, kept' : (flag ? '' : valueText(c.Setting, value));
                        const marker = kept ? mark('NotTested') : flag ? mark(value === 'true' ? 'TurnOn' : 'LeaveOff') : el('td');
                        row(table, [marker, label, el('td', note, 'hwprobe-reason')]);
                    }
                    changeText.appendChild(table);
                }

                const settingNames = {
                    HardwareAccelerationType: 'Hardware acceleration',
                    VaapiDevice: 'VA-API device',
                    QsvDevice: 'QSV device',
                };

                // For changes recorded without a label: the label from the latest advice, else a plain name.
                function settingLabel(setting) {
                    for (const b of (report && report.backends) || []) {
                        const a = (b.settings || []).find(x => x.setting === setting);
                        if (a) {
                            return a.section === 'Trickplay' ? 'Trickplay: ' + a.label : a.label;
                        }
                    }
                    return settingNames[setting] || setting;
                }

                // The current value in the form history entries store it, or undefined when unknown.
                function currentText(setting) {
                    if (setting === 'HardwareAccelerationType' || setting === 'VaapiDevice' || setting === 'QsvDevice') {
                        return encoding ? String(encoding[setting] || '') : undefined;
                    }
                    const value = current(setting);
                    return typeof value === 'boolean' ? String(value) : undefined;
                }

                function valueText(setting, value) {
                    if (value === 'true' || value === 'false') {
                        return value === 'true' ? 'On' : 'Off';
                    }
                    if (setting === 'HardwareAccelerationType') {
                        return value === 'none' ? 'None' : (names[value] || value);
                    }
                    return value || '-';
                }

                function renderSettings(container, viable) {
                    container.replaceChildren();
                    if (restartRequired) {
                        const pending = el('p', 'Backend changed; Jellyfin needs a restart. ');
                        const button = action('Restart Jellyfin', restart);
                        button.classList.add('hwprobe-danger');
                        pending.appendChild(button);
                        container.appendChild(pending);
                    }
                    if (viable.length > 1) {
                        const tabs = el('div', null, 'hwprobe-tabs');
                        for (const b of viable) {
                            const button = el('button', names[b.type] || b.type, b === selected ? 'hwprobe-selected' : '');
                            button.type = 'button';
                            button.addEventListener('click', () => { selected = b; renderSettings(container, viable); });
                            tabs.appendChild(button);
                        }
                        container.appendChild(tabs);
                    }

                    const configured = isConfigured(selected);
                    if (!configured) {
                        const switcher = el('p', 'Not the configured backend. ');
                        switcher.appendChild(action('Use this backend', () => post('HwProbe/UseBackend', { Type: selected.type, Device: selected.device })));
                        container.appendChild(switcher);
                    }

                    const settings = selected.settings || [];
                    const table = el('table');
                    const everything = configured ? settings.filter(differs) : [];
                    const header = el('td');
                    if (everything.length > 1) {
                        header.appendChild(action('Apply all', () => apply(everything)));
                    }
                    row(table, [el('th'), el('th', 'Option'), el('th', 'Result'), header]);
                    let group = null;
                    for (const a of settings.filter(x => !x.hidden || differs(x))) {
                        if (a.section !== group) {
                            group = a.section;
                            const pending = configured ? settings.filter(x => x.section === group && differs(x)) : [];
                            const cell = el('td');
                            if (pending.length > 1) {
                                cell.appendChild(action('Apply section', () => apply(pending)));
                            }
                            row(table, [el('td'), el('td', group), el('td'), cell]).className = 'hwprobe-group';
                        }
                        const cell = el('td');
                        if (configured && differs(a)) {
                            cell.appendChild(action('Apply', () => apply([a])));
                        }
                        row(table, [mark(a.state), a.label, resultCell(a.note, a.fix, 'hwprobe-reason'), cell]);
                    }
                    groupRow(table, 'Also tested');
                    outcomeRow(table, 'Hardware deinterlacing', firstOutcome(selected.deinterlace));
                    outcomeRow(table, 'Subtitle burn-in', firstOutcome(selected.subtitles));
                    container.appendChild(table);
                }

                function renderDetails(r) {
                    const details = el('details');
                    details.appendChild(el('summary', 'Test details'));

                    const table = el('table');
                    row(table, [el('th', 'Backend'), el('th', 'Device'), el('th', 'Column'), el('th', 'Test'), el('th', 'Result')]);
                    for (const b of r.backends) {
                        for (const column of columns) {
                            for (const [key, outcome] of Object.entries(b[column] || {})) {
                                row(table, [b.type, b.device || '-', column, key, outcome]);
                            }
                        }
                    }
                    details.appendChild(table);
                    return details;
                }

                function renderNotes() {
                    // Low-power findings are already in the settings list.
                    const grouped = {};
                    for (const f of report.findings.filter(x => x.code.indexOf('lowpower') === -1)) {
                        const backend = f.message.split(' ')[0].replace(':', '');
                        (grouped[f.code] = grouped[f.code] || { finding: f, backends: [] }).backends.push(names[backend] || backend);
                    }
                    const codes = Object.keys(grouped);
                    if (!codes.length) {
                        return;
                    }
                    const table = el('table');
                    row(table, [el('th', 'Note'), el('th', 'Backends')]);
                    for (const code of codes) {
                        const g = grouped[code];
                        row(table, [resultCell(notes[code] || g.finding.message, g.finding.fix, g.finding.severity === 'Warn' ? 'hwprobe-warn' : ''), g.backends.join(', ')]);
                    }
                    section('Notes').appendChild(table);
                }

                function render() {
                    results.replaceChildren();
                    if (!report) {
                        return;
                    }

                    const viable = report.backends.filter(b => b.verdict === 'Viable').sort(byDropdown);
                    const available = section('Available');
                    if (viable.length === 0) {
                        available.appendChild(el('p', 'None'));
                    } else {
                        available.appendChild(backendTable(viable.map(b => [b.type, b.device, tiers[b.tier] || ''])));

                        if (!selected || viable.indexOf(selected) === -1) {
                            selected = viable.find(b => encoding && b.type === encoding.HardwareAccelerationType) || viable[0];
                        }
                        const container = el('div');
                        section('Settings').appendChild(container);
                        renderSettings(container, viable);
                    }

                    const unavailable = report.backends.filter(b => b.verdict !== 'Viable')
                        .map(b => b.verdict === 'NotPresent' && (wrongVendor(b.type) || wrongArchitecture(b.type))
                            ? [b.type, '', wrongVendor(b.type) || wrongArchitecture(b.type)]
                            : [b.type, b.verdict === 'NotPresent' ? '' : b.device, verdicts[b.verdict] || b.verdict, b.fix])
                        .concat(Object.entries(report.stageA.types || {}).filter(([, s]) => s === 'NotBuilt').map(([t]) => [t, '', notBuilt(t)]))
                        .sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
                    if (unavailable.length) {
                        section('Unavailable').appendChild(backendTable(unavailable));
                    }

                    renderNotes();
                    results.appendChild(renderDetails(report));
                }

                function loadReport() {
                    const config = ApiClient.getNamedConfiguration('encoding').then(c => { encoding = c; }, () => { encoding = null; });
                    const server = ApiClient.getServerConfiguration().then(c => { trickplay = c.TrickplayOptions || null; }, () => { trickplay = null; });
                    const data = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Report'), dataType: 'json' })
                        .then(r => { report = r; }, () => { report = null; statusText.textContent = 'No results yet.'; });
                    const changes = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/History'), dataType: 'json' })
                        .then(h => { history = h || []; }, () => { history = []; });
                    const pending = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(r => { restartRequired = r === true; }, () => { restartRequired = false; });
                    return Promise.all([config, server, data, changes, pending]).then(() => { renderChange(); render(); });
                }

                // jellyfin-web keeps a loaded plugin page until the browser reloads, so after an update this tab could
                // still be running the old page.
                let loadedVersion = null;

                function loadStatus() {
                    return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Status'), dataType: 'json' }).then(s => {
                        loadedVersion = loadedVersion || s.HwProbeVersion;
                        if (s.HwProbeVersion && s.HwProbeVersion !== loadedVersion) {
                            messageText.replaceChildren(document.createTextNode('HwProbe was updated. Reload the page to see the new version. '));
                            messageText.appendChild(action('Reload', () => location.reload()));
                        }
                        if (s.State === 'Running') {
                            statusText.textContent = 'Probing…';
                            pollTimer = setTimeout(loadStatus, 3000);
                            return;
                        }
                        statusText.textContent = s.LastError ? 'Last probe failed: ' + s.LastError : (s.LastCompletedUtc ? 'Last probe: ' + new Date(s.LastCompletedUtc).toLocaleString() : '');
                        loadReport();
                    });
                }

                page.querySelector('#hwprobeRun').addEventListener('click', () => {
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Run') })
                        .then(loadStatus, () => { statusText.textContent = 'Could not start: a probe is running or a session is transcoding.'; });
                });

                page.addEventListener('pageshow', loadStatus);
                page.addEventListener('pagehide', () => clearTimeout(pollTimer));
            })();
        </script>
    </div>
</body>
</html>
