                        div.appendChild(el('div', 'Each library\u2019s licence text is in THIRD-PARTY-NOTICES.md in the plugin\u2019s folder; the command-line tool\u2019s are in its archive.', 'fieldDescription'));
                    };
                    if (libraryList) {
                        draw(libraryList);
                    } else {
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Libraries'), dataType: 'json' })
                            .then(draw, () => div.appendChild(el('div', 'The library list didn\u2019t load.', 'secondaryText')));
                    }
                    return div;
                }

                function renderHelp(container) {
                    fold(container, 'Diagnostics', true).appendChild(renderReporting());
                    fold(container, 'Cache').appendChild(renderCache());
                    fold(container, 'Third-Party Notices').appendChild(renderLibraries());
                }

                // What the results area last drew, so a poll that changes only the time left doesn't redraw it under the cursor.
                let speedDrawn = null;
                let speedProgressParts = null;

                // The loading bar a running probe or performance test shows: done / total on the left, what's running in the middle,
                // and how long it has run on the right; the item in progress pulses after the finished ones. update() takes
                // { done, total, text, elapsedSeconds, working }, so a poll changes the bar without rebuilding it.
                function loadBar() {
                    const bar = el('div', null, 'hwprobe-loadbar');
                    const fill = el('div');
                    const current = el('div', null, 'hwprobe-current');
                    const label = el('span');
                    const count = el('span');
                    const text = el('span');
                    const elapsed = el('span');
                    label.append(count, text, elapsed);
                    bar.append(fill, current, label);
                    bar.update = p => {
                        fill.style.width = (p.total ? 100 * p.done / p.total : 0) + '%';
                        const working = p.working && p.total && p.done < p.total;
                        current.style.display = working ? '' : 'none';
                        if (working) {
                            current.style.left = (100 * p.done / p.total) + '%';
                            current.style.width = (100 / p.total) + '%';
                        }
                        // The count is padded with figure spaces to the total's width, so the text doesn't shift.
                        count.textContent = p.total ? String(p.done).padStart(String(p.total).length, '\u2007') + ' / ' + p.total : '';
                        text.textContent = p.text || '';
                        elapsed.textContent = elapsedText(p.elapsedSeconds);
                    };
                    return bar;
                }

                // How long a run has been going, as mm:ss, or hh:mm:ss from an hour.
                function elapsedText(seconds) {
                    if (seconds === null || seconds === undefined) {
                        return '';
                    }
                    const total = Math.max(0, seconds);
                    const [h, m, sec] = [Math.floor(total / 3600), Math.floor(total / 60) % 60, total % 60];
                    const two = n => String(n).padStart(2, '0');
                    return (h ? two(h) + ':' : '') + two(m) + ':' + two(sec);
                }

                // A performance test's progress for the bar: across the whole suite in a suite.
                function speedBarState(s) {
                    const c = speedCounts(s);
                    return { done: c.done, total: c.total, text: speedStatusText(s), elapsedSeconds: s.ElapsedSeconds, working: s.Phase !== 'Paused' && s.Phase !== 'Cancelling' };
                }

                // A probe's progress for the bar: tests done, and the step running.
                function probeBarState(s) {
                    return { done: s.Done || 0, total: s.Total || 0, text: s.Step || 'Probing\u2026', elapsedSeconds: s.ElapsedSeconds, working: true };
                }

                function renderSpeedResults(poll) {
                    syncRunPicker();
                    const drawn = JSON.stringify([speedLive && speedLive.results, speedReport && speedReport.generatedUtc, speedProgress && speedProgress.Phase, speedProgress && speedProgress.Done]);
                    // A poll redraws only the bar unless the results or the run's phase changed.
                    if (poll === true && drawn === speedDrawn && speedProgress && speedProgressParts) {
                        speedProgressParts.update(speedBarState(speedProgress));
                        return;
                    }
                    speedDrawn = drawn;
                    speedProgressParts = null;
                    speedResults.replaceChildren();
                    if (speedProgress) {
                        const box = el('div', null, 'paperList hwprobe-card hwprobe-progress-card');
                        const line = el('div', null, 'hwprobe-row');

                        const bar = loadBar();
                        bar.update(speedBarState(speedProgress));
                        line.appendChild(bar);
                        const buttons = el('div', null, 'hwprobe-row hwprobe-end');
                        const cancel = action('Cancel', () => {
                            cancel.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Speed/Cancel') }).then(loadStatus, loadStatus);
                        }, 'raised button-delete');
                        const cancelling = speedProgress.Phase === 'Cancelling';
                        cancel.disabled = cancelling;
                        const paused = speedProgress.Phase === 'Paused' || speedProgress.Phase === 'Pausing';
                        const pause = action(paused ? 'Resume' : 'Pause', () => {
                            pause.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl(paused ? 'HwProbe/Speed/Resume' : 'HwProbe/Speed/Pause') }).then(loadStatus, loadStatus);
                        }, 'raised');
                        pause.disabled = cancelling;
                        buttons.appendChild(pause);
                        buttons.appendChild(cancel);
                        line.appendChild(buttons);
                        box.appendChild(line);
                        speedResults.appendChild(box);
                        speedProgressParts = bar;
                    }
                    const shown = speedLive || speedReport;
                    if (shown && !speedProgress) {
                        speedResults.appendChild(renderSuggestions());
                    }
                    if (shown && shown.results.length) {
                        speedResults.appendChild(speedMatrix(shown));
                    } else if (!speedProgress) {
                        speedResults.appendChild(el('p', 'No performance tests available.', 'secondaryText'));
                    }
                    if (shown && shown.suiteStartedUtc && !speedProgress) {
                        speedResults.appendChild(renderSuiteComparison(shown));
                    }
                }

                // Saved runs by id, for the suite comparison; a saved run never changes.
                const savedRuns = new Map();

                // One row per backend, input, and output, with a column per step of the suite the shown run belongs to.
                function renderSuiteComparison(shown) {
                    const div = el('div');
                    const steps = speedHistory.filter(h => h.SuiteStartedUtc && Date.parse(h.SuiteStartedUtc) === Date.parse(shown.suiteStartedUtc))
                        .sort((a, b) => Date.parse(a.GeneratedUtc) - Date.parse(b.GeneratedUtc));
                    const load = h => savedRuns.has(h.Id) ? Promise.resolve(savedRuns.get(h.Id))
                        : ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedHistory/' + h.Id), dataType: 'json' }).then(r => { savedRuns.set(h.Id, r); return r; });
                    Promise.all(steps.map(load)).then(reports => {
                        const section = fold(div, 'Detailed statistics', true, null, 'suite');
                        const listed = suiteList.find(x => x.Name === shown.suite);
                        if (listed && listed.Notes) {
                            section.appendChild(noteBanner(listed.Notes));
                        }
                        const keyOf = x => [x.type, x.device, x.test, x.variant || ''].join('|');
                        const rows = [];
                        for (const x of reports.flatMap(r => r.results)) {
                            if (!x.pending && !rows.some(o => keyOf(o) === keyOf(x))) {
                                rows.push(x);
                            }
                        }
                        const sameType = t => rows.some(x => x.type === t && rows.some(o => o.type === t && o.device !== x.device));
                        const backendName = x => (names[x.type] || x.type) + (x.type !== 'none' && sameType(x.type) ? ' ' + x.device : '');
                        const counted = reports.every(r => r.method !== 'Quick');
                        const table = el('table', null, 'hwprobe-full');
                        // Each step gets its measured resources beside its speed, under a heading naming the step.
                        const kinds = measuredResources(reports.flatMap(r => r.results));
                        if (kinds.length) {
                            const top = el('tr');
                            [0, 1, 2].forEach(() => top.appendChild(el('th')));
                            for (const h of steps) {
                                const th = el('th', h.SuiteStep, 'hwprobe-num');
                                th.colSpan = kinds.length + 1;
                                top.appendChild(th);
                            }
                            table.appendChild(top);
                            row(table, [el('th', 'Backend'), el('th', 'Input'), el('th', 'Output')].concat(steps.flatMap(() => [el('th', 'Speed', 'hwprobe-num secondaryText')].concat(kinds.map(k => el('th', resourceHeaders[k] || k, 'hwprobe-num secondaryText'))))));
                        } else {
                            row(table, [el('th', 'Backend'), el('th', 'Input'), el('th', 'Output')].concat(steps.map(h => el('th', h.SuiteStep, 'hwprobe-num'))));
                        }
                        for (const key of rows) {
                            const found = reports.map(r => r.results.find(x => keyOf(x) === keyOf(key)));
                            const speeds = found.map(x => x && x.fps && x.frameRate ? x.fps / x.frameRate : null);
                            const fastest = Math.max(0, ...speeds.filter(v => v));
                            const cells = found.map((x, i) => {
                                const td = el('td', null, 'hwprobe-num' + (speeds[i] && speeds[i] === fastest && steps.length > 1 ? ' hwprobe-best' : ''));
                                td.dataset.sort = speeds[i] ? String(speeds[i]) : '';
                                td.textContent = speeds[i] ? speeds[i].toFixed(1) + '\u00d7' : x ? '\u2013' : '';
                                if (speeds[i] && counted) {
                                    td.appendChild(el('span', ' ' + streamsText(x), 'hwprobe-small secondaryText'));
                                }
                                td.title = [speeds[i] ? speeds[i].toFixed(2) + '\u00d7 real time' : '', speeds[i] && counted ? streamsText(x) + ' concurrent streams' : '', x && x.note ? noteText(x.note) : ''].filter(t => t).join('\n');
                                return [td].concat(resourceCells(x, false, kinds));
                            }).flat();
                            row(table, [el('td', backendName(key)), el('td', key.video || key.label || key.test), el('td', (key.output || '') + (key.variant ? ' (' + key.variant + ')' : ''))].concat(cells));
                        }
                        const scroll = el('div', null, 'hwprobe-scroll');
                        if (kinds.length) {
                            divideGroups(table, 3, kinds.length + 1);
                        }
                        scroll.appendChild(sortable(table, 'suite'));
                        section.appendChild(scroll);
                    }, () => {});
                    return div;
                }

                // A catalog option's value as its field shows it; the Internet streaming bitrate limit, the one server setting suggestions change that isn't an option, in Mbps.
                function optionValueText(key, value) {
                    const option = runOptions.find(o => o.Key === key);
                    if (!option && serverLabels[key]) {
                        return value === '0' ? 'No limit' : Number(value) / 1e6 + ' Mbps';
                    }
                    const choice = option && option.Choices ? option.Choices.find(c => c.Key === value) : null;
                    return choice ? choice.Label : value === 'true' ? 'On' : value === 'false' ? 'Off' : value;
                }

                // How much more efficient a suggestion is, e.g. "30% less CPU and 20% less memory".
                function savingsText(savings) {
                    const parts = savings.map(x => Math.round(x.Fraction * 100) + '% less ' + (resourceNames[x.Resource] || x.Resource));
                    return andList(parts);
                }

                // Alternatives with a serial comma: "a", "a or b", "a, b, or c".
                function orList(items) {
                    return items.length > 2 ? items.slice(0, -1).join(', ') + ', or ' + items[items.length - 1] : items.join(' or ');
                }

                // A result's note without the memory addresses ffmpeg prints after a component's name ("[out#0/null @ 0x55e590e68280]").
                function noteText(note) {
                    return note ? note.replace(/ @ 0x[0-9a-f]+/gi, '') : note;
                }

                // Items with a serial comma: "a", "a and b", "a, b, and c".
                function andList(items) {
                    return items.length > 2 ? items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1] : items.join(' and ');
                }

                // For the value that avoids a drawback, the suggestion for the value that has it, each compared with the other's value.
                function suggestionCounterpart(list, s) {
                    const kinds = ['FasterSetting', 'EfficientSetting', 'HigherQuality', 'BitrateLimit'];
                    return s.Kind === 'Compatible' ? list.find(o => kinds.includes(o.Kind) && o.Setting === s.Setting && s.Others.includes(o.Value) && o.Others.includes(s.Value)) || null : null;
                }

                // A suggestion as a table with a row per value, backend, or output.
                // Each row is { text, value, speed, streams, capped, speeds, savings, lower, current, action, description, best }; speeds holds the speed per output, lower is null where quality wasn't compared, and best tints the recommended row.
                // Hovering the heading or a row's name shows Jellyfin's own description of the setting.
                function suggestionTable(label, rows, option, notes, description) {
                    const div = el('div');
                    const counted = v => v !== null && v !== undefined;
                    // Each column is { name, value, kind, group, title }; adjacent columns of one group share a heading above them.
                    const columns = [];
                    if (rows.some(r => r.backend)) {
                        columns.push({ name: 'Fastest backend', value: r => r.backend });
                    }
                    // A column per output where the rows were measured on more than one, so a value that wins on one output and loses on another shows both.
                    const outputs = [];
                    rows.forEach(r => (r.speeds || []).forEach(x => {
                        if (!outputs.some(o => o.Label === x.Label)) {
                            outputs.push(x);
                        }
                    }));
                    const perOutput = outputs.length > 1 && rows.every(r => r.speeds && r.speeds.length);
                    if (perOutput) {
                        const oneVideo = outputs.every(o => o.Video === outputs[0].Video);
                        const streamsCounted = rows.some(r => r.speeds.some(x => counted(x.Streams)));
                        // The output names the column; two that would read alike, measured with other audio or inputs, take their full labels.
                        const short = o => (oneVideo || !o.Video ? '' : o.Video + ' \u2192 ') + (o.Output || o.Label);
                        for (const o of outputs) {
                            const at = r => r.speeds.find(x => x.Label === o.Label);
                            const group = outputs.filter(x => short(x) === short(o)).length > 1 ? o.Label : short(o);
                            columns.push({ name: 'Speed', value: r => at(r) ? at(r).Speed.toFixed(2) + '\u00d7 real time' : '\u2013', kind: 'hwprobe-num hwprobe-divide', group, title: o.Label });
                            if (streamsCounted) {
                                columns.push({ name: 'Concurrent streams', value: r => at(r) && counted(at(r).Streams) ? at(r).Streams + (at(r).StreamsCapped ? '+' : '') : '\u2013', kind: 'hwprobe-num', group, title: o.Label });
                            }
                        }
                    } else {
                        if (rows.every(r => counted(r.speed))) {
                            columns.push({ name: 'Speed', value: r => r.speed.toFixed(2) + '\u00d7 real time', kind: 'hwprobe-num' });
                        }
                        if (rows.every(r => counted(r.streams))) {
                            columns.push({ name: 'Concurrent streams', value: r => r.streams + (r.capped ? '+' : ''), kind: 'hwprobe-num' });
                        }
                    }
                    if (rows.some(r => r.savings.length)) {
                        columns.push({ name: 'Resources', value: r => r.savings.length ? savingsText(r.savings) : '\u2013' });
                    }
                    if (rows.some(r => counted(r.lower))) {
                        columns.push({ name: 'Quality', value: r => !counted(r.lower) ? '\u2013' : r.lower ? 'Lower' : 'Higher' });
                    }
                    if (option && option.CompatibleValue) {
                        columns.push({ name: 'Compatibility', value: r => r.value === option.CompatibleValue ? 'Higher' : 'Lower' });
                    }
                    // The columns after the outputs' start with a divider too.
                    const after = columns.findIndex((c, i) => !c.group && i > 0 && columns[i - 1].group);
                    if (after >= 0) {
                        columns[after].kind = ((columns[after].kind || '') + ' hwprobe-divide').trim();
                    }
                    const table = el('table', null, 'hwprobe-full');
                    // The action column keeps one width, with or without a button, so it lines up from one suggestion's table to the next.
                    const described = description || (option ? option.Description : null) || '';
                    const heading = el('th', label);
                    heading.title = described;
                    if (perOutput) {
                        const top = el('tr');
                        top.appendChild(el('th', null, 'hwprobe-mark'));
                        top.appendChild(el('th'));
                        for (let i = 0; i < columns.length; i++) {
                            const c = columns[i];
                            const th = el('th', c.group || null, c.group ? 'hwprobe-num hwprobe-divide' : c.kind);
                            if (c.group) {
                                th.title = c.title;
                                while (i + 1 < columns.length && columns[i + 1].group && columns[i + 1].title === c.title) {
                                    th.colSpan += 1;
                                    i++;
                                }
                            }
                            top.appendChild(th);
                        }
                        top.appendChild(el('th', null, 'hwprobe-action'));
                        table.appendChild(top);
                    }
                    // The first column marks the server's own value, as Recommended Settings marks its advice: on, or not in use.
                    row(table, [el('th', null, 'hwprobe-mark'), heading].concat(columns.map(c => el('th', c.name, c.group ? c.kind + ' secondaryText' : c.kind)), [el('th', null, 'hwprobe-action')]));
                    for (const r of rows) {
                        const cell = el('td', null, 'hwprobe-action');
                        if (r.action) {
                            cell.appendChild(r.action);
                        }
                        const marker = el('td', null, 'hwprobe-mark');
                        const glyph = el('span', r.glyph || (r.current ? '\u2705' : '\u2796'), 'hwprobe-emoji');
                        glyph.title = r.glyphTitle || (r.current ? 'The server\u2019s setting' : 'Not in use');
                        glyph.setAttribute('role', 'img');
                        glyph.setAttribute('aria-label', glyph.title);
                        marker.appendChild(glyph);
                        const name = el('td', r.text);
                        name.title = r.description || described;
                        const tr = row(table, [marker, name].concat(columns.map(c => el('td', c.value(r), c.kind)), [cell]));
                        if (r.best) {
                            [...tr.cells].forEach(td => td.classList.add('hwprobe-best'));
                            name.title = 'Recommended. ' + name.title;
                        }
                    }
                    // The reason, caveats, and other notes take a last row across the whole table.
                    const lines = notes.filter(n => n);
                    if (lines.length) {
                        const foot = el('td');
                        foot.colSpan = columns.length + 3;
                        // The reason leads with its label in bold.
                        const label = 'Recommendation: ';
                        lines.forEach(n => {
                            const line = foot.appendChild(el('div', null, 'secondaryText hwprobe-small'));
                            if (n.startsWith(label)) {
                                line.appendChild(el('strong', label.trim()));
                                line.appendChild(document.createTextNode(' ' + n.slice(label.length)));
                            } else {
                                line.textContent = n;
                            }
                        });
                        row(table, [foot]);
                    }
                    div.appendChild(table);
                    return div;
                }

                // The last suggestions per run, drawn at once on a redraw so the section doesn't vanish and come back while they reload; replaced when the server's differ.
                const suggestionCache = new Map();
                // Only the latest fetch draws: an older one finishing late, from before a setting was applied, would put stale suggestions back.
                let suggestionRequest = 0;

                function renderSuggestions() {
                    const div = el('div');
                    const key = speedViewing || '';
                    const draw = list => {
                        div.replaceChildren();
                        if (!list.length) {
                            return;
                        }
                        const section = fold(div, 'Suggestions', true);
                        const configured = encoding && encoding.HardwareAccelerationType;
                        const backendName = t => names[t] || t;
                        const isBitrate = s => !runOptions.some(o => o.Key === s.Setting) && !!serverLabels[s.Setting];
                        // The server's own Internet streaming limit says which bitrate suggestion is current; the server doesn't know it when drawing them.
                        for (const s of list.filter(isBitrate)) {
                            s.Current = remoteLimit === Number(s.Value);
                        }
                        // A stricter Internet streaming limit already set is noted under the table.
                        const stricter = s => isBitrate(s) && Number(s.Value) > 0 && remoteLimit > 0 && remoteLimit < Number(s.Value);
                        // Any value but the server's own can be applied, even one that falls behind real time.
                        const applyValue = (s, value, current) => current ? null
                            : idleAction('Apply', () => post('HwProbe/ApplyMeasured', { Setting: s.Setting, Value: value, Run: speedViewing }, true), 'raised');
                        const apply = s => s.Kind === 'NoChange' ? null : applyValue(s, s.Value, s.Current);
                        const settingRow = s => ({ text: optionValueText(s.Setting, s.Value), value: s.Value, speed: s.Speed, streams: s.Streams, capped: s.StreamsCapped, speeds: s.Speeds, savings: s.Savings, lower: s.LowerQuality, current: s.Current, action: apply(s) });
                        const testVideos = ['Measured on test videos only, which encode faster than real video.', 'Measure a film sample or library video to confirm.'];
                        // Why the tinted row is recommended, the first lines of the table's last row: the suggestion's name for it and for what it was compared with, one point per line.
                        const reasonFor = (x, name, others) => {
                            const percent = x.Gain === null || x.Gain === undefined ? '' : Math.round(Math.abs(x.Gain) * 100) + '%';
                            const versus = orList(others);
                            const lower = x.LowerQuality ? 'Lower picture quality than ' + versus + '.' : '';
                            const option = runOptions.find(o => o.Key === x.Setting);
                            const recommended = 'Recommendation: ' + name + ' \u2013 ';
                            // What a recommended Auto is on the configured backend, and the best-quality value that keeps up beside it.
                            const backendNote = option && option.BackendNotes ? option.BackendNotes[configured || 'none'] : null;
                            const best = x.BestQuality && option && option.BestQualityNote ? option.BestQualityNote.replace('{value}', optionValueText(x.Setting, x.BestQuality)).replace('{headroom}', advice.Headroom) : '';
                            return x.Kind === 'RecommendedValue' ? [recommended + (option ? option.RecommendedReason : ''), backendNote ? name + ' on ' + backendNote + '.' : '', best]
                                : x.Kind === 'FasterSetting' ? [recommended + percent + ' faster than ' + versus + '.', lower]
                                : x.Kind === 'EfficientSetting' ? [recommended + 'as fast as ' + versus + '.', 'Uses ' + savingsText(x.Savings) + '.', lower]
                                : x.Kind === 'HigherQuality' ? [recommended + 'better quality than ' + versus + '.', 'Still ' + x.Speed.toFixed(2) + '\u00d7 real time on real video.']
                                : x.Kind === 'Compatible' ? [recommended + 'avoids the drawback below.', lower]
                                : x.Kind === 'BitrateLimit' ? [recommended + 'out of network devices transcode any video whose bitrate exceeds the limit instead of direct playing it.']
                                : x.Kind === 'NoChange' ? [recommended + 'no other value measured is better.']
                                : [];
                        };
                        const paired = new Set(list.map(s => suggestionCounterpart(list, s)).filter(o => o));
                        // Settings that together pick one thing: one table for the group, a row per choice the runs made, in the catalog's order.
                        const groupTable = (key, members) => {
                            const group = settingGroups.find(g => g.Key === key);
                            // A row is the server's when all the group's settings match it, not just the one a suggestion is about; the catalog's server field names each setting.
                            const backend = encoding ? encoding.HardwareAccelerationType : null;
                            const rowOf = values => (group.Rows.find(r => (!r.Backends || r.Backends.includes(backend)) && Object.entries(r.When || {}).every(([k, v]) => values[k] === v)) || {}).Label;
                            const server = Object.fromEntries(group.Settings.map(k => {
                                const option = runOptions.find(o => o.Key === k);
                                return [k, encoding && option && option.Server ? String(current(option.Server)) : null];
                            }));
                            const serverRow = rowOf(server);
                            const rows = new Map();
                            const add = r => {
                                if (!rows.has(r.text)) {
                                    rows.set(r.text, r);
                                }
                            };
                            for (const m of members) {
                                add({ text: m.Row, value: m.Value, speed: m.Speed, streams: m.Streams, capped: m.StreamsCapped, speeds: m.Speeds, savings: m.Savings, lower: null, current: false, action: null });
                                for (const c of m.Compared) {
                                    add({ text: c.Row, value: c.Value, speed: c.Speed, streams: c.Streams, capped: c.StreamsCapped, speeds: c.Speeds, savings: [], lower: null, current: false, action: null });
                                }
                            }
                            // Apply on a row sets every setting the choice needs; a row without conditions, or for another backend, can't be applied.
                            rows.forEach(r => {
                                r.current = r.text === serverRow;
                                const choice = group.Rows.find(x => x.Label === r.text);
                                r.action = !r.current && choice && choice.When && (!choice.Backends || choice.Backends.includes(backend))
                                    ? idleAction('Apply', () => post('HwProbe/ApplyMeasuredRow', { Group: key, Row: r.text, Run: speedViewing }, true), 'raised')
                                    : null;
                            });
                            const describe = r => {
                                const choice = group.Rows.find(x => x.Label === r.text);
                                const option = choice && choice.Describes ? runOptions.find(o => o.Key === choice.Describes) : null;
                                return option ? option.Description : null;
                            };
                            rows.forEach(r => { r.description = describe(r); });
                            // Recommended: a better-quality choice no other better-quality suggestion was preferred over, otherwise a faster or more efficient one likewise.
                            const unbeaten = kinds => {
                                const picked = members.filter(m => kinds.includes(m.Kind));
                                const beaten = new Set(picked.flatMap(m => m.Compared.map(c => c.Row)));
                                return picked.map(m => m.Row).filter(r => !beaten.has(r));
                            };
                            const best = unbeaten(['HigherQuality'])[0] || unbeaten(['FasterSetting', 'EfficientSetting'])[0];
                            if (rows.has(best)) {
                                rows.get(best).best = true;
                            }
                            const why = members.find(m => m.Row === best && m.Kind === 'HigherQuality') || members.find(m => m.Row === best);
                            const order = r => group.Rows.findIndex(x => x.Label === r.text);
                            return suggestionTable(group.Label, [...rows.values()].sort((a, b) => order(a) - order(b)), null, [
                                ...(why ? reasonFor(why, why.Row, why.Compared.map(c => c.Row)) : []),
                                ...new Set(group.Rows.filter(x => x.Note && rows.has(x.Label)).map(x => x.Note)),
                                ...(members.some(m => m.TestVideosOnly) ? testVideos : []),
                            ]);
                        };
                        // Outputs none of the backends measured keeps real time on, in one table.
                        const tooSlow = list.filter(s => s.Kind === 'TooSlowEverywhere');
                        if (tooSlow.length) {
                            const rows = tooSlow.map(s => ({ text: s.Outputs[0], backend: backendName(s.Type), speed: s.Speed, streams: s.Streams, capped: s.StreamsCapped, savings: [], lower: null, current: false, action: null, glyph: '\u274c', glyphTitle: 'Falls behind' }));
                            const these = tooSlow.length === 1 ? 'this output' : 'these outputs';
                            section.appendChild(suggestionTable('Falls behind on every backend', rows, null, ['Every backend measured falls behind real time on ' + these + ', so players that require a transcode will buffer.', 'Direct play is unaffected.']));
                        }
                        const drawnGroups = new Set();
                        for (const s of list.filter(x => x.Kind !== 'TooSlowEverywhere')) {
                            // A group's table takes in every suggestion for its settings, pairs included.
                            if (s.Group && settingGroups.some(g => g.Key === s.Group)) {
                                if (!drawnGroups.has(s.Group)) {
                                    drawnGroups.add(s.Group);
                                    section.appendChild(groupTable(s.Group, list.filter(x => x.Group === s.Group)));
                                }
                                continue;
                            }
                            if (paired.has(s)) {
                                continue;
                            }
                            const option = s.Setting ? runOptions.find(o => o.Key === s.Setting) : null;
                            const label = option ? option.Label : serverLabels[s.Setting] || s.Setting;
                            const caveat = option ? option.Caveat : null;
                            const partner = suggestionCounterpart(list, s);
                            if (partner) {
                                const sides = [s, partner];
                                const rows = sides.map(settingRow);
                                const better = sides.findIndex(x => x.Kind === 'HigherQuality');
                                const bestSide = better >= 0 ? better : sides.findIndex(x => x.Kind !== 'Compatible');
                                if (bestSide >= 0) {
                                    rows[bestSide].best = true;
                                }
                                // Quality is shown only where the two differ in it.
                                if (rows[0].lower === rows[1].lower) {
                                    rows.forEach(r => { r.lower = null; });
                                }
                                const chosen = sides[bestSide];
                                const limit = sides.find(x => isBitrate(x) && x.Kind === 'Compatible');
                                section.appendChild(suggestionTable(label, rows, option, [
                                    ...(chosen ? reasonFor(chosen, optionValueText(chosen.Setting, chosen.Value), chosen.Others.map(o => optionValueText(chosen.Setting, o))) : []),
                                    option ? option.Note : '',
                                    limit ? backendName(limit.Type) + ' keeps real time on H.264 up to ' + optionValueText(limit.Setting, limit.Value) + '.' : '',
                                    sides.some(stricter) ? 'A stricter limit of ' + remoteLimit / 1e6 + ' Mbps is already set.' : '',
                                    caveat,
                                    ...(sides.some(x => x.TestVideosOnly) ? testVideos : []),
                                ], serverLabels[s.Setting + 'Description']));
                                continue;
                            }
                            // Outputs the configured backend falls behind on, a row each, as in Falls behind on every backend.
                            if (s.Kind === 'FallsBehind') {
                                const rows = s.Speeds.map(o => ({ text: o.Label, speed: o.Speed, streams: o.Streams, capped: o.StreamsCapped, savings: [], lower: null, current: false, action: null, glyph: '\u274c', glyphTitle: 'Falls behind' }));
                                const these = rows.length === 1 ? 'this output' : 'these outputs';
                                section.appendChild(suggestionTable('Falls behind real time', rows, null, [backendName(s.Type) + ' falls behind real time on ' + these + ', so players that require a transcode will buffer.', 'Direct play is unaffected.', ...(s.TestVideosOnly ? testVideos : [])]));
                                continue;
                            }
                            if (s.Kind === 'FastestBackend') {
                                const rows = [{ text: backendName(s.Type), value: s.Type, speed: s.Speed, streams: s.Streams, capped: s.StreamsCapped, savings: s.Savings, lower: null, current: false, action: null, best: true }];
                                rows[0].action = idleAction('Use this backend', () => post('HwProbe/UseBackend', { Type: s.Type, Device: s.Device }, true));
                                rows.push(...s.Compared.map(c => ({ text: backendName(c.Value), value: c.Value, speed: c.Speed, streams: c.Streams, capped: c.StreamsCapped, savings: [], lower: null, current: true, action: null })));
                                // Measured alike, it's suggested when it is more efficient, or as Jellyfin's preferred Intel backend; the wording is Jellyfin's hardware acceleration guides'.
                                const recommended = 'Recommendation: ' + backendName(s.Type) + ' \u2013 ';
                                const savings = s.Savings.length ? 'Uses ' + savingsText(s.Savings) + '.' : '';
                                const reasons = !configured || configured === 'none' ? [recommended + 'offloads transcoding from the CPU.']
                                    : s.Preferred ? [recommended + 'preferred on mainstream Intel GPUs, for better performance.', 'As fast as ' + backendName(configured) + '.', savings]
                                    : savings ? [recommended + 'as fast as ' + backendName(configured) + '.', savings]
                                    : [recommended + 'the fastest hardware acceleration measured.'];
                                section.appendChild(suggestionTable('Hardware acceleration', rows, null, [...reasons, ...(s.TestVideosOnly ? testVideos : [])]));
                                continue;
                            }
                            // A setting: the recommended value and every other value compared with the server's, in Jellyfin's order.
                            const main = settingRow(s);
                            main.best = true;
                            const others = s.Compared.map(c => {
                                const current = isBitrate(s) ? remoteLimit === Number(c.Value) : c.Current;
                                return { text: optionValueText(s.Setting, c.Value), value: c.Value, speed: c.Speed, streams: c.Streams, capped: c.StreamsCapped, speeds: c.Speeds, savings: [], lower: c.LowerQuality, current, action: applyValue(s, c.Value, current) };
                            });
                            // The recommended value's quality is shown where every other value is better, or every other worse.
                            const lowers = others.map(r => r.lower);
                            main.lower = lowers.length && lowers.every(l => l === true) ? false : lowers.length && lowers.every(l => l === false) ? true : null;
                            // A choice's place in the option's dropdown, a number's value; a switch keeps the recommended value first.
                            const order = r => option && option.Choices ? option.Choices.findIndex(c => c.Key === r.value) : option && option.Range ? Number(r.value) : 0;
                            const rows = [main].concat(others).sort((a, b) => order(a) - order(b));
                            // Settings are compared on the configured backend's results alone.
                            const measuredOn = option && option.NamesBackend ? (!configured || configured === 'none' ? 'Measured in software.' : 'Measured on ' + backendName(configured) + '.') : '';
                            section.appendChild(suggestionTable(label, rows, option, [
                                ...reasonFor(s, optionValueText(s.Setting, s.Value), s.Others.map(o => optionValueText(s.Setting, o))),
                                option ? option.Note : '',
                                stricter(s) ? 'A stricter limit of ' + remoteLimit / 1e6 + ' Mbps is already set.' : '',
                                measuredOn,
                                caveat,
                                ...(s.TestVideosOnly ? testVideos : []),
                            ], serverLabels[s.Setting + 'Description']));
                        }
                        const footer = section.appendChild(el('div', null, 'fieldDescription'));
                        ['Settings are compared between saved runs that differ in that setting alone.', 'Software is never recommended over a working hardware backend.', advice.Headroom ? 'Better quality is recommended only while it keeps ' + advice.Headroom + '\u00d7 real time on real video and at least ' + Math.round((1 - advice.MaxStreamLoss) * 100) + '% of the concurrent streams.' : '']
                            .filter(t => t).forEach(t => footer.appendChild(el('div', t)));
                    };
                    const cached = suggestionCache.get(key);
                    if (cached) {
                        draw(cached.list);
                        // Kept from before: its buttons wait until the server's suggestions confirm or replace it.
                        div.querySelectorAll('button').forEach(b => { b.disabled = true; });
                    }
                    const request = ++suggestionRequest;
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedSuggestions', speedViewing ? { id: speedViewing } : {}), dataType: 'json' }).then(list => {
                        if (request !== suggestionRequest) {
                            return;
                        }
                        const json = JSON.stringify(list);
                        if (!cached || cached.json !== json) {
                            suggestionCache.set(key, { json, list });
                            draw(list);
                        } else {
                            div.querySelectorAll('button').forEach(b => { b.disabled = running; });
                        }
                    }, () => {});
                    return div;
                }

                // Searches movies and episodes through Jellyfin's own Items API; the server describes the chosen file.
                function libraryCell(update) {
                    const td = el('div', null, 'hwprobe-library');
                    const box = jf('<div class="inputContainer"><input is="emby-input" type="search"></div>');
                    const search = box.firstElementChild;
                    search.setAttribute('label', 'Library video');
                    search.placeholder = 'Search for a movie or episode';
                    search.value = speedItem ? speedItem.Name : '';
                    td.appendChild(box);
                    const choose = item => {
                        search.value = item.Name;
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedLibraryVideo', { itemId: item.Id }), dataType: 'json' }).then(v => {
                            speedItem = { Id: item.Id, Name: item.Name };
                            libraryVideo = v;
                            chosenVideos.add(v.Key);
                            update(true);
                        }, () => setMessage('That item has no local video file to measure.'));
                    };
                    let timer = null;
                    search.addEventListener('input', () => {
                        clearTimeout(timer);
                        const term = search.value.trim();
                        if (term.length < 2) {
                            closeMenu();
                            return;
                        }
                        timer = setTimeout(() => {
                            ApiClient.getItems(ApiClient.getCurrentUserId(), { SearchTerm: term, IncludeItemTypes: 'Movie,Episode', Recursive: true, Limit: 5 }).then(r => {
                                // Results replace the open menu rather than toggling it closed.
                                closeMenu();
                                if (!(r.Items || []).length || search.value.trim() !== term) {
                                    return;
                                }
                                popMenu(search, (menu, close) => {
                                    for (const item of r.Items) {
                                        const row = el('div', item.SeriesName ? item.SeriesName + ': ' + item.Name : item.Name, 'hwprobe-menu-item');
                                        row.setAttribute('role', 'option');
                                        row.addEventListener('click', () => {
                                            close();
                                            choose(item);
                                        });
                                        menu.appendChild(row);
                                    }
                                });
                            });
                        }, 300);
                    });
                    return td;
                }

                // A link that opens another site in a new tab.
                function externalLink(text, url) {
                    const a = el('a', text, 'button-link');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    return a;
                }

                // A line of an input's details: what it is on the left, a small note on the right.
                function inputEntry(left, right) {
                    const row = el('div', null, 'hwprobe-row');
                    row.appendChild(left);
                    row.appendChild(el('span', right, 'hwprobe-small secondaryText'));
                    return row;
                }

                // A catalog video as a list item: its name and what it shows, its format, and for a sample its credit and download.
                function videoItem(v) {
                    const line = el('li');
                    const name = el('span', v.Name + (v.SourceUrl || v.Description ? ': ' : ''));
                    name.appendChild(v.SourceUrl ? externalLink(v.Title, v.ArticleUrl || v.SourceUrl) : document.createTextNode(v.Description || ''));
                    line.appendChild(inputEntry(name, v.Input));
                    if (v.SourceUrl) {
                        const credit = el('span', null, 'hwprobe-small');
                        credit.appendChild(v.HolderUrl ? externalLink(v.CreditHolder, v.HolderUrl) : document.createTextNode(v.CreditHolder));
                        credit.appendChild(document.createTextNode(', '));
                        credit.appendChild(externalLink(v.LicenseName, v.LicenseUrl));
                        const download = inputEntry(credit, v.Origin + ', ');
                        download.lastElementChild.appendChild(externalLink(v.SourceName, v.SourceUrl));
                        line.appendChild(download);
                    }
                    return line;
                }

                // The catalog's videos in its order, with the library video after the current-format samples, before the legacy ones and the test videos.
                function inputOrder() {
                    const tests = speedVideos.findIndex(v => v.Legacy || !v.SourceUrl);
                    const at = tests === -1 ? speedVideos.length : tests;
                    return [...speedVideos.slice(0, at), 'library', ...speedVideos.slice(at)];
                }

                // Where each chosen input comes from, under the Input field.
                function sourceLines(target, update) {
                    target.replaceChildren();
                    if (chosenVideos.has('library')) {
                        target.appendChild(libraryCell(update));
                    }
                    const list = el('ul', null, 'fieldDescription hwprobe-notes');
                    for (const v of inputOrder().filter(v => v !== 'library' && chosenVideos.has(v.Key))) {
                        list.appendChild(videoItem(v));
                    }
                    if (chosenVideos.has('library') && libraryVideo) {
                        const line = el('li');
                        const name = el('span', 'Library video: ');
                        const link = el('a', speedItem.Name, 'button-link');
                        link.href = '#/details?id=' + speedItem.Id + '&serverId=' + ApiClient.serverId();
                        name.appendChild(link);
                        line.appendChild(inputEntry(name, libraryVideo.Input));
                        list.appendChild(line);
                    }
                    if (list.childElementCount) {
                        const details = fold(target, 'Details', false, 'span', 'input-details');
                        details.firstElementChild.lastElementChild.className = 'fieldDescription';
                        details.appendChild(list);
                    }
                    if (speedVideos.some(v => chosenVideos.has(v.Key) && !v.SourceUrl)) {
                        target.appendChild(el('div', 'Test video results may not be representative compared to actual videos.', 'infoBanner'));
                    }
                }

                // How many measurements, and roughly how long, from the accuracy's typical time per video measurement and audio's own.
                function measurementsText(runs, audioRuns, method, repeats, limit) {
                    const per = methodSeconds[method] || methodSeconds[defaultMethod];
                    const minutes = n => Math.max(1, Math.round(n / 60));
                    const cap = n => limit ? Math.min(n, limit) : n;
                    const low = minutes(runs * cap(per[0] * repeats) + audioRuns * cap(audioSeconds[0] * repeats));
                    const high = minutes(runs * cap(per[1] * repeats) + audioRuns * cap(audioSeconds[1] * repeats));
                    const total = runs + audioRuns;
                    return total + ' measurement' + (total === 1 ? '' : 's') + ', ' + (low === high ? 'about ' + low : 'about ' + low + ' to ' + high) + ' minute' + (high === 1 ? '' : 's');
                }

                // Named sets of runs that differ in one setting, each started with one button; listed as this server would run them.
                function renderSuites(container, idle) {
                    const body = el('div');
                    container.appendChild(body);
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Suites'), dataType: 'json' }).then(suites => {
                        suiteList = suites;
                        if (!suites.some(x => x.Key === chosenSuite)) {
                            chosenSuite = (suites.find(x => x.Offered) || suites[0] || {}).Key;
                        }
                        const estimate = el('span', null, 'secondaryText');
                        const button = idleAction('Run suite', () => {
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Suite'), data: JSON.stringify({ Key: chosenSuite, MeasureResources: suiteResources, WhenTranscoding: suiteWhenTranscoding, ReuseResults: suiteReuse }), contentType: 'application/json' })
                                .then(() => {
                                    showTab(tabs[3][0]);
                                    return loadStatus();
                                }, response => (response && response.text ? response.text() : Promise.resolve('')).then(text => {
                                    setMessage('Could not start: ' + (text.replace(/^"|"$/g, '') || 'a probe is running or a session is transcoding.'));
                                    button.disabled = running;
                                }));
                        }, 'raised button-submit');
                        const go = el('div', null, 'hwprobe-row hwprobe-start');
                        go.append(button, estimate);
                        body.appendChild(go);
                        body.appendChild(el('div', idle, 'infoBanner'));

                        const select = themedSelect(body, 'Suite');
                        for (const suite of suites) {
                            const option = el('option', suite.Name);
                            option.value = suite.Key;
                            option.selected = suite.Key === chosenSuite;
                            select.appendChild(option);
                        }
                        // What the chosen suite runs, under its field as an input's details are.
                        const details = el('div');
                        select.parentNode.appendChild(details);
                        const show = () => {
                            const suite = suites.find(x => x.Key === chosenSuite);
                            details.replaceChildren();
                            details.appendChild(el('div', suite.Description, 'fieldDescription'));
                            if (suite.Notes) {
                                details.appendChild(noteBanner(suite.Notes));
                            }
                            const list = el('ul', null, 'fieldDescription hwprobe-notes');
                            list.appendChild(el('li', 'Steps: ' + suite.Steps.join(', ')));
                            if (suite.Offered) {
                                list.appendChild(el('li', 'Backend: ' + suite.Backends.map(b => names[b] || b).join(', ')));
                            }
                            details.appendChild(list);
                            // Suites measure once each, without a time limit.
                            estimate.textContent = suite.Offered ? measurementsText(suite.Measurements, suite.AudioMeasurements || 0, suite.Method, 1, null) : 'Not available on this server.';
                            button.dataset.unavailable = String(!suite.Offered);
                            button.disabled = running || !suite.Offered;
                        };
                        select.addEventListener('change', () => { chosenSuite = select.value; show(); });
                        show();
                    }, () => {});
                }

                function renderSpeedSetup(container, viable) {
                    chooseSpeedDefaults();
                    let button = null;
                    const estimate = el('span', null, 'secondaryText');
                    const update = redraw => {
                        if (redraw) {
                            container.replaceChildren();
                            renderSpeedSetup(container, viable);
                            return;
                        }
                        const videos = allVideos().filter(v => chosenVideos.has(v.Key)).length;
                        const outputs = selectedOutputs().length;
                        const audios = speedAudios.filter(a => chosenAudios.has(a.Key)).length;
                        const audioOutputs = selectedAudioOutputs().length;
                        const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
                        const videoRuns = videos ? speedRuns(viable) : 0;
                        const audioRuns = chosenBackends.has('none') ? audios * audioOutputs : 0;
                        const missing = [[videos || audios, 'an input'], [!videos || outputs, 'an output'], [!audios || audioOutputs, 'an audio output'], [speedBackends(viable), 'a backend']].filter(([n]) => !n).map(([, what]) => what);
                        const parts = [videoRuns ? plural(videos, 'input') + ' \u00d7 ' + plural(outputs, 'output') + ' on ' + plural(speedBackends(viable), 'backend') : '', audioRuns ? plural(audios, 'audio input') + ' \u00d7 ' + plural(audioOutputs, 'audio output') + ' in software' : ''].filter(t => t);
                        estimate.textContent = missing.length
                            ? 'Requires ' + andList(missing) + '.'
                            : !videoRuns && !audioRuns ? 'Nothing to measure with these choices.'
                            : parts.join(', ') + ': ' + measurementsText(videoRuns, audioRuns, speedMethod, speedRepeats, speedTimeLimit);
                        button.disabled = videoRuns + audioRuns === 0 || running;
                    };
                    button = action('Measure performance', () => {
                        const body = { Method: speedMethod, Repeats: speedRepeats, TimeLimitSeconds: speedTimeLimit, ReuseResults: speedReuse, MeasureResources: speedResources, WhenTranscoding: speedWhenTranscoding, Options: speedSettings, Videos: allVideos().filter(v => chosenVideos.has(v.Key)).map(v => v.Key), Audios: speedAudios.filter(a => chosenAudios.has(a.Key)).map(a => a.Key), Outputs: (allVideos().some(v => chosenVideos.has(v.Key)) ? selectedOutputs() : []).concat(selectedAudioOutputs()).map(o => o.Key), Backends: [...chosenBackends], ItemId: libraryVideo && chosenVideos.has('library') ? speedItem.Id : null };
                        ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Speed'), data: JSON.stringify(body), contentType: 'application/json' })
                            .then(() => {
                                showTab(tabs[3][0]);
                                return loadStatus();
                            }, response => (response && response.text ? response.text() : Promise.resolve('')).then(text => {
                                setMessage('Could not start: ' + (text.replace(/^"|"$/g, '') || 'a probe is running or a session is transcoding.'));
                                button.disabled = false;
                            }));
                    }, 'raised button-submit');
                    const idle = 'For more accurate results, measure while the server is idle.';
                    const suites = fold(container, 'Test Suites', true);
                    const form = fold(container, 'Custom Test', false, null, 'performance');
                    const go = el('div', null, 'hwprobe-row hwprobe-start');
                    go.appendChild(button);
                    go.appendChild(estimate);
                    form.appendChild(go);
                    form.appendChild(el('div', idle, 'infoBanner'));

                    // Help goes under its field, before the gap to the next one, as the dashboard's helper text does.
                    const options = (label, values, current, onChange, help, target) => {
                        const select = themedSelect(target || form, label);
                        if (help) {
                            select.parentNode.appendChild(el('div', help, 'fieldDescription'));
                        }
                        for (const [value, text] of values) {
                            const option = el('option', text);
                            option.value = String(value);
                            option.selected = value === current;
                            select.appendChild(option);
                        }
                        select.addEventListener('change', () => { onChange(select.value); update(); });
                    };
                    // The first choice keeps the server's setting, named with its value.
                    const runOption = o => {
                        let choices = o.Choices ? o.Choices.map(c => [c.Key, c.Label]) : o.Switch ? [['true', 'On'], ['false', 'Off']] : [];
                        for (let n = o.Range ? o.Range[0] : 0; o.Range && n <= o.Range[1]; n++) {
                            choices.push([String(n), String(n)]);
                        }
                        if (o.Server) {
                            const value = current(o.Server);
                            const found = choices.find(([key]) => value !== null && value !== undefined && key === String(value));
                            choices = [['', serverLabels.ServerSetting + (found ? ' (' + found[1] + ')' : '')]].concat(choices);
                        }
                        options(o.Label, choices, o.Key in speedSettings ? speedSettings[o.Key] : choices[0][0], v => {
                            if (v === '') {
                                delete speedSettings[o.Key];
                            } else {
                                speedSettings[o.Key] = v;
                            }
                        }, o.Help);
                        // What Auto means for each backend that works here, and software.
                        if (o.BackendNotes) {
                            const types = viable.map(b => b.type).filter((t, i, all) => all.indexOf(t) === i).concat(['none']);
                            const notes = types.map(t => o.BackendNotes[t]).filter(n => n);
                            if (notes.length) {
                                const box = form.lastElementChild;
                                box.appendChild(el('div', 'Auto:', 'fieldDescription'));
                                const list = el('ul', null, 'fieldDescription hwprobe-notes');
                                for (const n of notes) {
                                    list.appendChild(el('li', n));
                                }
                                box.appendChild(list);
                            }
                        }
                    };
                    if (!chosenBackends) {
                        chosenBackends = new Set(viable.map(b => b.type).concat(['none']));
                    }
                    form.appendChild(el('h3', 'Backend', 'sectionTitle'));
                    const sameType = b => viable.filter(o => o.type === b.type).length > 1;
                    // In the order of Jellyfin's Hardware acceleration dropdown, which lists None first.
                    multiSelect(form, 'Backend', [{ key: 'none', text: 'None (software)' }].concat(viable.filter((b, i) => viable.findIndex(o => o.type === b.type) === i)
                        .map(b => ({ key: b.type, text: (names[b.type] || b.type) + (sameType(b) ? ' ' + b.device : '') }))), chosenBackends, () => update());
                    // Settings for one backend, shown when it works and its probe found the option supported.
                    const supported = o => viable.some(b => b.type === o.Backend && (b.settings || []).some(x => x.setting === o.Report && (x.state === 'TurnOn' || x.state === 'Optional')));
                    runOptions.filter(o => o.Backend && supported(o)).forEach(runOption);

                    form.appendChild(el('h3', 'Input', 'sectionTitle'));
                    const sources = el('div', null, 'hwprobe-sources');
                    multiSelect(form, 'Input', inputOrder().map(v => v === 'library' ? { key: 'library', text: 'Library video', secondary: 'A movie or episode from a library' } : { key: v.Key, text: v.Title ? v.Name + ': ' + v.Title : v.Name, secondary: v.Input }), chosenVideos, () => { sourceLines(sources, update); update(); })
                        .appendChild(sources);
                    sourceLines(sources, update);
                    multiSelect(form, 'Audio input', speedAudios.map(a => ({ key: a.Key, text: a.Name, secondary: a.Input })), chosenAudios, () => update())
                        .appendChild(el('div', 'Measured in software alone: no backend decodes or encodes audio on the GPU.', 'fieldDescription'));
                    form.appendChild(el('h3', 'Output', 'sectionTitle'));
                    multiSelect(form, 'Codec', speedCodecs.map(c => ({ key: c.Key, text: c.Name })).concat(speedOutputs.filter(standalone).map(o => ({ key: o.Key, text: o.Label }))), chosenCodecs, () => update())
                        .appendChild(el('div', 'Every selected codec at every selected quality is processed for every selected input.', 'fieldDescription'));
                    multiSelect(form, 'Quality', speedQualities.map(q => ({ key: q.Key, text: q.Name })), chosenQualities, () => update())
                        .appendChild(el('div', 'Output resolution is determined by transcoded quality and codec.', 'fieldDescription'));
                    multiSelect(form, 'Audio codec', speedOutputs.filter(audioOutput).map(o => ({ key: o.Key, text: o.Label })), chosenAudioOutputs, () => update())
                        .appendChild(el('div', 'Every selected audio codec is processed for every selected audio input, as a client asks for music.', 'fieldDescription'));

                    form.appendChild(el('h3', 'Transcoding Settings', 'sectionTitle'));
                    runOptions.filter(o => !o.Backend).forEach(runOption);
                    form.appendChild(el('h3', 'Accuracy and time', 'sectionTitle'));
                    options('Accuracy', Object.entries(methods).map(([key, [, text]]) => [key, text]), speedMethod, v => { speedMethod = v; });
                    options('Repeats', repeatOptions, speedRepeats, v => { speedRepeats = Number(v); });
                    const reuseChoices = [['true', 'Reuse when the settings match'], ['false', 'Measure everything again']];
                    const reuseHelp = 'Reuses a measurement from an earlier run with the same input, output, backend, accuracy, repeats, and ffmpeg, and the same values for the settings that affect it, so a repeated comparison completes faster.';
                    options('Earlier results', reuseChoices, String(speedReuse), v => { speedReuse = v === 'true'; }, reuseHelp);
                    // What this server's platform can measure, and whose usage it is.
                    const coverage = {
                        windows: 'CPU, memory, GPU, and GPU memory usage are measured per transcode. Power is measured for the CPU package and NVIDIA GPUs where their meters exist, covering the whole device above its idle draw.',
                        linux: 'CPU and memory usage are measured per transcode. Intel and AMD GPU usage is measured per transcode on kernel 5.19 or newer (6.8 for Intel\u2019s xe driver). NVIDIA GPU usage covers the whole GPU, including any other work on it. Power is measured for NVIDIA GPUs, Intel Arc GPUs, AMD GPUs, and the CPU package where the server may read their meters (not usually in a container), covering the whole device above its idle draw.',
                        macos: 'CPU and memory usage are measured per transcode. GPU usage and power can\u2019t be measured on macOS.',
                    }[report && report.host ? report.host.os : ''];
                    // Test suites have their own Resource Usage and transcoding choices.
                    const shared = (target, resources, setResources, whenTranscoding, setWhenTranscoding) => {
                        options('Resource Usage', [['false', 'Don\u2019t measure'], ['true', 'Measure CPU, memory, and GPU usage']], String(resources), v => setResources(v === 'true'), null, target);
                        if (coverage) {
                            target.lastElementChild.appendChild(el('div', coverage, 'infoBanner'));
                        }
                        options('When the server starts transcoding', whenTranscodingOptions, whenTranscoding, setWhenTranscoding, null, target);
                    };
                    renderSuites(suites, idle);
                    shared(suites, suiteResources, v => { suiteResources = v; }, suiteWhenTranscoding, v => { suiteWhenTranscoding = v; });
                    options('Earlier results', reuseChoices, String(suiteReuse), v => { suiteReuse = v === 'true'; }, reuseHelp, suites);
                    shared(form, speedResources, v => { speedResources = v; }, speedWhenTranscoding, v => { speedWhenTranscoding = v; });
                    options('Time limit per measurement', timeLimitOptions, speedTimeLimit === null ? '' : speedTimeLimit, v => { speedTimeLimit = v === '' ? null : Number(v); }, 'A measurement that reaches the limit stops and reports what it measured.');

                    update();
                    speedUpdate = update;
                }

                // One copy's GPU engines busy share, busiest first, named as the catalog names them.
                function gpuShares(r) {
                    return Object.entries(r.gpuSeconds || {})
                        .map(([engine, seconds]) => [gpuEngines[engine] || engine, seconds / r.seconds])
                        .sort((a, b) => b[1] - a[1]);
                }

                // Each resource the view can show: whether a result has it, its sort value, and its text.
                const resourceKinds = {
                    Cpu: { has: r => r.cpuSeconds !== null && r.cpuSeconds !== undefined, value: r => r.cpuSeconds / r.seconds, text: v => Math.round(v * 100) + '%' },
                    Memory: { has: r => !!r.peakMemoryBytes, value: r => r.peakMemoryBytes, text: v => sizeText(v, 2) },
                    Gpu: { has: r => gpuShares(r).length > 0, value: r => gpuShares(r)[0][1], text: (v, r) => gpuShares(r)[0][0] + ' ' + Math.round(Math.min(1, v) * 100) + '%' },
                    GpuMemory: { has: r => !!r.peakGpuMemoryBytes, value: r => r.peakGpuMemoryBytes, text: v => sizeText(v, 2) },
                    Power: { has: r => !!r.joules && Object.keys(r.joules).length > 0, value: r => totalWatts(r), text: v => Math.round(v) + ' W' },
                };

                // The resources any result of a run has: one this host can't measure (GPU on macOS, power without a readable meter) gets no column.
                function measuredResources(results) {
                    return Object.keys(resourceKinds).filter(k => results.some(x => x.resources && resourceKinds[k].has(x.resources)));
                }

                // Watts above idle over every energy meter.
                function totalWatts(r) {
                    // Only domains with an idle reading count, as the server's figures do.
                    return r.seconds > 0 && r.idleWatts ? Object.keys(r.joules).filter(d => d in r.idleWatts).reduce((sum, d) => sum + Math.max(0, r.joules[d] / r.seconds - r.idleWatts[d]), 0) : 0;
                }

                // A result's cells in the Resource Usage view, one per measured resource; each tooltip lists every figure.
                function resourceCells(x, measuring, kinds) {
                    const cells = kinds.map(() => el('td', null, 'hwprobe-num'));
                    if (!x || !cells.length) {
                        return cells;
                    }
                    if (x.pending) {
                        cells[0].textContent = measuring ? 'Measuring\u2026' : '\u2026';
                        cells[0].classList.add('secondaryText');
                        return cells;
                    }
                    const r = x.resources;
                    const title = resourceFacts(r).join('\n');
                    kinds.forEach((k, i) => {
                        const kind = resourceKinds[k];
                        const has = r && kind.has(r);
                        const value = has ? kind.value(r) : null;
                        cells[i].textContent = has ? kind.text(value, r) : '\u2013';
                        cells[i].dataset.sort = has ? String(value) : '';
                        cells[i].title = title;
                    });
                    return cells;
                }

                // The Resource Usage view's tooltip lines: CPU, memory, and every GPU engine that did work.
                function resourceFacts(r) {
                    if (!r) {
                        return ['Resources not measured'];
                    }
                    const facts = [];
                    if (r.cpuSeconds !== null && r.cpuSeconds !== undefined) {
                        // 100% per core, as top and Activity Monitor count it.
                        facts.push(Math.round(r.cpuSeconds / r.seconds * 100) + '% CPU on average (100% per core)');
                    }
                    if (r.peakMemoryBytes) {
                        facts.push(sizeText(r.peakMemoryBytes, 2) + ' peak memory');
                    }
                    if (r.peakGpuMemoryBytes) {
                        facts.push(sizeText(r.peakGpuMemoryBytes, 2) + ' peak GPU memory');
                    }
                    for (const [name, share] of gpuShares(r)) {
                        facts.push('GPU ' + name + ' busy ' + Math.round(Math.min(1, share) * 100) + '% of the time');
                    }
                    if (r.gpuWholeDevice) {
                        facts.push('GPU figures cover the whole GPU, not this transcode alone');
                    }
                    for (const d of Object.keys(r.joules || {})) {
                        const idle = (r.idleWatts || {})[d] || 0;
                        facts.push((powerDomains[d] || d) + ' ' + Math.round(Math.max(0, r.joules[d] / r.seconds - idle)) + ' W above idle (' + Math.round(idle) + ' W idle), whole device');
                    }
                    return facts;
                }

                // Which comparison rows are open, by test, kept across redraws.
                const speedOpen = new Set();

                const speedViews = [['bars', 'Bars'], ['relative', 'Relative to fastest'], ['values', 'Values'], ['resources', 'Resource Usage']];
                let speedView = speedViews.some(([k]) => k === localStorage.getItem('hwprobe-speed-view')) ? localStorage.getItem('hwprobe-speed-view') : 'bars';

                // Rows grouped by video, one per output; one column per backend; comparisons fold under their row.
                function speedMatrix(r) {
                    const div = el('div');
                    const section = fold(div, 'Results', true);
                    const keyOf = x => x.type + ' ' + x.device;
                    const backends = [];
                    for (const x of r.results) {
                        if (!backends.some(b => keyOf(b) === keyOf(x))) {
                            backends.push(x);
                        }
                    }
                    const sameType = b => backends.filter(o => o.type === b.type).length > 1;
                    const columnName = b => (names[b.type] || b.type) + (b.type !== 'none' && sameType(b) ? ' ' + b.device : '');

                    if (!speedHistory.length && !speedLive) {
                        section.appendChild(el('p', 'Measured ' + new Date(r.generatedUtc).toLocaleString() + ', ' + methodName(r.method).toLowerCase() + ' accuracy', 'secondaryText'));
                    }
                    if (r.cancelled) {
                        section.appendChild(el('div', (r.cancelledForTranscode ? 'Cancelled when the server started transcoding' : 'Cancelled') + ': these are the measurements finished before then.', 'infoBanner'));
                    }

                    // A note shared by cells becomes one numbered footnote. Earlier runs saved ffmpeg's memory addresses in their notes, which would split one failure into a footnote per measurement.
                    const footnotes = [];
                    const footnote = text => {
                        const note = noteText(text);
                        if (!note) {
                            return null;
                        }
                        const i = footnotes.indexOf(note);
                        return i === -1 ? footnotes.push(note) : i + 1;
                    };
                    const speedOf = x => x.fps && x.frameRate ? x.fps / x.frameRate : null;
                    // Fast accuracy derives the stream count from the speed, so only Standard and Thorough get a column for it.
                    const counted = r.method !== 'Quick';
                    // Results run in their planned order, so the first pending one is being measured.
                    const current = speedProgress && (speedProgress.Phase === 'Measuring' || speedProgress.Phase === 'Pausing') ? r.results.find(x => x.pending) : null;
                    const values = speedView === 'values';
                    const resources = speedView === 'resources';
                    const kinds = resources ? measuredResources(r.results) : [];
                    const per = resources ? Math.max(1, kinds.length) : values && counted ? 2 : 1;
                    // Per backend: concurrent streams kept up with (Values view, when counted), and one transcode's speed as a value, a bar or a share of the row's fastest.
                    const cellsFor = (x, best, baseline, fastest) => {
                        const tint = x && x === best && backends.length > 1 ? ' hwprobe-best' : '';
                        const streams = el('td', null, 'hwprobe-num' + tint);
                        const speedCell = el('td', null, 'hwprobe-num' + tint);
                        const cells = per === 2 ? [streams, speedCell] : [speedCell];
                        if (resources) {
                            return kinds.length ? resourceCells(x, x === current, kinds) : [el('td', x && x.pending ? (x === current ? 'Measuring\u2026' : '\u2026') : '\u2013', 'hwprobe-num secondaryText')];
                        }

                        if (!x) {
                            return cells;
                        }
                        if (x.pending) {
                            speedCell.textContent = x === current ? 'Measuring\u2026' : '\u2026';
                            speedCell.classList.add('secondaryText');
                            return cells;
                        }
                        const speed = speedOf(x);
