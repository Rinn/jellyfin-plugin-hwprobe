<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HwProbe</title>
</head>
<body>
    <div id="HwProbeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox,emby-select,emby-input">
        <style>
            /* Layout only: colours, buttons, inputs and panels come from jellyfin-web's theme classes. */
            #HwProbeConfigPage table { border-collapse: collapse; margin: 0.25em 0 1em; }
            #HwProbeConfigPage td, #HwProbeConfigPage th { padding: 0.2em 1.5em 0.2em 0; text-align: left; vertical-align: middle; height: 1.8em; }
            #HwProbeConfigPage th { font-weight: 500; }
            #HwProbeConfigPage .hwprobe-scroll { overflow-x: auto; }
            #HwProbeConfigPage .hwprobe-backends td:nth-child(2), #HwProbeConfigPage .hwprobe-backends th:nth-child(2) { width: 18em; }
            #HwProbeConfigPage .hwprobe-backends td:nth-child(3), #HwProbeConfigPage .hwprobe-backends th:nth-child(3) { width: 12em; }
            #HwProbeConfigPage .hwprobe-group td { padding-top: 0.8em; font-weight: 500; }
            #HwProbeConfigPage .hwprobe-mark { width: 1.5em; }
            #HwProbeConfigPage .hwprobe-mark .material-icons, #HwProbeConfigPage .hwprobe-card .material-icons { font-size: 1.2em; vertical-align: middle; }
            #HwProbeConfigPage .hwprobe-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
            #HwProbeConfigPage .hwprobe-tabbar { margin-bottom: 1em; }
            #HwProbeConfigPage .hwprobe-card { padding: 0.8em 1em; margin: 0 0 1.5em; }
            #HwProbeConfigPage .hwprobe-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5em 1em; margin: 0.2em 0; }
            #HwProbeConfigPage .hwprobe-row.hwprobe-start { justify-content: flex-start; }
            #HwProbeConfigPage .hwprobe-card .infoBanner { margin: 0.5em 0; }
            #HwProbeConfigPage .hwprobe-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em 1em; margin: 1.5em 0 0.3em; }
            #HwProbeConfigPage .hwprobe-heading h2 { margin: 0; }
            #HwProbeConfigPage .hwprobe-heading .selectContainer { margin: 0; flex: 1 1 16em; max-width: 28em; }
            #HwProbeConfigPage .hwprobe-change { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; }
            #HwProbeConfigPage .hwprobe-change-list { margin: 0 0 0.5em 1em; }
            #HwProbeConfigPage .hwprobe-change-list table { margin: 0.2em 0 0; }
            #HwProbeConfigPage .hwprobe-arrow { display: inline-block; width: 1em; }
            #HwProbeConfigPage .hwprobe-disclosure { padding: 0; border: none; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
            #HwProbeConfigPage .hwprobe-choices { display: flex; flex-wrap: wrap; gap: 0 1.5em; }
            #HwProbeConfigPage .hwprobe-choices .emby-checkbox-label { width: auto; margin-right: 1.5em; }
            #HwProbeConfigPage .hwprobe-fold > summary { display: flex; align-items: center; gap: 0.3em; cursor: pointer; list-style: none; }
            #HwProbeConfigPage .hwprobe-fold > summary::-webkit-details-marker { display: none; }
            #HwProbeConfigPage .hwprobe-fold > summary .sectionTitle { margin: 0.5em 0; }
            #HwProbeConfigPage .hwprobe-fold[open] > summary .material-icons { transform: rotate(90deg); }
            #HwProbeConfigPage .hwprobe-setup { width: 100%; }
            #HwProbeConfigPage .hwprobe-setup th { width: 7em; vertical-align: top; padding-top: 0.6em; }
            #HwProbeConfigPage .hwprobe-setup .inputContainer, #HwProbeConfigPage .hwprobe-setup .selectContainer { margin: 0; max-width: 28em; }
            #HwProbeConfigPage .hwprobe-matrix td, #HwProbeConfigPage .hwprobe-matrix th { padding-right: 2em; }
            #HwProbeConfigPage .hwprobe-matrix .hwprobe-num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
            #HwProbeConfigPage .hwprobe-best { font-weight: bold; }
            #HwProbeConfigPage .hwprobe-variant td:first-child { padding-left: 1.2em; }
            #HwProbeConfigPage .hwprobe-small { font-size: 0.85em; }
            #HwProbeConfigPage .hwprobe-progress { position: relative; width: 16em; }
            #HwProbeConfigPage .hwprobe-inline { margin: 0 0 0 0.5em; padding: 0.2em 0.8em; }
            #HwProbeConfigPage sup { font-size: 0.7em; }
            /* Phones: let columns size to their content and wrap, so nothing runs off the screen. */
            @media (max-width: 40em) {
                #HwProbeConfigPage td, #HwProbeConfigPage th { padding-right: 0.5em; }
                #HwProbeConfigPage .hwprobe-backends td:nth-child(2), #HwProbeConfigPage .hwprobe-backends th:nth-child(2),
                #HwProbeConfigPage .hwprobe-backends td:nth-child(3), #HwProbeConfigPage .hwprobe-backends th:nth-child(3) { width: auto; }
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2>HwProbe</h2>
                <div class="emby-tabs-slider hwprobe-tabbar" role="tablist">
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabProbe" aria-controls="hwprobeProbeTab" aria-selected="true" class="emby-tab-button emby-button emby-tab-button-active"><div class="emby-button-foreground">Probe</div></button>
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabSpeed" aria-controls="hwprobeSpeedTab" aria-selected="false" class="emby-tab-button emby-button"><div class="emby-button-foreground">Speed</div></button>
                </div>
                <div id="hwprobeMessage" class="infoBanner" hidden></div>
                <div id="hwprobeProbeTab" role="tabpanel" aria-labelledby="hwprobeTabProbe">
                    <div id="hwprobeCard" class="paperList hwprobe-card"></div>
                    <div id="hwprobeResults"></div>
                </div>
                <div id="hwprobeSpeedTab" role="tabpanel" aria-labelledby="hwprobeTabSpeed" hidden></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                // The server's API uses PascalCase; the report keeps hwprobe's own camelCase schema.
                // No template literals: jellyfin-web's translateHtml treats every dollar sign followed by
                // a brace in the page, scripts included, as a translation key and replaces it.
                const page = document.querySelector('#HwProbeConfigPage');
                const results = page.querySelector('#hwprobeResults');
                const card = page.querySelector('#hwprobeCard');
                const messageText = page.querySelector('#hwprobeMessage');
                // Kept across renders: the status updates while a run polls, without redrawing the page.
                const statusText = el('span', null, 'secondaryText');
                const changeText = el('div');
                const runButton = action('Run probe', () => {
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Run') })
                        .then(loadStatus, () => { setMessage('Could not start: a probe is running or a session is transcoding.'); runButton.disabled = false; });
                }, 'raised button-submit');
                let running = false;

                // The banner is a themed panel, so it's hidden while empty.
                function setMessage(text) {
                    messageText.textContent = text || '';
                    messageText.hidden = !text;
                }
                const speedTab = page.querySelector('#hwprobeSpeedTab');
                const tabs = [['#hwprobeTabProbe', '#hwprobeProbeTab'], ['#hwprobeTabSpeed', '#hwprobeSpeedTab']].map(([b, p]) => [page.querySelector(b), page.querySelector(p)]);
                for (const [button] of tabs) {
                    button.addEventListener('click', () => {
                        for (const [b, panel] of tabs) {
                            const on = b === button;
                            b.classList.toggle('emby-tab-button-active', on);
                            b.setAttribute('aria-selected', String(on));
                            panel.hidden = !on;
                        }
                    });
                }
                const columns = ['decode', 'encode', 'tonemap', 'deinterlace', 'subtitles'];
                let pollTimer = null;
                let report = null;
                // Only used to open the configured backend's settings first.
                let encoding = null;
                let trickplay = null;
                let selected = null;
                let history = [];
                let restartRequired = false;
                let speedVideos = [];
                let speedOutputs = [];
                let speedReport = null;
                // While a speed run goes, its results so far; shown in place of the saved run.
                let speedLive = null;
                let speedProgress = null;
                let speedMethod = null;
                let speedRepeats = 1;
                let speedTimeLimit = null;
                // Null measures with the server's own thread count.
                let speedThreads = null;
                let chosenVideos = null;
                let chosenOutputs = null;
                let speedItem = null;
                let libraryVideo = null;
                let speedHistory = [];
                let speedViewing = null;
                let speedViable = [];
                // The current Speed section's estimate; one listener calls it, however often the section is redrawn.
                let speedUpdate = () => {};
                const speedCompared = new Set();
                // Labels and choices from the server's catalog (catalog.yaml in HwProbe.Core), filled in by loadReport.
                let methods = {};
                let methodSeconds = {};
                let comparisons = {};
                let repeatOptions = [];
                let threadOptions = [];
                let timeLimitOptions = [];
                let names = {};
                let order = [];
                let platforms = {};
                let armOnly = {};
                let tiers = {};
                let verdicts = {};
                let notes = {};
                let settingLabels = {};
                const methodName = m => (methods[m] || [m])[0];
                const byDropdown = (a, b) => order.indexOf(a.type) - order.indexOf(b.type);

                function useCatalog(c) {
                    methods = Object.fromEntries(c.Methods.map(m => [m.Key, [m.Name, m.Description]]));
                    methodSeconds = Object.fromEntries(c.Methods.map(m => [m.Key, m.Seconds]));
                    comparisons = Object.fromEntries(c.Variations.map(v => [v.Key, [v.Name, v.Measured]]));
                    repeatOptions = c.Repeats.map(o => [o.Value, o.Label]);
                    threadOptions = c.Threads.map(o => [o.Value, o.Label]);
                    timeLimitOptions = c.TimeLimits.map(o => [o.Value === undefined || o.Value === null ? '' : o.Value, o.Label]);
                    names = Object.fromEntries(c.Backends.map(b => [b.Type, b.Name]));
                    order = c.Backends.map(b => b.Type);
                    platforms = Object.fromEntries(c.Backends.map(b => [b.Type, [b.Platforms, b.PlatformNote]]));
                    armOnly = Object.fromEntries(c.Backends.filter(b => b.ArmNote).map(b => [b.Type, b.ArmNote]));
                    tiers = c.Tiers;
                    verdicts = c.Verdicts;
                    notes = c.Findings;
                    settingLabels = c.Settings;
                    speedVideos = c.Videos;
                    speedOutputs = c.Outputs;
                    speedMethod = speedMethod || c.DefaultMethod;
                }

                function el(tag, text, className) {
                    const node = document.createElement(tag);
                    if (text !== undefined && text !== null) {
                        node.textContent = text;
                    }
                    if (className) {
                        node.className = className;
                    }
                    return node;
                }

                function row(table, cells) {
                    const tr = el('tr');
                    for (const c of cells) {
                        tr.appendChild(c instanceof Node ? c : el('td', c));
                    }
                    table.appendChild(tr);
                    return tr;
                }

                function heading(container, title) {
                    const div = el('div', null, 'hwprobe-heading');
                    div.appendChild(el('h2', title, 'sectionTitle'));
                    container.appendChild(div);
                    return div;
                }

                // A collapsible section with Jellyfin's heading style; emby-collapse isn't loaded on plugin pages.
                function fold(container, title, open) {
                    const details = el('details', null, 'hwprobe-fold');
                    details.open = !!open;
                    const summary = el('summary');
                    summary.appendChild(icon('chevron_right'));
                    summary.appendChild(el('h3', title, 'sectionTitle'));
                    details.appendChild(summary);
                    container.appendChild(details);
                    return details;
                }

                // A themed select with its label; returns the select.
                function themedSelect(container, label) {
                    const box = jf('<div class="selectContainer"><label class="selectLabel"></label><select is="emby-select" class="emby-select-withcolor emby-select"></select></div>');
                    box.firstElementChild.textContent = label;
                    container.appendChild(box);
                    return box.lastElementChild;
                }

                // Working and not, in one layout: backend, device, status. Green works, red failed, grey doesn't apply here.
                function backendTable(rows) {
                    const table = el('table', null, 'hwprobe-backends');
                    row(table, [el('th'), el('th', 'Backend'), el('th', 'Device'), el('th', 'Status')]);
                    for (const [type, device, status, fix, state] of rows) {
                        const markCell = state === 'works' ? spokenMark('TurnOn', 'Works') : state === 'failed' ? spokenMark('LeaveOff', 'Failed') : spokenMark('NotTested', 'Not available');
                        row(table, [markCell, names[type] || type, breakable(device || '-'), resultCell(status, fix, state === 'works' ? '' : 'secondaryText')]);
                    }
                    return table;
                }

                function notBuilt(type) {
                    const platform = platforms[type];
                    return (platform && platform[0].indexOf(report.host.os) === -1 ? platform[1] : null)
                        || wrongArchitecture(type)
                        || 'Not built into ffmpeg';
                }

                function wrongArchitecture(type) {
                    const arch = report.host.architecture || 'unknown';
                    return armOnly[type] && arch !== 'unknown' && arch.indexOf('arm') !== 0 ? armOnly[type] : null;
                }


                // A path that may wrap after each slash on a narrow screen, so it never breaks mid-word.
                function breakable(text) {
                    const td = el('td');
                    text.split('/').forEach((part, i, parts) => {
                        td.appendChild(document.createTextNode(part + (i < parts.length - 1 ? '/' : '')));
                        // Not after a leading slash, which would let "/" sit alone on a line.
                        if (part && i < parts.length - 1) {
                            td.appendChild(document.createElement('wbr'));
                        }
                    });
                    return td;
                }

                // A result with a fix links to the fix's guide; the fix's action is the tooltip.
                function resultCell(text, fix, className) {
                    const td = el('td', null, className);
                    if (fix && fix.url) {
                        const a = el('a', text || fix.action, 'button-link');
                        a.href = fix.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.title = fix.action;
                        td.appendChild(a);
                    } else {
                        td.textContent = text || '';
                        if (fix) {
                            td.title = fix.action;
                        }
                    }
                    return td;
                }

                function groupRow(table, title) {
                    row(table, [el('td'), el('td', title)]).className = 'hwprobe-group';
                }

                // A mark with a word for screen readers, since the icon is hidden from them.
                function spokenMark(state, word) {
                    const td = mark(state);
                    td.appendChild(el('span', word, 'hwprobe-sr'));
                    return td;
                }

                function flagMark(on) {
                    return spokenMark(on ? 'TurnOn' : 'LeaveOff', on ? 'On' : 'Off');
                }

                // Material icons, which jellyfin-web loads; the name is the icon.
                function icon(name) {
                    const span = el('span', null, 'material-icons ' + name);
                    span.setAttribute('aria-hidden', 'true');
                    return span;
                }

                function mark(state) {
                    const td = el('td', null, 'hwprobe-mark');
                    td.appendChild(icon(state === 'TurnOn' || state === 'Optional' ? 'check' : state === 'LeaveOff' ? 'close' : 'remove'));
                    return td;
                }

                function outcomeRow(table, label, outcome) {
                    const state = outcome === 'Pass' ? 'TurnOn' : (outcome ? 'LeaveOff' : 'NotTested');
                    const reason = outcome === 'Pass' ? '' : (outcome ? 'Test failed' : 'Not tested');
                    row(table, [mark(state), label, el('td', reason, 'secondaryText'), el('td')]);
                }

                function firstOutcome(cells) {
                    const values = Object.values(cells || {});
                    return values.indexOf('Pass') !== -1 ? 'Pass' : values[0];
                }

                // Built from markup so jellyfin-web's element polyfill upgrades it (registerElement keys on the is attribute).
                function jf(html) {
                    const template = document.createElement('template');
                    template.innerHTML = html;
                    return template.content.firstElementChild;
                }

                // A theme button: flat by default, 'raised button-submit' for the main action, 'raised button-delete' for a risky one.
                function action(text, onClick, kind) {
                    const button = jf('<button is="emby-button" type="button" class="emby-button hwprobe-inline ' + (kind || 'button-flat') + '"><span></span></button>');
                    button.firstElementChild.textContent = text;
                    button.addEventListener('click', () => {
                        button.disabled = true;
                        onClick();
                    });
                    return button;
                }

                // The server's current value for a setting key, or undefined when unknown.
                function current(setting) {
                    if (setting.indexOf('Trickplay:') === 0) {
                        return trickplay ? trickplay[setting.substring('Trickplay:'.length)] : undefined;
                    }
                    if (!encoding) {
                        return undefined;
                    }
                    if (setting === 'DeinterlaceMethod:bwdif') {
                        return encoding.DeinterlaceMethod === 'bwdif';
                    }
                    const prefix = 'HardwareDecodingCodecs:';
                    if (setting.indexOf(prefix) === 0) {
                        return (encoding.HardwareDecodingCodecs || []).indexOf(setting.substring(prefix.length)) !== -1;
                    }
                    return encoding[setting];
                }

                function differs(advice) {
                    const value = current(advice.setting);
                    return advice.state !== 'NotTested' && typeof value === 'boolean' && value !== (advice.state === 'TurnOn' || advice.state === 'Optional');
                }

                function isConfigured(backend) {
                    if (!encoding || encoding.HardwareAccelerationType !== backend.type) {
                        return false;
                    }
                    const device = backend.type === 'vaapi' ? encoding.VaapiDevice : (backend.type === 'qsv' ? encoding.QsvDevice : '');
                    return !device || device === backend.device;
                }

                function post(path, body) {
                    setMessage('');
                    const request = { type: 'POST', url: ApiClient.getUrl(path), dataType: 'json' };
                    if (body) {
                        request.data = JSON.stringify(body);
                        request.contentType = 'application/json';
                    }
                    return ApiClient.ajax(request).then(result => {
                        setMessage(result.Reason || '');
                    }, response => (response && response.json ? response.json() : Promise.resolve({})).then(
                        result => { setMessage((result && result.Reason) || 'The change was refused.'); },
                        () => { setMessage('The change was refused.'); })).then(loadReport);
                }

                function apply(advice) {
                    return post('HwProbe/Apply', advice.map(a => ({ Setting: a.setting, Value: a.state === 'TurnOn' || a.state === 'Optional' })));
                }

                // The old server can still answer for a moment after the restart request, so wait until the
                // plugin reports no pending restart, which only a new server does.
                function waitForServer(deadline) {
                    const retry = () => {
                        if (Date.now() > deadline) {
                            setMessage('Jellyfin didn\'t come back. Reload the page.');
                            return;
                        }
                        setTimeout(() => waitForServer(deadline), 2000);
                    };
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(pending => {
                            if (pending === true) {
                                retry();
                                return;
                            }
                            setMessage('');
                            loadStatus();
                        }, retry);
                }

                function restart() {
                    setMessage('Restarting…');
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('System/Restart') })
                        .then(() => waitForServer(Date.now() + 180000), () => { setMessage('Restart failed.'); });
                }

                // Whether the last change's list is open, kept across re-renders of the same entry.
                let changeOpen = false;
                let changeShown = null;

                function renderChange() {
                    changeText.replaceChildren();
                    const last = history.filter(e => e.Kind !== 'Revert' && !e.RevertedUtc).pop();
                    if (!last) {
                        return;
                    }
                    if (changeShown !== last.TimeUtc) {
                        changeOpen = false;
                        changeShown = last.TimeUtc;
                    }

                    // Revert leaves a setting that was changed again since; the server skips it too. An unknown current
                    // value (settings failed to load) is shown as such rather than guessed.
                    const rows = last.Changes.map(c => {
                        const now = currentText(c.Setting);
                        return { change: c, unknown: now === undefined, kept: now !== undefined && now !== c.NewValue };
                    });
                    const nothing = rows.every(r => r.kept);

                    // A disclosure button beside Revert rather than a summary around it: buttons can't nest, and a
                    // details element would widen with its table and push Revert along.
                    const line = el('div', null, 'hwprobe-change');
                    const toggle = el('button', null, 'hwprobe-disclosure');
                    toggle.type = 'button';
                    toggle.setAttribute('aria-controls', 'hwprobeChangeList');
                    const arrow = el('span', null, 'hwprobe-arrow');
                    arrow.setAttribute('aria-hidden', 'true');
                    toggle.appendChild(arrow);
                    toggle.appendChild(document.createTextNode('Last change: ' + new Date(last.TimeUtc).toLocaleString()));
                    line.appendChild(toggle);
                    // With every setting changed since, Revert would change nothing; it only clears the entry.
                    line.appendChild(action(nothing ? 'Dismiss' : 'Revert', () => post('HwProbe/Revert')));
                    changeText.appendChild(line);

                    const list = el('div', null, 'hwprobe-change-list');
                    list.id = 'hwprobeChangeList';
                    list.appendChild(el('div', nothing ? 'Every setting was changed since; nothing to revert.' : 'Revert sets:', 'secondaryText'));
                    const table = el('table');
                    for (const r of rows) {
                        const c = r.change;
                        // The server labels every setting it knows; the key is a last resort.
                        const label = c.Label || c.Setting;
                        if (r.kept) {
                            row(table, [spokenMark('NotTested', 'Skipped'), label, el('td', 'Changed since, left as is', 'secondaryText')]);
                            continue;
                        }
                        const flag = c.OldValue === 'true' || c.OldValue === 'false';
                        const value = flag ? el('td') : el('td', valueText(c.Setting, c.OldValue));
                        if (r.unknown) {
                            value.appendChild(el('span', (flag ? '' : ' ') + '(current value unknown)', 'secondaryText'));
                        }
                        row(table, [flag ? flagMark(c.OldValue === 'true') : el('td'), label, value]);
                    }
                    list.appendChild(table);
                    changeText.appendChild(list);

                    function show() {
                        list.style.display = changeOpen ? '' : 'none';
                        arrow.textContent = changeOpen ? '▾' : '▸';
                        toggle.setAttribute('aria-expanded', String(changeOpen));
                    }
                    toggle.addEventListener('click', () => {
                        changeOpen = !changeOpen;
                        show();
                    });
                    show();
                }

                // The current value in the form history entries store it, or undefined when unknown.
                function currentText(setting) {
                    if (setting === 'HardwareAccelerationType' || setting === 'VaapiDevice' || setting === 'QsvDevice') {
                        return encoding ? String(encoding[setting] || '') : undefined;
                    }
                    const value = current(setting);
                    return typeof value === 'boolean' ? String(value) : undefined;
                }

                function valueText(setting, value) {
                    if (value === 'true' || value === 'false') {
                        return value === 'true' ? 'On' : 'Off';
                    }
                    if (setting === 'HardwareAccelerationType') {
                        return value === 'none' ? 'None' : (names[value] || value);
                    }
                    return value || 'Not set';
                }

                function restartPrompt() {
                    const pending = el('p', 'Backend changed; Jellyfin needs a restart. ');
                    const button = action('Restart Jellyfin', restart, 'raised button-delete');
                    pending.appendChild(button);
                    return pending;
                }

                // A backend that failed every test still gets used for every transcode until it's changed.
                function renderBrokenBackend(container, viable) {
                    const type = encoding && encoding.HardwareAccelerationType;
                    // Untested isn't a failure, so it gets no warning.
                    if (!type || type === 'none' || viable.some(isConfigured)
                        || report.backends.some(b => b.verdict === 'Untested' && isConfigured(b))) {
                        return;
                    }
                    const warning = el('div', null, 'infoBanner');
                    warning.appendChild(document.createTextNode('Didn\u2019t work in the last probe; transcodes that use it can fail. '));
                    warning.appendChild(action('Switch to None', () => post('HwProbe/UseBackend', { Type: 'none', Device: '' })));
                    container.appendChild(warning);
                }

                function renderSettings(container, viable, title) {
                    container.replaceChildren();
                    title.replaceChildren(el('h2', 'Settings', 'sectionTitle'));
                    if (viable.length > 1) {
                        const pick = themedSelect(title, 'Backend');
                        viable.forEach((b, i) => {
                            const option = el('option', (names[b.type] || b.type) + (viable.filter(o => o.type === b.type).length > 1 ? ' ' + b.device : ''));
                            option.value = String(i);
                            option.selected = b === selected;
                            pick.appendChild(option);
                        });
                        pick.addEventListener('change', () => { selected = viable[Number(pick.value)]; renderSettings(container, viable, title); });
                    } else {
                        title.appendChild(el('span', names[selected.type] || selected.type, 'secondaryText'));
                    }

                    const configured = isConfigured(selected);
                    if (!configured) {
                        title.appendChild(el('span', 'Not the configured backend', 'secondaryText'));
                        title.appendChild(action('Use this backend', () => post('HwProbe/UseBackend', { Type: selected.type, Device: selected.device })));
                    }

                    const settings = selected.settings || [];
                    const table = el('table');
                    const everything = configured ? settings.filter(differs) : [];
                    const header = el('td');
                    if (everything.length > 1) {
                        header.appendChild(action('Apply all', () => apply(everything)));
                    }
                    row(table, [el('th'), el('th', 'Option'), el('th', 'Result'), header]);
                    let group = null;
                    for (const a of settings.filter(x => !x.hidden || differs(x))) {
                        if (a.section !== group) {
                            group = a.section;
                            const pending = configured ? settings.filter(x => x.section === group && differs(x)) : [];
                            const cell = el('td');
                            if (pending.length > 1) {
                                cell.appendChild(action('Apply section', () => apply(pending)));
                            }
                            row(table, [el('td'), el('td', group), el('td'), cell]).className = 'hwprobe-group';
                        }
                        const cell = el('td');
                        if (configured && differs(a)) {
                            cell.appendChild(action('Apply', () => apply([a])));
                        }
                        row(table, [mark(a.state), a.label, resultCell(a.note, a.fix, 'secondaryText'), cell]);
                    }
                    groupRow(table, 'Also tested');
                    outcomeRow(table, 'Hardware deinterlacing', firstOutcome(selected.deinterlace));
                    outcomeRow(table, 'Subtitle burn‑in', firstOutcome(selected.subtitles));
                    container.appendChild(table);
                }

                function renderDetails(r) {
                    const details = fold(results, 'Test details');

                    const table = el('table');
                    row(table, [el('th', 'Backend'), el('th', 'Device'), el('th', 'Column'), el('th', 'Test'), el('th', 'Result')]);
                    for (const b of r.backends) {
                        for (const column of columns) {
                            for (const [key, outcome] of Object.entries(b[column] || {})) {
                                row(table, [b.type, b.device || '-', column, key, outcome]);
                            }
                        }
                    }
                    // Five columns of ids and outcomes don't fit a phone, and breaking them mid-word reads worse than scrolling.
                    const scroll = el('div', null, 'hwprobe-scroll');
                    scroll.appendChild(table);
                    details.appendChild(scroll);
                }

                function renderNotes() {
                    // Low-power findings are already in the settings list.
                    const grouped = {};
                    for (const f of report.findings.filter(x => x.code.indexOf('lowpower') === -1)) {
                        const backend = f.message.split(' ')[0].replace(':', '');
                        (grouped[f.code] = grouped[f.code] || { finding: f, backends: [] }).backends.push(names[backend] || backend);
                    }
                    const codes = Object.keys(grouped);
                    if (!codes.length) {
                        return;
                    }
                    const table = el('table');
                    row(table, [el('th', 'Note'), el('th', 'Backends')]);
                    for (const code of codes) {
                        const g = grouped[code];
                        row(table, [resultCell(notes[code] || g.finding.message, g.finding.fix, ''), g.backends.join(', ')]);
                    }
                    fold(results, 'Notes (' + codes.length + ')').appendChild(table);
                }

                // The configured backend, its result, the run state, and anything that needs doing now.
                function renderCard(viable) {
                    card.replaceChildren();
                    const type = encoding && encoding.HardwareAccelerationType;
                    const top = el('div', null, 'hwprobe-row');
                    const title = el('div');
                    if (!encoding) {
                        title.textContent = 'Hardware acceleration: unknown (Jellyfin\u2019s settings didn\u2019t load)';
                    } else if (!type || type === 'none') {
                        title.textContent = 'Hardware acceleration: None';
                    } else {
                        const entry = report && report.backends.find(isConfigured);
                        const device = type === 'vaapi' ? encoding.VaapiDevice : (type === 'qsv' ? encoding.QsvDevice : '');
                        title.appendChild(document.createTextNode('Hardware acceleration: ' + (names[type] || type) + (device ? ' ' + device : '') + '  '));
                        if (entry && entry.verdict === 'Viable') {
                            title.appendChild(icon('check'));
                            title.appendChild(document.createTextNode(' works  '));
                            title.appendChild(el('span', tiers[entry.tier] || '', 'secondaryText'));
                        } else if (entry) {
                            title.appendChild(icon('close'));
                            title.appendChild(document.createTextNode(' ' + (verdicts[entry.verdict] || entry.verdict)));
                        } else if (report) {
                            title.appendChild(el('span', 'not tested', 'secondaryText'));
                        }
                    }
                    top.appendChild(title);
                    runButton.disabled = running;
                    top.appendChild(runButton);
                    card.appendChild(top);
                    const state = el('div', null, 'hwprobe-row');
                    state.appendChild(statusText);
                    card.appendChild(state);
                    if (report) {
                        renderBrokenBackend(card, viable);
                    }
                    if (restartRequired) {
                        card.appendChild(restartPrompt());
                    }
                    card.appendChild(changeText);
                }

                function render() {
                    results.replaceChildren();
                    const viable = report ? report.backends.filter(b => b.verdict === 'Viable').sort(byDropdown) : [];
                    renderCard(viable);
                    speedViable = viable;
                    speedTab.replaceChildren();
                    if (!report) {
                        results.appendChild(el('p', 'No results yet. Run a probe while nothing is playing; the first run takes a few minutes.', 'secondaryText'));
                        speedTab.appendChild(el('p', 'Run a probe first: speed is measured on the backends it finds working.', 'secondaryText'));
                        return;
                    }

                    const unavailable = report.backends.filter(b => b.verdict !== 'Viable')
                        .map(b => b.verdict === 'NotPresent' && wrongArchitecture(b.type)
                            ? [b.type, '', wrongArchitecture(b.type)]
                            : [b.type, b.verdict === 'NotPresent' ? '' : b.device, verdicts[b.verdict] || b.verdict, b.fix, b.verdict === 'PermissionDenied' || b.verdict === 'DevicePresentPipelineBroken' ? 'failed' : 'absent'])
                        .concat(Object.entries(report.stageA.types || {}).filter(([, s]) => s === 'NotBuilt').map(([t]) => [t, '', notBuilt(t)]))
                        // A NotPresent row per adapter would repeat the same line.
                        .filter((r, i, all) => all.findIndex(o => o[0] === r[0] && o[1] === r[1] && o[2] === r[2]) === i)
                        .sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
                    heading(results, 'Backends');
                    results.appendChild(backendTable(viable.map(b => [b.type, b.device, tiers[b.tier] || 'Works', null, 'works']).concat(unavailable)));

                    if (viable.length) {
                        if (!selected || viable.indexOf(selected) === -1) {
                            selected = viable.find(isConfigured) || viable[0];
                        }
                        const title = heading(results, 'Settings');
                        const container = el('div');
                        results.appendChild(container);
                        renderSettings(container, viable, title);
                    }

                    renderNotes();
                    renderDetails(report);
                    fold(results, 'Diagnostics').appendChild(renderReporting());
                    renderSpeed(speedTab, viable);
                }

                function checkbox(text, checked, onChange) {
                    const label = jf('<label class="emby-checkbox-label"><input type="checkbox" is="emby-checkbox"><span></span></label>');
                    const input = label.firstElementChild;
                    input.checked = checked;
                    input.addEventListener('change', () => onChange(input.checked));
                    label.lastElementChild.textContent = text;
                    return label;
                }

                function chips(items) {
                    const div = el('div', null, 'hwprobe-choices');
                    for (const item of items) {
                        div.appendChild(item);
                    }
                    return div;
                }

                // A rough count for the estimate; the server skips comparisons that don't apply to a backend.
                function speedRuns(viable) {
                    const videos = allVideos().filter(v => chosenVideos.has(v.Key));
                    const outputs = speedOutputs.filter(o => chosenOutputs.has(o.Key));
                    let runs = 0;
                    for (const hardware of [...viable.map(() => true), false]) {
                        for (const v of videos) {
                            for (const o of outputs) {
                                runs += 1;
                                if (o.DecodeOnly) {
                                    runs += hardware && speedCompared.has('Paths') ? 1 : 0;
                                    continue;
                                }
                                runs += (speedCompared.has('AudioVbr') ? 1 : 0) + (speedCompared.has('Preset') ? 2 : 0) + (speedCompared.has('Bitrate') ? 1 : 0);
                                runs += !hardware && speedCompared.has('Quality') ? 1 : 0;
                                runs += v.Interlaced && speedCompared.has('Deinterlace') ? 2 : 0;
                                runs += hardware && speedCompared.has('Paths') ? 2 : 0;
                                runs += speedCompared.has('Subtitles') ? 2 : 0;
                            }
                        }
                    }
                    return runs;
                }

                function sizeText(bytes) {
                    const units = ['bytes', 'KB', 'MB', 'GB'];
                    let i = 0;
                    while (bytes >= 1000 && i < units.length - 1) {
                        bytes /= 1000;
                        i++;
                    }
                    return (i === 0 ? bytes : bytes.toFixed(bytes < 10 ? 1 : 0)) + ' ' + units[i];
                }

                // Clips and samples are kept so later runs don't make or download them again.
                function renderCache() {
                    const line = el('p', null, 'secondaryText');
                    const show = () => ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Cache'), dataType: 'json' }).then(c => {
                        line.replaceChildren(document.createTextNode('Cache: ' + sizeText(c.Bytes) + ' in ' + c.Files + ' file' + (c.Files === 1 ? '' : 's') + ' (test clips, samples) '));
                        if (c.Files > 0) {
                            line.appendChild(action('Delete', () => {
                                ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl('HwProbe/Cache') })
                                    .then(show, () => { setMessage('Could not delete: a probe or speed run is using the cache.'); show(); });
                            }));
                        }
                    }, () => { line.textContent = ''; });
                    show();
                    return line;
                }

                function allVideos() {
                    return libraryVideo ? speedVideos.concat([libraryVideo]) : speedVideos;
                }

                // The results area stays in place while a run polls, so the setup below isn't redrawn under the cursor.
                const speedResults = el('div');

                function renderSpeed(container, viable) {
                    if (!chosenVideos) {
                        chosenVideos = new Set(speedVideos.filter(v => v.Default).map(v => v.Key));
                        chosenOutputs = new Set(speedOutputs.filter(o => o.Default).map(o => o.Key));
                    }

                    const title = heading(container, 'Results');
                    if (speedHistory.length) {
                        const runs = themedSelect(title, 'Run');
                        for (const h of speedHistory) {
                            const option = el('option', new Date(h.GeneratedUtc).toLocaleString() + ' · ' + methodName(h.Method) + ' · ' + h.Tests + ' test' + (h.Tests === 1 ? '' : 's') + (h.Current ? '' : ' (another HwProbe or ffmpeg)'));
                            option.value = h.Id;
                            option.selected = speedViewing ? h.Id === speedViewing : h === speedHistory[0];
                            runs.appendChild(option);
                        }
                        runs.addEventListener('change', () => {
                            ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedHistory/' + runs.value), dataType: 'json' }).then(r => {
                                speedReport = r;
                                speedViewing = runs.value;
                                renderSpeedResults();
                            });
                        });
                    }
                    container.appendChild(speedResults);
                    renderSpeedResults();
                    renderSpeedSetup(fold(container, 'New measurement', !speedReport && !speedLive), viable);
                }

                function renderSpeedResults() {
                    speedResults.replaceChildren();
                    if (speedProgress) {
                        const line = el('div', null, 'hwprobe-row hwprobe-start');
                        const bar = jf('<div class="itemProgressBar hwprobe-progress"><div class="itemProgressBarForeground"></div></div>');
                        bar.firstElementChild.style.width = (speedProgress.Total ? Math.round(100 * speedProgress.Done / speedProgress.Total) : 0) + '%';
                        line.appendChild(bar);
                        line.appendChild(el('span', speedProgressText(speedProgress), 'secondaryText'));
                        const cancel = action('Cancel', () => {
                            cancel.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Speed/Cancel') }).then(loadStatus, loadStatus);
                        });
                        const cancelling = speedProgress.Phase === 'Cancelling';
                        cancel.disabled = cancelling;
                        const paused = speedProgress.Phase === 'Paused' || speedProgress.Phase === 'Pausing';
                        const pause = action(paused ? 'Resume' : 'Pause', () => {
                            pause.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl(paused ? 'HwProbe/Speed/Resume' : 'HwProbe/Speed/Pause') }).then(loadStatus, loadStatus);
                        });
                        pause.disabled = cancelling;
                        line.appendChild(pause);
                        line.appendChild(cancel);
                        speedResults.appendChild(line);
                    }
                    const shown = speedLive || speedReport;
                    if (shown && shown.results.length) {
                        speedResults.appendChild(speedMatrix(shown));
                    } else if (!speedProgress) {
                        speedResults.appendChild(el('p', 'No speed runs yet.', 'secondaryText'));
                    }
                }

                // Searches movies and episodes through Jellyfin's own Items API; the server describes the chosen file.
                function libraryCell(update) {
                    const td = el('td');
                    const box = jf('<div class="inputContainer"><input is="emby-input" type="search"></div>');
                    const search = box.firstElementChild;
                    search.setAttribute('label', 'Library video');
                    search.placeholder = 'Search for a movie or episode';
                    search.value = speedItem ? speedItem.Name : '';
                    td.appendChild(box);
                    const found = el('div', null, 'hwprobe-choices');
                    td.appendChild(found);
                    const choose = item => {
                        found.replaceChildren();
                        search.value = item.Name;
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedLibraryVideo', { itemId: item.Id }), dataType: 'json' }).then(v => {
                            speedItem = { Id: item.Id, Name: item.Name };
                            libraryVideo = v;
                            chosenVideos.add(v.Key);
                            update(true);
                        }, () => setMessage('That item has no local video file to measure.'));
                    };
                    let timer = null;
                    search.addEventListener('input', () => {
                        clearTimeout(timer);
                        const term = search.value.trim();
                        if (term.length < 2) {
                            found.replaceChildren();
                            return;
                        }
                        timer = setTimeout(() => {
                            ApiClient.getItems(ApiClient.getCurrentUserId(), { SearchTerm: term, IncludeItemTypes: 'Movie,Episode', Recursive: true, Limit: 8 }).then(r => {
                                found.replaceChildren(...(r.Items || []).map(item => action(item.SeriesName ? item.SeriesName + ': ' + item.Name : item.Name, () => choose(item))));
                            });
                        }, 300);
                    });
                    return td;
                }

                // A download links to where it comes from, with the credit its licence asks for.
                function sourceCell(v) {
                    const td = el('td', null, 'secondaryText');
                    if (!v.SourceUrl) {
                        td.textContent = v.Origin;
                        return td;
                    }
                    const external = (text, url) => {
                        const a = el('a', text, 'button-link');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        return a;
                    };
                    td.appendChild(external(v.Title, v.ArticleUrl));
                    td.appendChild(document.createTextNode(', ' + v.Origin + ' from '));
                    td.appendChild(external('Wikimedia Commons', v.SourceUrl));
                    const credit = el('div', v.Credit.substring(v.Title.length + 2).replace(/, via Wikimedia Commons$/, '') + ' (', 'hwprobe-small');
                    const licence = el('a', 'licence', 'button-link');
                    licence.href = v.LicenseUrl;
                    licence.target = '_blank';
                    licence.rel = 'noopener noreferrer';
                    credit.appendChild(licence);
                    credit.appendChild(document.createTextNode(')'));
                    td.appendChild(credit);
                    return td;
                }

                function renderSpeedSetup(container, viable) {
                    let button = null;
                    const estimate = el('span', null, 'secondaryText');
                    const update = redraw => {
                        if (redraw) {
                            container.replaceChildren();
                            renderSpeedSetup(container, viable);
                            return;
                        }
                        const videos = allVideos().filter(v => chosenVideos.has(v.Key)).length;
                        const outputs = chosenOutputs.size;
                        const runs = speedRuns(viable);
                        const per = methodSeconds[speedMethod] || [20, 60];
                        const minutes = n => Math.max(1, Math.round(n / 60));
                        const cap = n => speedTimeLimit ? Math.min(n, speedTimeLimit) : n;
                        const low = minutes(runs * cap(per[0] * speedRepeats));
                        const high = minutes(runs * cap(per[1] * speedRepeats));
                        const span = low === high ? 'about ' + low : 'about ' + low + ' to ' + high;
                        estimate.textContent = videos + ' input' + (videos === 1 ? '' : 's') + ' \u00d7 ' + outputs + ' output' + (outputs === 1 ? '' : 's') + ' on ' + (viable.length + 1) + ' backend' + (viable.length ? 's' : '') + ': ' + runs + ' measurement' + (runs === 1 ? '' : 's') + ', ' + span + ' minute' + (high === 1 ? '' : 's');
                        button.disabled = runs === 0 || running;
                    };
                    const pick = (set, key) => on => { if (on) { set.add(key); } else { set.delete(key); } update(); };

                    const box = (set, key, enabled) => {
                        const td = el('td');
                        const check = checkbox('', set.has(key), pick(set, key));
                        check.firstElementChild.disabled = !enabled;
                        td.appendChild(check);
                        return td;
                    };
                    const list = (title, description, headers, rows) => {
                        container.appendChild(el('h3', title, 'sectionTitle'));
                        if (description) {
                            container.appendChild(el('div', description, 'fieldDescription'));
                        }
                        const table = el('table');
                        row(table, [el('th')].concat(headers.map(h => el('th', h))));
                        rows.forEach(r => row(table, r));
                        const scroll = el('div', null, 'hwprobe-scroll');
                        scroll.appendChild(table);
                        container.appendChild(scroll);
                    };

                    list('Input', null, ['Input', 'Format', 'Source'],
                        speedVideos.map(v => [box(chosenVideos, v.Key, true), v.Name, el('td', v.Input, 'secondaryText'), sourceCell(v)])
                            .concat([[box(chosenVideos, 'library', !!libraryVideo), libraryCell(update), el('td', libraryVideo ? libraryVideo.Input : '', 'secondaryText'), el('td', 'Library', 'secondaryText')]]));
                    list('Output', 'Every selected output is made from every selected input.', ['Output', 'Details'],
                        speedOutputs.map(o => [box(chosenOutputs, o.Key, true), o.Label, el('td', o.Detail, 'secondaryText')]));
                    list('Variations', 'Each selected variation measures again with one setting changed from the server\u2019s.', ['Setting', 'Measured'],
                        Object.entries(comparisons).map(([key, [name, values]]) => [box(speedCompared, key, true), name, el('td', values, 'secondaryText')]));

                    container.appendChild(el('h3', 'Settings', 'sectionTitle'));
                    const options = (label, values, current, onChange) => {
                        const select = themedSelect(container, label);
                        for (const [value, text] of values) {
                            const option = el('option', text);
                            option.value = String(value);
                            option.selected = value === current;
                            select.appendChild(option);
                        }
                        select.addEventListener('change', () => { onChange(select.value); update(); });
                    };
                    const serverThreads = encoding ? threadOptions.find(([value]) => value === encoding.EncodingThreadCount) : null;
                    options('Transcoding thread count', [['', 'Server setting' + (serverThreads ? ' (' + serverThreads[1] + ')' : '')]].concat(threadOptions), speedThreads === null ? '' : speedThreads, v => { speedThreads = v === '' ? null : Number(v); });
                    container.appendChild(el('div', 'The most CPU threads each transcode uses, as Jellyfin\u2019s Transcoding thread count setting.', 'fieldDescription'));
                    container.appendChild(el('h3', 'Accuracy and time', 'sectionTitle'));
                    options('Accuracy', Object.entries(methods).map(([key, [, text]]) => [key, text]), speedMethod, v => { speedMethod = v; });
                    options('Repeats', repeatOptions, speedRepeats, v => { speedRepeats = Number(v); });
                    options('Time limit per measurement', timeLimitOptions, speedTimeLimit === null ? '' : speedTimeLimit, v => { speedTimeLimit = v === '' ? null : Number(v); });
                    container.appendChild(el('div', 'A measurement that reaches the limit stops and reports what it measured.', 'fieldDescription'));

                    button = action('Measure speed', () => {
                        const body = { Method: speedMethod, Repeats: speedRepeats, TimeLimitSeconds: speedTimeLimit, EncodingThreadCount: speedThreads, Videos: allVideos().filter(v => chosenVideos.has(v.Key)).map(v => v.Key), Outputs: speedOutputs.filter(o => chosenOutputs.has(o.Key)).map(o => o.Key), Comparisons: [...speedCompared], ItemId: libraryVideo && chosenVideos.has('library') ? speedItem.Id : null };
                        ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Speed'), data: JSON.stringify(body), contentType: 'application/json' })
                            .then(loadStatus, response => (response && response.text ? response.text() : Promise.resolve('')).then(text => {
                                setMessage('Could not start: ' + (text.replace(/^"|"$/g, '') || 'a probe is running or a session is transcoding.'));
                                button.disabled = false;
                            }));
                    }, 'raised button-submit');
                    const go = el('div', null, 'hwprobe-row hwprobe-start');
                    go.appendChild(button);
                    go.appendChild(estimate);
                    container.appendChild(go);
                    container.appendChild(el('div', 'For accurate numbers, measure while nothing is playing and the server isn’t busy with other work, such as library scans or backups. Keep laptops plugged in. Results may vary from run to run.', 'fieldDescription'));
                    container.appendChild(renderCache());
                    update();
                    speedUpdate = update;
                }

                // Runs of the same command vary by a few percent, so smaller differences aren't shown as one.
                const noise = 0.05;

                // Which comparison rows are open, by test, kept across redraws.
                const speedOpen = new Set();

                // Rows grouped by video, one per output; one column per backend; comparisons fold under their row.
                function speedMatrix(r) {
                    const div = el('div');
                    const keyOf = x => x.type + ' ' + x.device;
                    const backends = [];
                    for (const x of r.results) {
                        if (!backends.some(b => keyOf(b) === keyOf(x))) {
                            backends.push(x);
                        }
                    }
                    const sameType = b => backends.filter(o => o.type === b.type).length > 1;
                    const columnName = b => b.type === 'none' ? 'Software' : (names[b.type] || b.type) + (sameType(b) ? ' ' + b.device : '');

                    if (!speedHistory.length && !speedLive) {
                        div.appendChild(el('p', 'Measured ' + new Date(r.generatedUtc).toLocaleString() + ', ' + methodName(r.method).toLowerCase() + ' accuracy', 'secondaryText'));
                    }
                    if (r.cancelled) {
                        div.appendChild(el('div', 'Cancelled: these are the measurements finished before then.', 'infoBanner'));
                    }

                    // A note shared by cells becomes one numbered footnote.
                    const footnotes = [];
                    const footnote = note => {
                        if (!note) {
                            return null;
                        }
                        const i = footnotes.indexOf(note);
                        return i === -1 ? footnotes.push(note) : i + 1;
                    };
                    const speedOf = x => x.fps && x.frameRate ? x.fps / x.frameRate : null;
                    // Fast accuracy derives the stream count from the speed, so only Standard and Thorough get a column for it.
                    const counted = r.method !== 'Quick';
                    // Results run in their planned order, so the first pending one is being measured.
                    const current = speedProgress && (speedProgress.Phase === 'Measuring' || speedProgress.Phase === 'Pausing') ? r.results.find(x => x.pending) : null;
                    const per = counted ? 2 : 1;
                    // Per backend: concurrent streams kept up with, when counted, and one transcode's speed.
                    const cellsFor = (x, best, baseline) => {
                        const bold = x && x === best ? ' hwprobe-best' : '';
                        const streams = el('td', null, 'hwprobe-num' + bold);
                        const speedCell = el('td', null, 'hwprobe-num' + bold);
                        if (!x) {
                            return counted ? [streams, speedCell] : [speedCell];
                        }
                        if (x.pending) {
                            speedCell.textContent = x === current ? 'Measuring\u2026' : '\u2026';
                            speedCell.classList.add('secondaryText');
                            return counted ? [streams, speedCell] : [speedCell];
                        }
                        const speed = speedOf(x);
                        streams.textContent = speed ? streamsText(x) : '';
                        speedCell.textContent = speed ? speed.toFixed(1) + '\u00d7' : '\u2013';
                        if (baseline && speed) {
                            speedCell.appendChild(el('span', ' ' + speedChange(x.fps, baseline.fps), 'hwprobe-small secondaryText'));
                        }
                        const n = footnote(x.note);
                        if (n) {
                            speedCell.appendChild(el('sup', String(n)));
                        }
                        speedCell.title = (x.fps ? Math.round(x.fps) + ' frames a second' : '') + (x.note ? (x.fps ? '. ' : '') + x.note : '');
                        return counted ? [streams, speedCell] : [speedCell];
                    };
                    const bestOf = cells => cells.filter(x => x && x.fps).reduce((a, b) => {
                        if (!a) {
                            return b;
                        }
                        const sa = a.streams === null || a.streams === undefined ? -1 : a.streams;
                        const sb = b.streams === null || b.streams === undefined ? -1 : b.streams;
                        return sb > sa || (sb === sa && b.fps > a.fps) ? b : a;
                    }, null);

                    const table = el('table', null, 'hwprobe-matrix');
                    const top = el('tr');
                    top.appendChild(el('th'));
                    for (const b of backends) {
                        const th = el('th', columnName(b), 'hwprobe-num');
                        th.colSpan = per;
                        top.appendChild(th);
                    }
                    table.appendChild(top);
                    row(table, [el('th', 'Output')].concat(backends.flatMap(() => (counted ? [el('th', 'Concurrent streams', 'hwprobe-num secondaryText')] : []).concat([el('th', 'Speed (\u00d7 real time)', 'hwprobe-num secondaryText')]))));
                    let video = null;
                    for (const key of [...new Set(r.results.map(x => x.test))]) {
                        const base = backends.map(b => r.results.find(x => x.test === key && !x.variant && keyOf(x) === keyOf(b)));
                        const first = base.find(x => x) || r.results.find(x => x.test === key);
                        // Reports from before videos and outputs were recorded show their test's label alone.
                        if (first.video && first.video !== video) {
                            video = first.video;
                            const name = el('td');
                            name.colSpan = backends.length * per + 1;
                            name.appendChild(document.createTextNode(first.video + '  '));
                            name.appendChild(el('span', first.input || '', 'secondaryText hwprobe-small'));
                            const tr = el('tr', null, 'hwprobe-group');
                            tr.appendChild(name);
                            table.appendChild(tr);
                        }
                        const best = bestOf(base);
                        row(table, [el('td', first.output || first.label || key)].concat(base.flatMap(x => cellsFor(x, best, null))));

                        const variants = [...new Set(r.results.filter(x => x.test === key && x.variant).map(x => x.variant))];
                        if (!variants.length) {
                            continue;
                        }
                        const toggle = el('button', null, 'hwprobe-disclosure hwprobe-small secondaryText');
                        toggle.type = 'button';
                        const toggleRow = el('tr', null, 'hwprobe-variant');
                        const toggleCell = el('td');
                        toggleCell.colSpan = backends.length * per + 1;
                        toggleCell.appendChild(toggle);
                        toggleRow.appendChild(toggleCell);
                        table.appendChild(toggleRow);
                        const rows = variants.map(v => {
                            const cells = backends.map(b => r.results.find(x => x.test === key && x.variant === v && keyOf(x) === keyOf(b)));
                            const tr = row(table, [el('td', v)].concat(cells.flatMap((x, i) => cellsFor(x, null, base[i]))));
                            tr.className = 'hwprobe-variant';
                            return tr;
                        });
                        const show = () => {
                            const open = speedOpen.has(key);
                            toggle.textContent = (open ? '▾ ' : '▸ ') + 'With one setting changed (' + variants.length + ')';
                            toggle.setAttribute('aria-expanded', String(open));
                            rows.forEach(tr => { tr.hidden = !open; });
                        };
                        toggle.addEventListener('click', () => {
                            if (speedOpen.has(key)) { speedOpen.delete(key); } else { speedOpen.add(key); }
                            show();
                        });
                        show();
                    }
                    const scroll = el('div', null, 'hwprobe-scroll');
                    scroll.appendChild(table);
                    div.appendChild(scroll);

                    footnotes.forEach((note, i) => {
                        const line = el('div', null, 'fieldDescription');
                        line.appendChild(el('sup', String(i + 1)));
                        line.appendChild(document.createTextNode(' ' + note));
                        div.appendChild(line);
                    });
                    const streamsLegend = counted
                        ? 'Concurrent streams: how many of that transcode the backend keeps up with when run together (16+ is the most measured). '
                        : 'Fast accuracy doesn\u2019t count concurrent streams; Standard and Thorough run transcodes together to count them. ';
                    div.appendChild(el('div', 'Speed: one transcode on its own, as a multiple of real time (2\u00d7 is twice as fast as playing); point at it for frames a second. ' + streamsLegend + 'Bold is the best backend for that row. Test videos are easier to encode than real video, so their numbers run high.', 'fieldDescription'));

                    const credits = new Map();
                    for (const x of r.results) {
                        if (x.credit) {
                            credits.set(x.credit, x.licenseUrl);
                        }
                    }
                    if (credits.size) {
                        const line = el('div', 'Samples: ', 'fieldDescription');
                        [...credits].forEach(([credit, url], i) => {
                            line.appendChild(document.createTextNode((i ? '; ' : '') + credit + ' ('));
                            const link = el('a', 'licence', 'button-link');
                            link.href = url;
                            link.target = '_blank';
                            line.appendChild(link);
                            line.appendChild(document.createTextNode(')'));
                        });
                        div.appendChild(line);
                    }
                    if (r.settings) {
                        const used = fold(div, 'Settings used');
                        const table = el('table');
                        for (const [label, value] of settingsRows(r.settings)) {
                            row(table, [label, el('td', value, 'secondaryText')]);
                        }
                        used.appendChild(table);
                    }
                    return div;
                }

                function settingsRows(t) {
                    const onOff = on => on ? 'On' : 'Off';
                    return [
                        ['encodingThreadCount', t.encodingThreadCount > 0 ? String(t.encodingThreadCount) : 'Automatic'],
                        ['encoderPreset', t.encoderPreset || 'Auto (veryfast)'],
                        ['crf', 'H.264 ' + t.h264Crf + ', HEVC ' + t.h265Crf],
                        ['audioVbr', onOff(t.audioVbr)],
                        ['tonemap', onOff(t.tonemap) + (t.vppTonemap ? ', VPP' : '')],
                        ['lowPower', 'H.264 ' + onOff(t.lowPowerH264) + ', HEVC ' + onOff(t.lowPowerHevc)],
                        ['deinterlace', (t.bwdif ? 'BWDIF' : 'YADIF') + (t.doubleRate ? ', double rate' : '')],
                        ['preferNativeDecoder', onOff(t.preferNativeDecoder)],
                        ['enhancedNvdec', onOff(t.enhancedNvdec)]
                    ].map(([key, value]) => [settingLabels[key] || key, value]);
                }

                // Status of a running speed run: test videos being prepared, then measurements with the time left.
                function speedProgressText(s) {
                    if (s.Phase === 'Cancelling') {
                        return 'Cancelling\u2026';
                    }
                    if (s.Phase === 'Paused') {
                        return 'Paused after ' + (s.Done || 0) + ' of ' + s.Total;
                    }
                    if (s.Phase === 'Pausing') {
                        return 'Pausing when this measurement finishes\u2026';
                    }
                    if (s.Phase === 'Preparing' || !s.Total) {
                        return (s.Preparing || 'Preparing test videos') + '\u2026';
                    }
                    const done = s.Done || 0;
                    const left = timeLeft(s);
                    return 'Measured ' + done + ' of ' + s.Total + (left ? ', ' + left : '');
                }

                // From the measurements so far; before the first, from the accuracy's typical time per measurement.
                function timeLeft(s) {
                    const done = s.Done || 0;
                    const remaining = s.Total - done;
                    if (remaining <= 0) {
                        return '';
                    }
                    let seconds;
                    if (done > 0 && s.MeasuringSeconds) {
                        seconds = s.MeasuringSeconds / done * remaining;
                    } else {
                        const per = methodSeconds[speedLive ? speedLive.method : speedMethod] || [20, 60];
                        seconds = remaining * (per[0] + per[1]) / 2 * (speedLive && speedLive.repeats ? speedLive.repeats : 1);
                    }
                    const minutes = Math.round(seconds / 60);
                    return seconds < 60 ? 'under a minute left'
                        : minutes < 90 ? 'about ' + minutes + ' minute' + (minutes === 1 ? '' : 's') + ' left'
                        : 'about ' + Math.round(minutes / 60) + ' hours left';
                }

                function streamsText(x) {
                    if (x.streams === null || x.streams === undefined) {
                        return '-';
                    }
                    return x.capped ? x.streams + '+' : String(x.streams);
                }

                function speedChange(fps, baseFps) {
                    if (!fps || !baseFps) {
                        return '-';
                    }
                    const change = fps / baseFps - 1;
                    if (Math.abs(change) < noise) {
                        return 'same';
                    }
                    return (change > 0 ? '+' : '\u2212') + Math.round(Math.abs(change) * 100) + '%';
                }

                function renderReporting() {
                    const div = el('div');
                    div.appendChild(el('p', 'The report and every ffmpeg log of the last probe, to attach to a GitHub issue.', 'secondaryText'));
                    div.appendChild(el('div', 'Not anonymised: holds file paths and this server\u2019s user and host names. Check before sharing.', 'infoBanner'));
                    const buttons = el('p');
                    const download = action('Download diagnostics', () => {
                        // ApiClient.ajax returns the raw response for a non-JSON request, with the session's token sent.
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Diagnostics') })
                            .then(response => response.blob())
                            .then(blob => {
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = 'hwprobe-diagnostics.zip';
                                a.click();
                                setTimeout(() => URL.revokeObjectURL(a.href), 60000);
                            }, () => { setMessage('Could not download diagnostics: run a probe first.'); })
                            .then(() => { download.disabled = false; });
                    });
                    buttons.appendChild(download);
                    buttons.appendChild(document.createTextNode(' '));
                    const issue = el('a', 'Report on GitHub', 'button-link');
                    issue.href = 'https://github.com/Rinn/jellyfin-plugin-hwprobe/issues/new?template=hardware-report.yml';
                    issue.target = '_blank';
                    buttons.appendChild(issue);
                    div.appendChild(buttons);
                    return div;
                }

                function loadReport() {
                    const config = ApiClient.getNamedConfiguration('encoding').then(c => { encoding = c; }, () => { encoding = null; });
                    const server = ApiClient.getServerConfiguration().then(c => { trickplay = c.TrickplayOptions || null; }, () => { trickplay = null; });
                    const data = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Report'), dataType: 'json' })
                        .then(r => { report = r; }, () => { report = null; });
                    const changes = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/History'), dataType: 'json' })
                        .then(h => { history = h || []; }, () => { history = []; });
                    const pending = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(r => { restartRequired = r === true; }, () => { restartRequired = false; });
                    const catalog = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Catalog'), dataType: 'json' }).then(useCatalog, () => {});
                    const speed = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Speed'), dataType: 'json' })
                        .then(r => { speedReport = r; speedViewing = null; }, () => { speedReport = null; speedViewing = null; });
                    const runs = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedHistory'), dataType: 'json' })
                        .then(h => { speedHistory = h || []; }, () => { speedHistory = []; });
                    return Promise.all([config, server, data, changes, pending, catalog, speed, runs]).then(() => { renderChange(); render(); });
                }

                // jellyfin-web keeps a loaded plugin page until the browser reloads, so after an update this tab could
                // still be running the old page.
                let loadedVersion = null;
                let loaded = false;

                function loadStatus() {
                    return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Status'), dataType: 'json' }).then(s => {
                        loadedVersion = loadedVersion || s.HwProbeVersion;
                        if (s.HwProbeVersion && s.HwProbeVersion !== loadedVersion) {
                            setMessage('HwProbe was updated. Reload the page to see the new version. ');
                            messageText.appendChild(action('Reload', () => location.reload(), 'raised'));
                        }
                        running = s.State === 'Running';
                        runButton.disabled = running;
                        if (running) {
                            const text = s.Activity === 'Speed'
                                ? speedProgressText(s)
                                : 'Probing\u2026';
                            statusText.textContent = text;
                            speedUpdate();
                            pollTimer = setTimeout(loadStatus, 3000);
                            // A page opened mid-run still needs its first render.
                            if (!loaded) {
                                loaded = true;
                                loadReport();
                            }
                            if (s.Activity === 'Speed') {
                                speedProgress = s;
                                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedProgress'), dataType: 'json' })
                                    .then(r => { speedLive = r; }, () => {}).then(renderSpeedResults);
                            }
                            return;
                        }
                        speedProgress = null;
                        speedLive = null;
                        loaded = true;
                        const last = s.Activity === 'Speed' ? 'Last speed run' : 'Last probe';
                        statusText.textContent = s.LastError ? last + ' failed: ' + s.LastError : (s.LastCompletedUtc ? last + ' ' + new Date(s.LastCompletedUtc).toLocaleString() : '');
                        loadReport();
                    });
                }

                page.addEventListener('pageshow', loadStatus);
                page.addEventListener('pagehide', () => clearTimeout(pollTimer));
            })();
        </script>
    </div>
</body>
</html>
