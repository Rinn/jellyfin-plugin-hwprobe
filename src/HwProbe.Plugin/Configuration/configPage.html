            #HwProbeConfigPage .emby-button:disabled { color: var(--jf-palette-action-disabled, rgba(255, 255, 255, 0.3)); background: var(--jf-palette-action-disabledBackground, rgba(255, 255, 255, 0.12)); cursor: default; }
            #HwProbeConfigPage .emby-button.button-flat:disabled { background: transparent; }
            /* jellyfin-web hides a disabled select's field and arrow with !important; this draws it like the dashboard's disabled MUI select. */
            #HwProbeConfigPage .emby-select-withcolor:disabled { opacity: 1; background-color: var(--jf-palette-action-disabledBackground, rgba(255, 255, 255, 0.12)) !important; border-bottom-style: dotted; border-bottom-color: var(--jf-palette-action-disabled, rgba(255, 255, 255, 0.3)) !important; color: var(--jf-palette-action-disabled, rgba(255, 255, 255, 0.3)) !important; }
            #HwProbeConfigPage .emby-select-withcolor:disabled + .selectArrowContainer { display: block; opacity: 0.3; }

        <div data-role="content">
            <div class="content-primary">
                <h1>HwProbe</h1>
                <div class="emby-tabs-slider hwprobe-tabbar" role="tablist">
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabProbe" aria-controls="hwprobeProbeTab" aria-selected="true" class="emby-tab-button emby-button emby-tab-button-active"><div class="emby-button-foreground">Hardware Probe</div></button>
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabSettings" aria-controls="hwprobeSettingsTab" aria-selected="false" class="emby-tab-button emby-button"><div class="emby-button-foreground">Recommended Settings</div></button>
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabSpeed" aria-controls="hwprobeSpeedTab" aria-selected="false" class="emby-tab-button emby-button"><div class="emby-button-foreground">Performance Tests</div></button>
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabResults" aria-controls="hwprobeResultsTab" aria-selected="false" class="emby-tab-button emby-button"><div class="emby-button-foreground">Test Results</div></button>
                    <button is="emby-button" type="button" role="tab" id="hwprobeTabHelp" aria-controls="hwprobeHelpTab" aria-selected="false" class="emby-tab-button emby-button"><div class="emby-button-foreground">Help</div></button>
                </div>
                <div id="hwprobeMessage" class="infoBanner" hidden></div>
                <div id="hwprobeProbeTab" role="tabpanel" aria-labelledby="hwprobeTabProbe">
                    <div id="hwprobeCard" class="paperList hwprobe-card"></div>
                    <div id="hwprobeResults"></div>
                </div>
                <div id="hwprobeSettingsTab" role="tabpanel" aria-labelledby="hwprobeTabSettings" hidden></div>
                <div id="hwprobeSpeedTab" role="tabpanel" aria-labelledby="hwprobeTabSpeed" hidden></div>
                <div id="hwprobeResultsTab" role="tabpanel" aria-labelledby="hwprobeTabResults" hidden></div>
                <div id="hwprobeHelpTab" role="tabpanel" aria-labelledby="hwprobeTabHelp" hidden></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                // The server's API uses PascalCase; the report keeps hwprobe's own camelCase schema.
                // No template literals: jellyfin-web's translateHtml treats every dollar sign followed by
                // a brace in the page, scripts included, as a translation key and replaces it.
                const page = document.querySelector('#HwProbeConfigPage');
                const results = page.querySelector('#hwprobeResults');
                const card = page.querySelector('#hwprobeCard');
                const messageText = page.querySelector('#hwprobeMessage');
                // Kept across renders: the status updates while a run polls, without redrawing the page.
                const statusText = el('span', null, 'secondaryText');
                const probeBar = loadBar();
                const changeText = el('div');
                let running = false;
                // Buttons that start work or change settings, which the server refuses while a probe or performance test runs.
                let idleButtons = [];
                const runButton = idleAction('Run probe', () => {
                    statusText.textContent = 'Probing\u2026';
                    probeProgress = {};
                    render();
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Run') })
                        .then(loadStatus, () => { setMessage('Could not start: a probe is running or a session is transcoding.'); runButton.disabled = false; probeProgress = null; render(); loadStatus(); });
                }, 'raised button-submit');

                // The banner is a themed panel, so it's hidden while empty.
                function setMessage(text) {
                    messageText.textContent = text || '';
                    messageText.hidden = !text;
                }
                const settingsTab = page.querySelector('#hwprobeSettingsTab');
                const speedTab = page.querySelector('#hwprobeSpeedTab');
                const resultsTab = page.querySelector('#hwprobeResultsTab');
                const helpTab = page.querySelector('#hwprobeHelpTab');
                const tabs = [['#hwprobeTabProbe', '#hwprobeProbeTab'], ['#hwprobeTabSettings', '#hwprobeSettingsTab'], ['#hwprobeTabSpeed', '#hwprobeSpeedTab'], ['#hwprobeTabResults', '#hwprobeResultsTab'], ['#hwprobeTabHelp', '#hwprobeHelpTab']].map(([b, p]) => [page.querySelector(b), page.querySelector(p)]);

                function showTab(button) {
                    for (const [b, panel] of tabs) {
                        const on = b === button;
                        b.classList.toggle('emby-tab-button-active', on);
                        b.setAttribute('aria-selected', String(on));
                        panel.hidden = !on;
                    }
                    // On a phone the tab bar scrolls sideways; keep the chosen tab in sight.
                    button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
                for (const [button] of tabs) {
                    button.addEventListener('click', () => showTab(button));
                }
                const columns = ['decode', 'encode', 'tonemap', 'deinterlace', 'subtitles'];
                let pollTimer = null;
                let report = null;
                // Only used to open the configured backend's settings first.
                let encoding = null;
                let trickplay = null;
                let selected = null;
                let history = [];
                let restartRequired = false;
                let speedVideos = [];
                let speedAudios = [];
                let speedOutputs = [];
                // Seconds an audio measurement takes, low and high, for the estimate.
                let audioSeconds = [1, 4];
                let speedReport = null;
                // While a speed run goes, its results so far; shown in place of the saved run.
                let speedLive = null;
                let speedProgress = null;
                let probeProgress = null;
                let speedMethod = null;
                let speedRepeats = 1;
                let speedReuse = true;
                let speedResources = null;
                let speedWhenTranscoding = null;
                let suiteResources = null;
                let suiteReuse = true;
                let chosenSuite = null;
                // The suites as last listed, for their notes beside a suite's results.
                let suiteList = [];
                let suiteWhenTranscoding = null;
                let speedTimeLimit = null;
                // Null measures with the server's own thread count.
                // Run options chosen on the page, by catalog key; one left out keeps the server's setting.
                const speedSettings = {};
                let chosenVideos = null;
                let chosenAudios = null;
                let chosenAudioOutputs = null;
                // Outputs are every chosen codec at every chosen quality; 'decode' is chosen with the codecs.
                let chosenCodecs = null;
                let chosenQualities = null;
                let speedCodecs = [];
                let speedQualities = [];
                let speedItem = null;
                let libraryVideo = null;
                let speedHistory = [];
                let speedViewing = null;
                let speedViable = [];
                // The current Speed section's estimate; one listener calls it, however often the section is redrawn.
                let speedUpdate = () => {};
                // Backends to measure, by type with 'none' for software; null until the first setup draw chooses them all.
                let chosenBackends = null;
                // Labels and choices from the server's catalog (catalog.yaml in HwProbe.Core), filled in by loadReport.
                let methods = {};
                let methodSeconds = {};
                let repeatOptions = [];
                let runOptions = [];
                let settingGroups = [];
                let timeLimitOptions = [];
                let whenTranscodingOptions = [];
                let defaultMethod = null;
                let gpuEngines = {};
                let links = {};
                // The catalog's thresholds, once it has loaded.
                let advice = { Noise: 0 };
                let resourceNames = {};
                let powerDomains = {};
                let resourceHeaders = {};
                // Labels and caveats for server settings suggestions change that aren't run options.
                let serverLabels = {};
                // The server's Internet streaming bitrate limit, to mark a suggested limit already set.
                let remoteLimit = null;
                let names = {};
                let order = [];
                let platforms = {};
                let armOnly = {};
                let tiers = {};
                let verdicts = {};
                let outcomeNotes = {};
                let notes = {};
                let settingLabels = {};
                const methodName = m => (methods[m] || [m])[0];
                const byDropdown = (a, b) => order.indexOf(a.type) - order.indexOf(b.type);

                function useCatalog(c) {
                    methods = Object.fromEntries(c.Methods.map(m => [m.Key, [m.Name, m.Description]]));
                    methodSeconds = Object.fromEntries(c.Methods.map(m => [m.Key, m.Seconds]));
                    repeatOptions = c.Repeats.map(o => [o.Value, o.Label]);
                    runOptions = c.Options;
                    settingGroups = c.SettingGroups;
                    timeLimitOptions = c.TimeLimits.map(o => [o.Value === undefined || o.Value === null ? '' : o.Value, o.Label]);
                    // Software is the none backend, named for results; the dropdown keeps its own "None (software)".
                    names = Object.fromEntries([['none', c.SoftwareName]].concat(c.Backends.map(b => [b.Type, b.Name])));
                    advice = c.Advice;
                    resourceNames = c.ResourceNames;
                    powerDomains = c.PowerDomains;
                    resourceHeaders = c.ResourceHeaders;
                    serverLabels = c.Labels;
                    order = c.Backends.map(b => b.Type);
                    platforms = Object.fromEntries(c.Backends.map(b => [b.Type, [b.Platforms, b.PlatformNote]]));
                    armOnly = Object.fromEntries(c.Backends.filter(b => b.ArmNote).map(b => [b.Type, b.ArmNote]));
                    tiers = c.Tiers;
                    verdicts = c.Verdicts;
                    outcomeNotes = c.Outcomes;
                    notes = c.Findings;
                    settingLabels = c.Settings;
                    gpuEngines = c.GpuEngines;
                    links = c.Links;
                    speedVideos = c.Videos;
                    speedAudios = c.Audios;
                    audioSeconds = c.AudioSeconds;
                    speedOutputs = c.Outputs;
                    speedCodecs = c.Codecs;
                    speedQualities = c.Qualities;
                    whenTranscodingOptions = c.WhenTranscoding.map(o => [o.Key, o.Label]);
                    speedWhenTranscoding = speedWhenTranscoding || c.DefaultWhenTranscoding;
                    suiteWhenTranscoding = suiteWhenTranscoding || c.DefaultWhenTranscoding;
                    speedResources = speedResources === null ? c.DefaultMeasureResources : speedResources;
                    suiteResources = suiteResources === null ? c.DefaultMeasureResources : suiteResources;
                    defaultMethod = c.DefaultMethod;
                    speedMethod = speedMethod || c.DefaultMethod;
                }

                function el(tag, text, className) {
                    const node = document.createElement(tag);
                    if (text !== undefined && text !== null) {
                        node.textContent = text;
                    }
                    if (className) {
                        node.className = className;
                    }
                    return node;
                }

                function row(table, cells) {
                    const tr = el('tr');
                    for (const c of cells) {
                        tr.appendChild(c instanceof Node ? c : el('td', c));
                    }
                    table.appendChild(tr);
                    return tr;
                }

                // Which sections were opened or closed, by key, kept across redraws.
                const foldOpen = new Map();

                // A notice banner with a line per note.
                function noteBanner(notes) {
                    const banner = el('div', null, 'infoBanner');
                    notes.forEach(n => banner.appendChild(el('div', n)));
                    return banner;
                }

                // A collapsible section with Jellyfin's heading style; emby-collapse isn't loaded on plugin pages.
                // The key defaults to the title without a trailing count.
                function fold(container, title, open, level, key) {
                    const details = el('details', null, 'hwprobe-fold');
                    const id = key || title.replace(/ \(\d+\)$/, '');
                    details.open = foldOpen.has(id) ? foldOpen.get(id) : !!open;
                    details.addEventListener('toggle', () => foldOpen.set(id, details.open));
                    const summary = el('summary');
                    summary.appendChild(icon('chevron_right'));
                    summary.appendChild(el(level || 'h2', title, 'sectionTitle'));
                    details.appendChild(summary);
                    container.appendChild(details);
                    return details;
                }

                // A themed select with its label; returns the select.
                function themedSelect(container, label) {
                    const box = jf('<div class="selectContainer"><label class="selectLabel"></label><select is="emby-select" class="emby-select-withcolor emby-select"></select></div>');
                    box.firstElementChild.textContent = label;
                    container.appendChild(box);
                    filledMenu(box.lastElementChild);
                    return box.lastElementChild;
                }

                // A menu like the dashboard's own selects (MUI's Menu), under its field or above when it doesn't fit, within 48px of the window edges.
                function popMenu(anchor, fill) {
                    // A second press on the open field closes its menu, as MUI's does; another field's replaces it.
                    const reopening = openMenu && openMenu.anchor === anchor;
                    closeMenu();
                    if (reopening) {
                        return;
                    }
                    const menu = el('div', null, 'hwprobe-menu');
                    menu.setAttribute('role', 'listbox');
                    const close = () => {
                        if (openMenu && openMenu.menu === menu) {
                            openMenu = null;
                        }
                        menu.remove();
                        document.removeEventListener('mousedown', outside, true);
                        document.removeEventListener('keydown', escape, true);
                        window.removeEventListener('resize', close);
                        window.removeEventListener('scroll', onScroll, true);
                    };
                    const outside = ev => { if (!menu.contains(ev.target) && ev.target !== anchor) { close(); } };
                    const escape = ev => { if (ev.key === 'Escape') { close(); anchor.focus(); } };
                    const onScroll = ev => { if (!menu.contains(ev.target)) { close(); } };
                    fill(menu, close);
                    const rect = anchor.getBoundingClientRect();
                    menu.style.left = rect.left + 'px';
                    menu.style.width = rect.width + 'px';
                    document.body.appendChild(menu);
                    const below = window.innerHeight - rect.bottom - 48;
                    const above = rect.top - 48;
                    const height = Math.min(menu.scrollHeight, Math.max(below, above));
                    menu.style.maxHeight = height + 'px';
                    menu.style.top = (below >= height || below >= above ? rect.bottom : rect.top - height) + 'px';
                    const chosen = menu.querySelector('.hwprobe-menu-selected');
                    if (chosen) {
                        menu.scrollTop = chosen.offsetTop - (height - chosen.offsetHeight) / 2;
                    }
                    document.addEventListener('mousedown', outside, true);
                    document.addEventListener('keydown', escape, true);
                    window.addEventListener('resize', close);
                    window.addEventListener('scroll', onScroll, true);
                    openMenu = { anchor, menu, close };
                }

                let openMenu = null;

                function closeMenu() {
                    if (openMenu) {
                        openMenu.close();
                    }
                }

                // A mouse opens the dashboard-style menu instead of the browser's list; the keyboard keeps the native one.
                function filledMenu(select) {
                    select.addEventListener('mousedown', e => {
                        if (e.button !== 0 || select.disabled) {
                            return;
                        }
                        e.preventDefault();
                        select.focus();
                        popMenu(select, (menu, close) => {
                            for (const option of select.options) {
                                const item = el('div', option.textContent, 'hwprobe-menu-item' + (option.selected ? ' hwprobe-menu-selected' : ''));
                                item.setAttribute('role', 'option');
                                item.addEventListener('click', () => {
                                    close();
                                    if (select.value !== option.value) {
                                        select.value = option.value;
                                        select.dispatchEvent(new Event('change', { bubbles: true }));
                                    }
                                });
                                menu.appendChild(item);
                            }
                        });
                    });
                }

                // A field choosing several, like the dashboard's multiple selects: it lists the chosen ones, and its menu ticks them and stays open.
                function multiSelect(container, label, items, chosen, onChange) {
                    const box = el('div', null, 'selectContainer');
                    box.appendChild(el('label', label, 'selectLabel'));
                    const field = el('div', null, 'hwprobe-multi');
                    field.tabIndex = 0;
                    field.setAttribute('role', 'combobox');
                    field.setAttribute('aria-label', label);
                    box.appendChild(field);
                    container.appendChild(box);
                    const show = () => {
                        const names = items.filter(i => chosen.has(i.key)).map(i => i.text);
                        field.textContent = names.length ? names.join(', ') : 'None';
                    };
                    show();
                    const open = () => popMenu(field, menu => {
                        menu.setAttribute('aria-multiselectable', 'true');
                        for (const i of items) {
                            const item = el('div', null, 'hwprobe-menu-item hwprobe-menu-check');
                            item.setAttribute('role', 'option');
                            const mark = icon(chosen.has(i.key) ? 'check_box' : 'check_box_outline_blank');
                            item.appendChild(mark);
                            item.appendChild(el('span', i.text));
                            if (i.secondary) {
                                item.appendChild(el('span', i.secondary, 'secondaryText'));
                            }
                            const paint = () => {
                                const on = chosen.has(i.key);
                                // jellyfin-web's icon font draws the glyph its class names.
                                mark.className = 'material-icons ' + (on ? 'check_box' : 'check_box_outline_blank');
                                item.classList.toggle('hwprobe-menu-selected', on);
                                item.setAttribute('aria-selected', String(on));
                            };
                            paint();
                            item.addEventListener('click', () => {
                                if (chosen.has(i.key)) {
                                    chosen.delete(i.key);
                                } else {
                                    chosen.add(i.key);
                                }
                                paint();
                                show();
                                onChange();
                            });
                            menu.appendChild(item);
                        }
                    });
                    field.addEventListener('mousedown', e => {
                        if (e.button === 0) {
                            e.preventDefault();
                            field.focus();
                            open();
                        }
                    });
                    field.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            open();
                        }
                    });
                    return box;
                }

                // Working and not, in one layout: backend, device, status. Green works, red failed, grey doesn't apply here.
                const sortState = {};

                // A line before each group of columns under one heading (a backend, or a suite step), so its figures read together.
                // first: the columns before the groups; size: columns per group. A row of one spanning cell is left alone, and the heading row's spanning cells each start a group.
                function divideGroups(table, first, size) {
                    for (const tr of table.rows) {
                        const cells = [...tr.cells];
                        if (cells.length === 1) {
                            continue;
                        }
                        const step = cells.some(c => c.colSpan > 1) ? 1 : size;
                        for (let i = first; i < cells.length; i += step) {
                            cells[i].classList.add('hwprobe-divide');
                        }
                    }
                    return table;
                }

                function sortable(table, name) {
                    const header = [...table.rows].filter(r => r.querySelector('th')).pop();
                    if (!header) {
                        return table;
                    }
                    const value = (r, i) => {
                        const c = r.cells[i];
                        return c ? (c.dataset.sort !== undefined ? c.dataset.sort : c.textContent.trim()) : '';
                    };
                    const apply = (i, ascending) => {
                        [...header.cells].forEach((c, j) => {
                            if (j === i) {
                                c.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
                            } else {
                                c.removeAttribute('aria-sort');
                            }
                        });
                        // Rows sort within each group, between the group rows.
                        const segments = [[]];
                        for (const r of [...table.rows].filter(r => !r.querySelector('th'))) {
                            if (r.classList.contains('hwprobe-group')) {
                                segments.push([r]);
                            } else {
                                segments[segments.length - 1].push(r);
                            }
                        }
                        const order = (a, b) => {
                            const x = value(a, i);
                            const y = value(b, i);
                            if (x === '' || y === '') {
                                return (x === '') - (y === '');
                            }
                            const compared = !isNaN(Number(x)) && !isNaN(Number(y)) ? Number(x) - Number(y) : x.localeCompare(y, undefined, { numeric: true });
                            return ascending ? compared : -compared;
                        };
                        for (const segment of segments) {
                            const group = segment[0] && segment[0].classList.contains('hwprobe-group') ? segment.shift() : null;
                            if (group) {
                                table.appendChild(group);
                            }
                            segment.sort(order).forEach(r => table.appendChild(r));
                        }
                        sortState[name] = [i, ascending];
                    };
                    [...header.cells].forEach((th, i) => {
                        if (!th.textContent.trim() || th.querySelector('button')) {
                            return;
                        }
                        th.classList.add('hwprobe-sortable');
                        th.tabIndex = 0;
                        const go = () => apply(i, th.getAttribute('aria-sort') !== 'ascending');
                        th.addEventListener('click', go);
                        th.addEventListener('keydown', e => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                go();
                            }
                        });
                    });
                    if (sortState[name] && sortState[name][0] < header.cells.length) {
                        apply(sortState[name][0], sortState[name][1]);
                    }
                    return table;
                }

                function backendTable(rows) {
                    const table = el('table', null, 'hwprobe-backends hwprobe-full');
                    row(table, [el('th'), el('th', 'Backend'), el('th', 'Device'), el('th', 'Status')]);
                    for (const [type, device, status, fix, state] of rows) {
                        const markCell = state === 'works' ? emojiMark('\u2705', 'Works') : state === 'failed' ? emojiMark('\u274c', 'Failed') : emojiMark('\ud83d\udeab', 'Not available');
                        row(table, [markCell, names[type] || type, breakable(device || '-'), resultCell(status, fix, state === 'works' ? '' : 'secondaryText')]);
                    }
                    return sortable(table, 'backends');
                }

                function notBuilt(type) {
                    const platform = platforms[type];
                    return (platform && platform[0].indexOf(report.host.os) === -1 ? platform[1] : null)
                        || wrongArchitecture(type)
                        || 'Not built into ffmpeg';
                }

                function wrongArchitecture(type) {
                    const arch = report.host.architecture || 'unknown';
                    return armOnly[type] && arch !== 'unknown' && arch.indexOf('arm') !== 0 ? armOnly[type] : null;
                }


                // A path that may wrap after each slash on a narrow screen, so it never breaks mid-word.
                function breakable(text) {
                    const td = el('td');
                    text.split('/').forEach((part, i, parts) => {
                        td.appendChild(document.createTextNode(part + (i < parts.length - 1 ? '/' : '')));
                        // Not after a leading slash, which would let "/" sit alone on a line.
                        if (part && i < parts.length - 1) {
                            td.appendChild(document.createElement('wbr'));
                        }
                    });
                    return td;
                }

                // A result with a fix links to the fix's guide; the fix's action is the tooltip.
                function resultCell(text, fix, className) {
                    const td = el('td', null, className);
                    if (fix && fix.url) {
                        const a = el('a', text || fix.action, 'button-link');
                        a.href = fix.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.title = fix.action;
                        td.appendChild(a);
                    } else {
                        td.textContent = text || '';
                        if (fix) {
                            td.title = fix.action;
                        }
                    }
                    return td;
                }

                function groupRow(table, title) {
                    const cell = el('td', title);
                    cell.colSpan = 10;
                    row(table, [el('td'), cell]).className = 'hwprobe-group';
                }

                // A mark with a word for screen readers, since the icon is hidden from them.
                function spokenMark(state, word) {
                    const td = mark(state);
                    td.appendChild(el('span', word, 'hwprobe-sr'));
                    return td;
                }

                function emojiMark(emoji, word) {
                    const td = el('td', null, 'hwprobe-mark');
                    const glyph = el('span', emoji, 'hwprobe-emoji');
                    glyph.setAttribute('aria-hidden', 'true');
                    td.appendChild(glyph);
                    td.appendChild(el('span', word, 'hwprobe-sr'));
                    return td;
                }

                function flagMark(on) {
                    return spokenMark(on ? 'TurnOn' : 'LeaveOff', on ? 'On' : 'Off');
                }

                // Material icons, which jellyfin-web loads; the name is the icon.
                function icon(name) {
                    const span = el('span', null, 'material-icons ' + name);
                    span.setAttribute('aria-hidden', 'true');
                    return span;
                }

                function mark(state) {
                    const td = el('td', null, 'hwprobe-mark');
                    const glyph = el('span', state === 'LeaveOff' ? '\u274c' : state === 'TurnOn' || state === 'Optional' ? '\u2705' : '\u2754', 'hwprobe-emoji');
                    glyph.setAttribute('aria-hidden', 'true');
                    td.appendChild(glyph);
                    return td;
                }

                function outcomeRow(table, label, outcome) {
                    const state = outcome === 'Pass' ? 'TurnOn' : (outcome ? 'LeaveOff' : 'NotTested');
                    const reason = outcome === 'Pass' ? '' : outcomeNotes[outcome || 'Untested'];
                    row(table, [mark(state), label, el('td', reason, 'secondaryText'), el('td')]);
                }

                function firstOutcome(cells) {
                    const values = Object.values(cells || {});
                    return values.indexOf('Pass') !== -1 ? 'Pass' : values[0];
                }

                // Built from markup so jellyfin-web's element polyfill upgrades it (registerElement keys on the is attribute).
                function jf(html) {
                    const template = document.createElement('template');
                    template.innerHTML = html;
                    return template.content.firstElementChild;
                }

                // A theme button: flat by default, 'raised button-submit' for the main action, 'raised button-delete' for a risky one.
                function action(text, onClick, kind) {
                    const button = jf('<button is="emby-button" type="button" class="emby-button hwprobe-inline ' + (kind || 'button-flat') + '"><span></span></button>');
                    button.firstElementChild.textContent = text;
                    button.addEventListener('click', () => {
                        button.disabled = true;
                        onClick();
                    });
                    return button;
                }

                function idleAction(text, onClick, kind) {
                    const button = action(text, onClick, kind);
                    button.disabled = running;
                    idleButtons.push(button);
                    return button;
                }

                // A theme icon button, such as the trash can on a row; disabled while a probe or test runs, as the server refuses then.
                function iconAction(name, label, onClick) {
                    const button = jf('<button is="paper-icon-button-light" type="button" class="paper-icon-button-light hwprobe-danger"></button>');
                    button.appendChild(icon(name));
                    button.title = label;
                    button.setAttribute('aria-label', label);
                    button.addEventListener('click', () => {
                        button.disabled = true;
                        onClick();
                    });
                    button.disabled = running;
                    idleButtons.push(button);
                    return button;
                }

                // Can't be undone, so the first press only asks; a click anywhere else takes the question back.
                function confirmAction(text, question, onConfirm, kind) {
                    let sure = false;
                    const button = idleAction(text, () => {
                        if (sure) {
                            onConfirm();
                            return;
                        }
                        sure = true;
                        button.firstElementChild.textContent = question;
                        button.disabled = false;
                        const elsewhere = e => {
                            document.removeEventListener('click', elsewhere, true);
                            if (!button.contains(e.target)) {
                                sure = false;
                                button.firstElementChild.textContent = text;
                            }
                        };
                        document.addEventListener('click', elsewhere, true);
                    }, kind);
                    return button;
                }

                function setRunning(on) {
                    running = on;
                    // Pruned here, not as buttons are made: a table's buttons aren't on the page until the whole table is.
                    idleButtons = idleButtons.filter(b => b.isConnected || b === runButton);
                    // A button for something this server can't do stays off when the run ends.
                    for (const b of idleButtons) {
                        b.disabled = on || b.dataset.unavailable === 'true';
                    }
                }

                // The server's current value for a setting key, or undefined when unknown.
                function current(setting) {
                    if (setting.indexOf('Trickplay:') === 0) {
                        return trickplay ? trickplay[setting.substring('Trickplay:'.length)] : undefined;
                    }
                    if (!encoding) {
                        return undefined;
                    }
                    if (setting === 'DeinterlaceMethod:bwdif') {
                        return encoding.DeinterlaceMethod === 'bwdif';
                    }
                    const prefix = 'HardwareDecodingCodecs:';
                    if (setting.indexOf(prefix) === 0) {
                        return (encoding.HardwareDecodingCodecs || []).indexOf(setting.substring(prefix.length)) !== -1;
                    }
                    return encoding[setting];
                }

                function differs(advice) {
                    const value = current(advice.setting);
                    return advice.state !== 'NotTested' && typeof value === 'boolean' && value !== (advice.state === 'TurnOn' || advice.state === 'Optional');
                }

                function isConfigured(backend) {
                    if (!encoding || encoding.HardwareAccelerationType !== backend.type) {
                        return false;
                    }
                    const device = backend.type === 'vaapi' ? encoding.VaapiDevice : (backend.type === 'qsv' ? encoding.QsvDevice : '');
                    return !device || device === backend.device;
                }

                function post(path, body, keepView) {
                    setMessage('');
                    const request = { type: 'POST', url: ApiClient.getUrl(path), dataType: 'json' };
                    if (body) {
                        request.data = JSON.stringify(body);
                        request.contentType = 'application/json';
                    }
                    return ApiClient.ajax(request).then(result => {
                        setMessage(result.Reason || '');
                    }, response => (response && response.json ? response.json() : Promise.resolve({})).then(
                        result => { setMessage((result && result.Reason) || 'The change was refused.'); },
                        () => { setMessage('The change was refused.'); })).then(() => loadReport(keepView));
                }

                function apply(advice) {
                    return post('HwProbe/Apply', advice.map(a => ({ Setting: a.setting, Value: a.state === 'TurnOn' || a.state === 'Optional' })));
                }

                // The old server can still answer for a moment after the restart request, so wait until the
                // plugin reports no pending restart, which only a new server does.
                function waitForServer(deadline) {
                    const retry = () => {
                        if (Date.now() > deadline) {
                            setMessage('Jellyfin didn\'t come back. Reload the page.');
                            return;
                        }
                        setTimeout(() => waitForServer(deadline), 2000);
                    };
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(pending => {
                            if (pending === true) {
                                retry();
                                return;
                            }
                            setMessage('');
                            loadStatus();
                        }, retry);
                }

                function restart() {
                    setMessage('Restarting…');
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('System/Restart') })
                        .then(() => waitForServer(Date.now() + 180000), () => { setMessage('Restart failed.'); });
                }

                // Whether the last change's list is open, kept across re-renders of the same entry.
                let changeOpen = false;
                let changeShown = null;

                function renderChange() {
                    changeText.replaceChildren();
                    const last = history.filter(e => e.Kind !== 'Revert' && !e.RevertedUtc).pop();
                    if (!last) {
                        return;
                    }
                    if (changeShown !== last.TimeUtc) {
                        changeOpen = false;
                        changeShown = last.TimeUtc;
                    }

                    // Revert leaves a setting that was changed again since; the server skips it too. An unknown current
                    // value (settings failed to load) is shown as such rather than guessed.
                    const rows = last.Changes.map(c => {
                        const now = currentText(c.Setting);
                        return { change: c, unknown: now === undefined, kept: now !== undefined && now !== c.NewValue };
                    });
                    const nothing = rows.every(r => r.kept);

                    // A disclosure button beside Revert rather than a summary around it: buttons can't nest, and a
                    // details element would widen with its table and push Revert along.
                    const line = el('div', null, 'hwprobe-change');
                    const toggle = el('button', null, 'hwprobe-disclosure');
                    toggle.type = 'button';
                    toggle.setAttribute('aria-controls', 'hwprobeChangeList');
                    const arrow = icon('chevron_right');
                    toggle.appendChild(arrow);
                    toggle.appendChild(document.createTextNode('Last change: ' + new Date(last.TimeUtc).toLocaleString()));
                    line.appendChild(toggle);
                    // With every setting changed since, Revert would change nothing; it only clears the entry.
                    line.appendChild(idleAction(nothing ? 'Dismiss' : 'Revert', () => post('HwProbe/Revert'), 'raised'));
                    changeText.appendChild(line);

                    const list = el('div', null, 'hwprobe-change-list');
                    list.id = 'hwprobeChangeList';
                    if (nothing) {
                        list.appendChild(el('div', 'Every setting was changed since; nothing to revert.', 'secondaryText'));
                    }
                    const table = el('table', null, 'hwprobe-full');
                    for (const r of rows) {
                        const c = r.change;
                        // The server labels every setting it knows; the key is a last resort.
                        const label = c.Label || c.Setting;
                        if (r.kept) {
                            row(table, [spokenMark('NotTested', 'Skipped'), label, el('td', 'Changed since, left as is', 'secondaryText')]);
                            continue;
                        }
                        const flag = c.OldValue === 'true' || c.OldValue === 'false';
                        const value = flag ? el('td') : el('td', valueText(c.Setting, c.OldValue));
                        if (r.unknown) {
                            value.appendChild(el('span', (flag ? '' : ' ') + '(current value unknown)', 'secondaryText'));
                        }
                        row(table, [flag ? flagMark(c.OldValue === 'true') : el('td'), label, value]);
                    }
                    list.appendChild(table);
                    changeText.appendChild(list);

                    function show() {
                        list.style.display = changeOpen ? '' : 'none';
                        arrow.style.transform = changeOpen ? 'rotate(90deg)' : '';
                        toggle.setAttribute('aria-expanded', String(changeOpen));
                    }
                    toggle.addEventListener('click', () => {
                        changeOpen = !changeOpen;
                        show();
                    });
                    show();
                }

                // The current value in the form history entries store it, or undefined when unknown.
                function currentText(setting) {
                    if (setting === 'HardwareAccelerationType' || setting === 'VaapiDevice' || setting === 'QsvDevice') {
                        return encoding ? String(encoding[setting] || '') : undefined;
                    }
                    const value = current(setting);
                    return typeof value === 'boolean' ? String(value) : undefined;
                }

                function valueText(setting, value) {
                    if (value === 'true' || value === 'false') {
                        return value === 'true' ? 'On' : 'Off';
                    }
                    if (setting === 'HardwareAccelerationType') {
                        return value === 'none' ? 'None' : (names[value] || value);
                    }
                    return value || 'Not set';
                }

                function restartPrompt() {
                    const pending = el('p', 'Backend changed; Jellyfin requires a restart. ');
                    const button = idleAction('Restart Jellyfin', restart, 'raised button-delete');
                    pending.appendChild(button);
                    return pending;
                }

                // A backend that failed every test still gets used for every transcode until it's changed.
                function renderBrokenBackend(container, viable) {
                    const type = encoding && encoding.HardwareAccelerationType;
                    // Untested isn't a failure, so it gets no warning.
                    if (!type || type === 'none' || viable.some(isConfigured)
                        || report.backends.some(b => b.verdict === 'Untested' && isConfigured(b))) {
                        return;
                    }
                    const warning = el('div', null, 'infoBanner hwprobe-warning');
                    warning.textContent = 'Unsuccessful in last probe; transcodes may fail.';
                    container.appendChild(warning);
                    const line = el('div', null, 'hwprobe-row hwprobe-end');
                    line.appendChild(idleAction('Switch to None', () => post('HwProbe/UseBackend', { Type: 'none', Device: '' }), 'raised'));
                    container.appendChild(line);
                }

                // Jellyfin's Intel guide prefers QSV to VA-API on GPUs QSV supports, so a working QSV on the configured VAAPI device is offered.
                function renderPreferredBackend(container, viable) {
                    const type = encoding && encoding.HardwareAccelerationType;
                    const qsv = type === 'vaapi' && viable.some(isConfigured) ? viable.find(b => b.type === 'qsv' && (!b.device || !encoding.VaapiDevice || b.device === encoding.VaapiDevice)) : null;
                    if (!qsv) {
                        return;
                    }
                    container.appendChild(el('div', names.qsv + ' also works on this GPU. Jellyfin prefers it to VA-API on mainstream Intel GPUs, for better performance.', 'infoBanner'));
                    const line = el('div', null, 'hwprobe-row hwprobe-end');
                    line.appendChild(idleAction('Use ' + names.qsv, () => post('HwProbe/UseBackend', { Type: 'qsv', Device: qsv.device }), 'raised'));
                    container.appendChild(line);
                }

                function renderSettings(container, choices, title) {
                    container.replaceChildren();
                    title.textContent = 'Settings';
                    if (choices.length > 1) {
                        const pick = themedSelect(container, 'Backend');
                        choices.forEach((b, i) => {
                            const option = el('option', (names[b.type] || b.type) + (choices.filter(o => o.type === b.type).length > 1 ? ' ' + b.device : ''));
                            option.value = String(i);
                            option.selected = b === selected;
                            pick.appendChild(option);
                        });
                        pick.addEventListener('change', () => { selected = choices[Number(pick.value)]; renderSettings(container, choices, title); });
                    } else {
                        title.textContent = 'Settings for ' + (names[selected.type] || selected.type);
                    }

                    const configured = isConfigured(selected);
                    if (!configured) {
                        const line = el('div', null, 'hwprobe-row hwprobe-start');
                        line.appendChild(el('span', 'Not the configured backend', 'secondaryText'));
                        line.appendChild(idleAction('Use this backend', () => post('HwProbe/UseBackend', { Type: selected.type, Device: selected.device })));
                        container.appendChild(line);
                    }

                    const settings = selected.settings || [];
                    const table = el('table', null, 'hwprobe-full');
                    const everything = configured ? settings.filter(differs) : [];
                    const header = el('th');
                    if (everything.length > 1) {
                        header.appendChild(idleAction('Apply all', () => apply(everything), 'raised'));
                    }
                    row(table, [el('th'), el('th', 'Setting'), el('th', 'Result'), header]);
                    let group = null;
                    for (const a of settings.filter(x => !x.hidden || differs(x))) {
                        if (a.section !== group) {
                            group = a.section;
                            const pending = configured ? settings.filter(x => x.section === group && differs(x)) : [];
                            const cell = el('td');
                            if (pending.length > 1) {
                                cell.appendChild(idleAction('Apply section', () => apply(pending), 'raised'));
                            }
                            row(table, [el('td'), el('td', group), el('td'), cell]).className = 'hwprobe-group';
                        }
                        const cell = el('td');
                        if (configured && differs(a)) {
                            cell.appendChild(idleAction('Apply', () => apply([a]), 'raised'));
                        }
                        row(table, [mark(a.state), a.label, resultCell(a.note, a.fix, 'secondaryText'), cell]);
                    }
                    if (selected.type !== 'none') {
                        groupRow(table, 'Also tested');
                        outcomeRow(table, 'Hardware deinterlacing', firstOutcome(selected.deinterlace));
                        outcomeRow(table, 'Subtitle burn‑in', firstOutcome(selected.subtitles));
                    }
                    container.appendChild(sortable(table, 'settings'));
                }

                function renderDetails(r) {
                    const details = fold(results, 'Detailed results');

                    const table = el('table', null, 'hwprobe-full');
                    row(table, [el('th', 'Backend'), el('th', 'Device'), el('th', 'Column'), el('th', 'Test'), el('th', 'Result'), el('th', 'Duration', 'hwprobe-num')]);
                    for (const b of r.backends.concat(r.software ? [r.software] : [])) {
                        for (const column of columns) {
                            for (const [key, outcome] of Object.entries(b[column] || {})) {
                                const result = el('td');
                                result.dataset.sort = outcome;
                                const glyph = el('span', { Pass: '\u2705 ', NotUsed: '\u2796 ', Untested: '\u2754 ', Skipped: '\u2754 ', SoftwareFallback: '\u26a0\ufe0f ' }[outcome] || '\u274c ', 'hwprobe-emoji');
                                glyph.setAttribute('aria-hidden', 'true');
                                result.appendChild(glyph);
                                result.appendChild(document.createTextNode(outcome));
                                // A test with no time launched nothing; a report from before times were recorded has none at all.
                                const seconds = b.seconds ? b.seconds[column + ':' + key] || 0 : undefined;
                                const time = el('td', seconds === undefined ? '-' : seconds.toFixed(1) + ' s', 'hwprobe-num');
                                time.dataset.sort = seconds === undefined ? '' : String(seconds);
                                row(table, [b.type, b.device || '-', column, key, result, time]);
                            }
                        }
                    }
                    sortable(table, 'details');
                    // Six columns of ids and outcomes don't fit a phone, and breaking them mid-word reads worse than scrolling.
                    const scroll = el('div', null, 'hwprobe-scroll');
                    scroll.appendChild(table);
                    details.appendChild(scroll);
                    if (r.seconds) {
                        const minutes = Math.floor(r.seconds / 60);
                        details.appendChild(el('div', 'Total duration: ' + (minutes ? minutes + ' min ' + Math.round(r.seconds % 60) + ' s' : r.seconds.toFixed(1) + ' s'), 'secondaryText'));
                    }
                }

                function renderNotes() {
                    // Low-power findings are already in the settings list.
                    const grouped = {};
                    for (const f of report.findings.filter(x => x.code.indexOf('lowpower') === -1)) {
                        // Reports from before findings named their backend start the message with it.
                        const backend = f.backend || f.message.split(' ')[0].replace(':', '');
                        (grouped[f.code] = grouped[f.code] || { finding: f, backends: [] }).backends.push(names[backend] || backend);
                    }
                    const codes = Object.keys(grouped);
                    if (!codes.length) {
                        return;
                    }
                    const table = el('table', null, 'hwprobe-full');
                    row(table, [el('th', 'Note'), el('th', 'Backends')]);
                    for (const code of codes) {
                        const g = grouped[code];
                        row(table, [resultCell(notes[code] || g.finding.message, g.finding.fix, ''), g.backends.join(', ')]);
                    }
                    fold(results, 'Notes (' + codes.length + ')').appendChild(sortable(table, 'notes'));
                }

                // The configured backend, its result, the run state, and anything that needs doing now.
                // The Hardware Probe card: run the probe and see its state.
                function renderCard() {
                    // A running probe shows the same loading bar as a performance test, kept across polls so it isn't rebuilt.
                    probeBar.update(probeBarState(probeProgress || {}));
                    const shown = probeProgress ? probeBar : statusText;
                    if (card.firstElementChild && card.firstElementChild.firstElementChild === shown) {
                        return;
                    }
                    card.replaceChildren();
                    const top = el('div', null, 'hwprobe-row');
                    top.appendChild(shown);
                    top.appendChild(runButton);
                    card.appendChild(top);
                }

                // What Jellyfin uses now, and whether it works; then a failed backend's way out, a pending restart and the last change.
                function renderBackendStatus(container, viable) {
                    const box = el('div', null, 'paperList hwprobe-card');
                    const type = encoding && encoding.HardwareAccelerationType;
                    // While a probe runs, the last report's verdicts aren't shown.
                    const shown = probeProgress ? null : report;
                    const title = el('div');
                    if (!encoding) {
                        title.textContent = 'Hardware acceleration: unknown (Jellyfin\u2019s settings didn\u2019t load)';
                    } else if (!type || type === 'none') {
                        title.textContent = 'Hardware acceleration: None';
                    } else {
                        const entry = shown && shown.backends.find(isConfigured);
                        const device = type === 'vaapi' ? encoding.VaapiDevice : (type === 'qsv' ? encoding.QsvDevice : '');
                        const backend = (names[type] || type) + (device ? ' ' + device : '');
                        title.appendChild(document.createTextNode('Hardware acceleration: '));
                        if (entry) {
                            title.appendChild(el('span', entry.verdict === 'Viable' ? '\u2705 ' : '\u274c ', 'hwprobe-emoji'));
                        }
                        title.appendChild(document.createTextNode(backend));
                        if (entry && entry.verdict === 'Viable') {
                            title.appendChild(el('span', ' - ' + (tiers[entry.tier] || ''), 'secondaryText'));
                        } else if (entry) {
                            title.appendChild(document.createTextNode(' - ' + (verdicts[entry.verdict] || entry.verdict)));
                        } else if (shown) {
                            title.appendChild(el('span', ' - not tested', 'secondaryText'));
                        }
                    }
                    box.appendChild(title);
                    if (shown) {
                        renderBrokenBackend(box, viable);
                        renderPreferredBackend(box, viable);
                    }
                    if (restartRequired) {
                        box.appendChild(restartPrompt());
                    }
                    box.appendChild(changeText);
                    container.appendChild(box);
                }

                function render() {
                    closeMenu();
                    for (const tab of [results, settingsTab, speedTab, resultsTab, helpTab]) {
                        tab.replaceChildren();
                    }
                    // While a probe runs, the page shows no results, as before the first run.
                    const viable = report && !probeProgress ? report.backends.filter(b => b.verdict === 'Viable').sort(byDropdown) : [];
                    renderCard();
                    renderBackendStatus(settingsTab, viable);
                    speedViable = viable;
                    renderResultsTab(resultsTab);
                    renderHelp(helpTab);
                    if (!report || probeProgress) {
                        if (!probeProgress) {
                            results.appendChild(el('p', 'No results yet. Run a probe while nothing is being transcoded; the first run takes a few minutes.', 'secondaryText'));
                        }
                        settingsTab.appendChild(el('div', 'Recommended settings require first running a hardware probe.', 'infoBanner'));
                        speedTab.appendChild(el('div', 'Performance testing requires first running a hardware probe.', 'infoBanner'));
                        return;
                    }

                    const unavailable = report.backends.filter(b => b.verdict !== 'Viable')
                        .map(b => b.verdict === 'NotPresent' && wrongArchitecture(b.type)
                            ? [b.type, '', wrongArchitecture(b.type)]
                            : [b.type, b.verdict === 'NotPresent' ? '' : b.device, verdicts[b.verdict] || b.verdict, b.fix, b.verdict === 'PermissionDenied' || b.verdict === 'DevicePresentPipelineBroken' ? 'failed' : 'absent'])
                        .concat(Object.entries(report.stageA.types || {}).filter(([, s]) => s === 'NotBuilt').map(([t]) => [t, '', notBuilt(t)]))
                        // A NotPresent row per adapter would repeat the same line.
                        .filter((r, i, all) => all.findIndex(o => o[0] === r[0] && o[1] === r[1] && o[2] === r[2]) === i)
                        .sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
                    fold(results, 'Hardware acceleration backends', true).appendChild(backendTable(viable.map(b => [b.type, b.device, tiers[b.tier] || 'Works', null, 'works']).concat(unavailable)));
                    renderNotes();
                    renderDetails(report);

                    // Software first, as in Jellyfin's dropdown; a report from before software was tested has none.
                    const choices = (report.software ? [report.software] : []).concat(viable);
                    if (choices.length) {
                        if (!selected || choices.indexOf(selected) === -1) {
                            selected = choices.find(isConfigured) || viable[0] || choices[0];
                        }
                        const container = fold(settingsTab, 'Settings', true, null, 'recommended');
                        const title = container.firstElementChild.lastElementChild;
                        const body = el('div');
                        container.appendChild(body);
                        renderSettings(body, choices, title);
                    } else {
                        settingsTab.appendChild(el('p', 'No backend works on this server, so there are no hardware settings to advise.', 'secondaryText'));
                    }
                    renderSpeedSetup(speedTab, viable);
                }

                // Outputs made from audio inputs rather than videos.
                function audioOutput(o) {
                    return o.Kind === 'Audio' || o.Kind === 'AudioDecode';
                }

                // Video outputs chosen on their own rather than as a codec at a quality: decoding alone.
                function standalone(o) {
                    return o.DecodeOnly && !audioOutput(o);
                }

                function selectedAudioOutputs() {
                    return speedOutputs.filter(o => audioOutput(o) && chosenAudioOutputs.has(o.Key));
                }

                // In codec then quality order, so a video's rows read H.264 8 Mbps, H.264 4 Mbps, HEVC 8 Mbps, then the standalone outputs.
                function selectedOutputs() {
                    const keys = speedCodecs.filter(c => chosenCodecs.has(c.Key)).flatMap(c => speedQualities.filter(q => chosenQualities.has(q.Key)).map(q => c.Key + '-' + q.Key));
                    keys.push(...speedOutputs.filter(o => standalone(o) && chosenCodecs.has(o.Key)).map(o => o.Key));
                    return keys.map(k => speedOutputs.find(o => o.Key === k)).filter(o => o);
                }

                // The chosen backends, each viable one at most once per type as the server measures them, then software.
                function speedBackends(viable) {
                    return viable.filter(b => chosenBackends.has(b.type)).length + (chosenBackends.has('none') ? 1 : 0);
                }

                function speedRuns(viable) {
                    return speedBackends(viable) * allVideos().filter(v => chosenVideos.has(v.Key)).length * selectedOutputs().length;
                }

                function sizeText(bytes, decimals) {
                    const units = ['bytes', 'KB', 'MB', 'GB'];
                    let i = 0;
                    while (bytes >= 1000 && i < units.length - 1) {
                        bytes /= 1000;
                        i++;
                    }
                    return (i === 0 ? bytes : bytes.toFixed(decimals === undefined ? bytes < 10 ? 1 : 0 : decimals)) + ' ' + units[i];
                }

                // Samples and downloads show as one group; the server lists the two folders next to each other.
                function cacheFolderName(folder) {
                    if (folder === 'samples' || folder === 'downloads') {
                        return 'Downloads';
                    }
                    return 'Generated by ffmpeg build ' + folder.replace(/^sha256_/, '').slice(0, 8);
                }

                // The cache's last contents, drawn at once on a page redraw so the section doesn't empty and refill.
                let cacheShown = null;
                // The third-party libraries, loaded once: they don't change while the page is open.
                let libraryList = null;

                // Clips and samples are kept so later runs don't make or download them again.
                function renderCache() {
                    const div = el('div');
                    let drawn = null;
                    const draw = ([entries, data]) => {
                        const json = JSON.stringify([entries, data]);
                        if (json === drawn) {
                            return;
                        }
                        drawn = json;
                        cacheShown = [entries, data];
                        div.replaceChildren();
                        const bytes = entries.reduce((sum, e) => sum + e.Bytes, 0);
                        const line = el('div', null, 'hwprobe-row');
                        line.appendChild(el('span', sizeText(bytes) + ' in ' + entries.length + ' file' + (entries.length === 1 ? '' : 's'), 'secondaryText'));
                        div.appendChild(line);
                        const buttons = el('div', null, 'hwprobe-row hwprobe-end');
                        line.appendChild(buttons);
                        if (entries.length) {
                            buttons.appendChild(confirmAction('Delete clips', 'Delete all ' + entries.length + ' files', () => {
                                ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl('HwProbe/Cache') })
                                    .then(refresh, () => { setMessage('Could not delete: a probe or performance test is using the cache.'); redraw(); });
                            }, 'raised button-delete'));
                        }
                        // Reports, performance test results, and the settings history go too, so everything reloads.
                        buttons.appendChild(confirmAction('Delete all data', 'Delete all reports, results, history, and cache', () => {
                            ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl('HwProbe/Data') })
                                .then(() => loadStatus(), () => { setMessage('Could not delete: a probe, performance test, or settings change is running.'); loadStatus(); });
                        }, 'raised button-delete'));
                        // Measurements are kept apart from the clips, so a suite can measure again without making or downloading them again.
                        // Deleting runs reloads the page's data, as Test Results shows them; the rest redraws this section alone.
                        const summaries = data ? [['Test Results', data.History, 'run', 'HwProbe/SpeedHistory', loadReport], ['Measurements', data.Measurements, 'measurement', 'HwProbe/SpeedResults', refresh]].filter(([, x]) => x.Files) : [];
                        if (!entries.length && !summaries.length) {
                            return;
                        }
                        const table = el('table', null, 'hwprobe-full');
                        row(table, [el('th', 'Contents'), el('th', 'File'), el('th', 'Size', 'hwprobe-num'), el('th', 'Written', 'hwprobe-num'), el('th')]);
                        // Saved runs and measurements, one row each under their own group, ahead of the clips.
                        if (summaries.length) {
                            const name = el('td', 'History');
                            name.colSpan = 5;
                            const tr = el('tr', null, 'hwprobe-group');
                            tr.appendChild(name);
                            table.appendChild(tr);
                        }
                        for (const [name, x, unit, url, after] of summaries) {
                            const size = el('td', sizeText(x.Bytes), 'hwprobe-num');
                            size.dataset.sort = String(x.Bytes);
                            const written = el('td', new Date(x.ModifiedUtc).toLocaleString(), 'secondaryText hwprobe-num');
                            written.dataset.sort = String(Date.parse(x.ModifiedUtc));
                            const remove = el('td', null, 'hwprobe-end-cell');
                            remove.appendChild(iconAction('delete', 'Delete', () => {
                                ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl(url) })
                                    .then(after, () => { setMessage('Could not delete: a probe or performance test is running.'); redraw(); });
                            }));
                            row(table, [el('td', name), el('td', x.Files + ' ' + unit + (x.Files === 1 ? '' : 's'), 'secondaryText hwprobe-small'), size, written, remove]);
                        }
                        let folder = null;
                        for (const e of entries) {
                            if (cacheFolderName(e.Folder) !== folder) {
                                folder = cacheFolderName(e.Folder);
                                const name = el('td', folder);
                                name.colSpan = 5;
                                const tr = el('tr', null, 'hwprobe-group');
                                tr.appendChild(name);
                                table.appendChild(tr);
                            }
                            const size = el('td', sizeText(e.Bytes), 'hwprobe-num');
                            size.dataset.sort = String(e.Bytes);
                            const written = el('td', new Date(e.ModifiedUtc).toLocaleString(), 'secondaryText hwprobe-num');
                            written.dataset.sort = String(Date.parse(e.ModifiedUtc));
                            // Downloads are named by SHA-256; the first 12 characters tell them apart, and the whole name is in the tooltip.
                            const file = el('td', e.File.replace(/^([0-9a-f]{12})[0-9a-f]{52}/, '$1\u2026'), 'secondaryText hwprobe-small hwprobe-file');
                            file.title = e.File;
                            file.dataset.sort = e.File;
                            const remove = el('td', null, 'hwprobe-end-cell');
                            remove.appendChild(iconAction('delete', 'Delete', () => {
                                ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl('HwProbe/Cache/File', { folder: e.Folder, file: e.File }) })
                                    .then(refresh, () => { setMessage('Could not delete: a probe or performance test is using the cache.'); redraw(); });
                            }));
                            row(table, [el('td', e.Description || 'Not used by this version', e.Description ? '' : 'secondaryText'), file, size, written, remove]);
                        }
                        const scroll = el('div', null, 'hwprobe-scroll');
                        scroll.appendChild(sortable(table, 'cache'));
                        div.appendChild(scroll);
                    };
                    const refresh = () => {
                        const contents = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Cache/Contents'), dataType: 'json' });
                        const saved = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SavedData'), dataType: 'json' }).then(d => d, () => null);
                        return Promise.all([contents, saved]).then(draw, () => {});
                    };
                    // After a refused delete the contents are unchanged, but the disabled buttons are drawn again.
                    const redraw = () => {
                        drawn = null;
                        return refresh();
                    };
                    if (cacheShown) {
                        draw(cacheShown);
                    }
                    refresh();
                    return div;
                }

                function allVideos() {
                    return libraryVideo ? speedVideos.concat([libraryVideo]) : speedVideos;
                }

                // The results area stays in place while a run polls, so the setup below isn't redrawn under the cursor.
                const speedResults = el('div');

                function chooseSpeedDefaults() {
                    if (!chosenVideos) {
                        chosenVideos = new Set(speedVideos.filter(v => v.Default).map(v => v.Key));
                        chosenAudios = new Set();
                        chosenAudioOutputs = new Set();
                        const defaults = speedOutputs.filter(o => o.Default).map(o => o.Key);
                        chosenCodecs = new Set(speedCodecs.filter(c => defaults.some(k => k.startsWith(c.Key + '-'))).map(c => c.Key).concat(defaults.filter(k => speedOutputs.some(o => o.Key === k && standalone(o)))));
                        chosenQualities = new Set(speedQualities.filter(q => defaults.some(k => k.endsWith('-' + q.Key))).map(q => q.Key));
                    }
                }

                // The Run select on Test Results and the box holding it with its Delete buttons, or null when there are no saved runs.
                let runPicker = null;
                let runControls = null;

                // Past runs can't be viewed or deleted while one runs, so their controls go away until it ends.
                // The box is hidden by its style: the buttons' row sets display, which the hidden attribute can't override.
                function syncRunPicker() {
                    if (!runControls) {
                        return;
                    }
                    runControls.style.display = speedProgress ? 'none' : '';
                    if (!speedProgress) {
                        runPicker.value = speedViewing || speedHistory[0].Id;
                    }
                }

                function renderResultsTab(container) {
                    runPicker = null;
                    runControls = null;
                    if (speedHistory.length) {
                        runControls = container.appendChild(el('div'));
                        const runs = themedSelect(runControls, 'Run');
                        runPicker = runs;
                        for (const h of speedHistory) {
                            const option = el('option', new Date(h.GeneratedUtc).toLocaleString() + (h.Suite ? ' \u00b7 ' + h.Suite + ': ' + h.SuiteStep : '') + ' \u00b7 ' + methodName(h.Method) + ' \u00b7 ' + h.Tests + ' test' + (h.Tests === 1 ? '' : 's') + (h.Current ? '' : ' (another version or ffmpeg)'));
                            option.value = h.Id;
                            option.selected = speedViewing ? h.Id === speedViewing : h === speedHistory[0];
                            runs.appendChild(option);
                        }
                        // The run and its suggestions load together, so the page redraws once rather than shifting when the suggestions arrive.
                        runs.addEventListener('change', () => {
                            const id = runs.value;
                            const run = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedHistory/' + id), dataType: 'json' });
                            const suggestions = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedSuggestions', { id }), dataType: 'json' }).then(list => list, () => null);
                            Promise.all([run, suggestions]).then(([r, list]) => {
                                // A later choice made while this one loaded wins.
                                if (runs.value !== id) {
                                    return;
                                }
                                if (list) {
                                    suggestionCache.set(id, { json: JSON.stringify(list), list });
                                }
                                speedReport = r;
                                speedViewing = id;
                                renderSpeedResults();
                            });
                        });
                        const remove = url => ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl(url) })
                            .then(loadReport, () => { setMessage('Could not delete: a probe or performance test is running.'); loadReport(); });
                        const actions = runControls.appendChild(el('div', null, 'hwprobe-row hwprobe-end'));
                        actions.appendChild(idleAction('Delete', () => remove('HwProbe/SpeedHistory/' + runs.value), 'raised hwprobe-danger'));
                        if (speedHistory.length > 1) {
                            actions.appendChild(confirmAction('Delete all', 'Delete all ' + speedHistory.length + ' runs', () => remove('HwProbe/SpeedHistory'), 'raised button-delete'));
                        }
                    }
                    container.appendChild(speedResults);
                    renderSpeedResults();
                }

                // The third-party libraries the plugin ships, with their licences.
                function renderLibraries() {
                    const div = el('div');
                    const draw = libraries => {
                        libraryList = libraries;
                        const table = el('table', null, 'hwprobe-full');
                        row(table, [el('th', 'Library'), el('th', 'Version'), el('th', 'Licence')]);
                        for (const library of libraries) {
                            const name = el('td');
                            name.appendChild(externalLink(library.Name, library.Url));
                            const license = el('td');
                            license.appendChild(externalLink(library.License, library.LicenseUrl));
                            row(table, [name, el('td', library.Version, 'secondaryText'), license]);
                        }
                        div.appendChild(sortable(table, 'libraries'));
