                        const actions = el('div', null, 'hwprobe-row hwprobe-end');
                        container.appendChild(actions);
                        actions.appendChild(idleAction('Delete', () => remove('HwProbe/SpeedHistory/' + runs.value), 'raised hwprobe-danger'));
                        if (speedHistory.length > 1) {
                            actions.appendChild(confirmAction('Delete all', 'Delete all ' + speedHistory.length + ' runs', () => remove('HwProbe/SpeedHistory'), 'raised button-delete'));
                        }
                    }
                    container.appendChild(speedResults);
                    renderSpeedResults();
                }

                function renderHelp(container) {
                    fold(container, 'Diagnostics', true).appendChild(renderReporting());
                    fold(container, 'Cache').appendChild(renderCache());
                }

                // What the results area last drew, so a poll that changes only the time left doesn't redraw it under the cursor.
                let speedDrawn = null;
                let speedProgressParts = null;

                // A poll redraws only the progress text and bar unless the results or the run's phase changed.
                function renderSpeedResults(poll) {
                    syncRunPicker();
                    const drawn = JSON.stringify([speedLive && speedLive.results, speedReport && speedReport.generatedUtc, speedProgress && speedProgress.Phase, speedProgress && speedProgress.Done]);
                    if (poll === true && drawn === speedDrawn && speedProgress && speedProgressParts) {
                        speedProgressParts.text.textContent = speedProgressText(speedProgress);
                        return;
                    }
                    speedDrawn = drawn;
                    speedProgressParts = null;
                    speedResults.replaceChildren();
                    if (speedProgress) {
                        const box = el('div', null, 'paperList hwprobe-card hwprobe-progress-card');
                        const line = el('div', null, 'hwprobe-row');
                        const text = el('span', speedProgressText(speedProgress), 'secondaryText');
                        line.appendChild(text);
                        const buttons = el('div', null, 'hwprobe-row hwprobe-end');
                        const cancel = action('Cancel', () => {
                            cancel.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('HwProbe/Speed/Cancel') }).then(loadStatus, loadStatus);
                        }, 'raised button-delete');
                        const cancelling = speedProgress.Phase === 'Cancelling';
                        cancel.disabled = cancelling;
                        const paused = speedProgress.Phase === 'Paused' || speedProgress.Phase === 'Pausing';
                        const pause = action(paused ? 'Resume' : 'Pause', () => {
                            pause.disabled = true;
                            ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl(paused ? 'HwProbe/Speed/Resume' : 'HwProbe/Speed/Pause') }).then(loadStatus, loadStatus);
                        }, 'raised');
                        pause.disabled = cancelling;
                        buttons.appendChild(pause);
                        buttons.appendChild(cancel);
                        line.appendChild(buttons);
                        box.appendChild(line);
                        const bar = jf('<div class="itemProgressBar hwprobe-progress hwprobe-progress-wide"><div class="itemProgressBarForeground"></div></div>');
                        bar.firstElementChild.style.width = (speedProgress.Total ? Math.round(100 * (speedProgress.Done || 0) / speedProgress.Total) : 0) + '%';
                        box.appendChild(bar);
                        speedResults.appendChild(box);
                        speedProgressParts = { text };
                    }
                    const shown = speedLive || speedReport;
                    if (shown && shown.results.length) {
                        speedResults.appendChild(speedMatrix(shown));
                    } else if (!speedProgress) {
                        speedResults.appendChild(el('p', 'No performance tests yet.', 'secondaryText'));
                    }
                    if (shown && !speedProgress) {
                        speedResults.appendChild(renderSuggestions());
                    }
                }

                // A catalog option's value as its field shows it.
                function optionValueText(key, value) {
                    const option = runOptions.find(o => o.Key === key);
                    const choice = option && option.Choices ? option.Choices.find(c => c.Key === value) : null;
                    return choice ? choice.Label : value === 'true' ? 'On' : value === 'false' ? 'Off' : value;
                }

                function renderSuggestions() {
                    const div = el('div');
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedSuggestions', speedViewing ? { id: speedViewing } : {}), dataType: 'json' }).then(list => {
                        if (!list.length) {
                            return;
                        }
                        heading(div, 'Suggestions');
                        const table = el('table');
                        const configured = encoding && encoding.HardwareAccelerationType;
                        for (const s of list) {
                            const text = el('td');
                            const option = s.Setting ? runOptions.find(o => o.Key === s.Setting) : null;
                            const label = option ? option.Label : s.Setting;
                            const percent = s.Gain === null || s.Gain === undefined ? '' : Math.round(Math.abs(s.Gain) * 100) + '%';
                            let actionButton = null;
                            let title = '';
                            let reason = '';
                            const backendName = t => t === 'none' ? 'Software' : names[t] || t;
                            if (s.Kind === 'FastestBackend') {
                                title = 'Hardware acceleration: ' + backendName(s.Type);
                                reason = !configured || configured === 'none'
                                    ? 'Works on this server; a hardware backend draws less power than software for the same work.'
                                    : 'The fastest hardware backend measured.';
                                actionButton = idleAction('Use this backend', () => post('HwProbe/UseBackend', { Type: s.Type, Device: s.Device }));
                            } else if (s.Kind === 'FallsBehind') {
                                title = 'Hardware acceleration: ' + backendName(s.Type);
                                reason = 'Falls behind real time, so a player would buffer.';
                            } else if (s.Kind === 'FasterSetting') {
                                title = label + ': ' + optionValueText(s.Setting, s.Value);
                                reason = percent + ' faster than ' + s.Others.map(o => optionValueText(s.Setting, o)).join(' or ') + (s.LowerQuality ? ', at lower quality.' : '.');
                                actionButton = idleAction('Apply', () => post('HwProbe/ApplyMeasured', { Setting: s.Setting, Value: s.Value, Run: speedViewing }), 'raised');
                            } else if (s.Kind === 'HigherQuality') {
                                title = label + ': ' + optionValueText(s.Setting, s.Value);
                                reason = 'Better quality than ' + s.Others.map(o => optionValueText(s.Setting, o)).join(' or ') + '; at most ' + percent + ' slower, still ' + s.Speed.toFixed(1) + '\u00d7 real time.';
                                actionButton = idleAction('Apply', () => post('HwProbe/ApplyMeasured', { Setting: s.Setting, Value: s.Value, Run: speedViewing }), 'raised');
                            }
                            text.appendChild(el('div', title));
                            text.appendChild(el('div', reason, 'secondaryText'));
                            text.appendChild(el('div', s.Outputs.join('; '), 'secondaryText hwprobe-small'));
                            if (s.TestVideosOnly) {
                                text.appendChild(el('div', 'Measured on test videos only, which encode faster than real video; measure a film sample or library video to confirm.', 'secondaryText hwprobe-small'));
                            }
                            const cell = el('td');
                            if (actionButton) {
                                cell.appendChild(actionButton);
                            }
                            row(table, [text, cell]);
                        }
                        div.appendChild(table);
                        div.appendChild(el('div', 'Settings are compared between saved runs that differ in that setting alone. Software is never suggested over a working hardware backend.', 'fieldDescription'));
                    }, () => {});
                    return div;
                }

                // Searches movies and episodes through Jellyfin's own Items API; the server describes the chosen file.
                function libraryCell(update) {
                    const td = el('div', null, 'hwprobe-library');
                    const box = jf('<div class="inputContainer"><input is="emby-input" type="search"></div>');
                    const search = box.firstElementChild;
                    search.setAttribute('label', 'Library video');
                    search.placeholder = 'Search for a movie or episode';
                    search.value = speedItem ? speedItem.Name : '';
                    td.appendChild(box);
                    const choose = item => {
                        search.value = item.Name;
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedLibraryVideo', { itemId: item.Id }), dataType: 'json' }).then(v => {
                            speedItem = { Id: item.Id, Name: item.Name };
                            libraryVideo = v;
                            chosenVideos.add(v.Key);
                            update(true);
                        }, () => setMessage('That item has no local video file to measure.'));
                    };
                    let timer = null;
                    search.addEventListener('input', () => {
                        clearTimeout(timer);
                        const term = search.value.trim();
                        if (term.length < 2) {
                            closeMenu();
                            return;
                        }
                        timer = setTimeout(() => {
                            ApiClient.getItems(ApiClient.getCurrentUserId(), { SearchTerm: term, IncludeItemTypes: 'Movie,Episode', Recursive: true, Limit: 5 }).then(r => {
                                // Results replace the open menu rather than toggling it closed.
                                closeMenu();
                                if (!(r.Items || []).length || search.value.trim() !== term) {
                                    return;
                                }
                                popMenu(search, (menu, close) => {
                                    for (const item of r.Items) {
                                        const row = el('div', item.SeriesName ? item.SeriesName + ': ' + item.Name : item.Name, 'hwprobe-menu-item');
                                        row.setAttribute('role', 'option');
                                        row.addEventListener('click', () => {
                                            close();
                                            choose(item);
                                        });
                                        menu.appendChild(row);
                                    }
                                });
                            });
                        }, 300);
                    });
                    return td;
                }

                // A link that opens another site in a new tab.
                function externalLink(text, url) {
                    const a = el('a', text, 'button-link');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    return a;
                }

                // Where each chosen input comes from, under the Input field.
                function sourceLines(target, update) {
                    target.replaceChildren();
                    if (chosenVideos.has('library')) {
                        target.appendChild(libraryCell(update));
                    }
                    const list = el('ul', null, 'fieldDescription hwprobe-notes');
                    // Each input: its name and what it shows on the left, its format on the right; a sample adds its credit and download.
                    const entry = (left, right) => {
                        const row = el('div', null, 'hwprobe-row');
                        row.appendChild(left);
                        row.appendChild(el('span', right, 'hwprobe-small secondaryText'));
                        return row;
                    };
                    const videoLine = v => {
                        const line = el('li');
                        const name = el('span', v.Name + (v.SourceUrl || v.Description ? ': ' : ''));
                        name.appendChild(v.SourceUrl ? externalLink(v.Title, v.ArticleUrl || v.SourceUrl) : document.createTextNode(v.Description || ''));
                        line.appendChild(entry(name, v.Input));
                        if (v.SourceUrl) {
                            const credit = el('span', null, 'hwprobe-small');
                            credit.appendChild(v.HolderUrl ? externalLink(v.CreditHolder, v.HolderUrl) : document.createTextNode(v.CreditHolder));
                            credit.appendChild(document.createTextNode(', '));
                            credit.appendChild(externalLink(v.LicenseName, v.LicenseUrl));
                            const download = entry(credit, v.Origin + ' from ');
                            download.lastElementChild.appendChild(externalLink('Wikimedia Commons', v.SourceUrl));
                            line.appendChild(download);
                        }
                        list.appendChild(line);
                    };

                function renderSpeedSetup(container, viable) {

                        .map(b => ({ key: b.type, text: (names[b.type] || b.type) + (sameType(b) ? ' ' + b.device : '') }))), chosenBackends, () => update());
                    // Settings for one backend, shown when it works and its probe found the option supported.
                    const supported = o => viable.some(b => b.type === o.Backend && (b.settings || []).some(x => x.setting === o.Report && (x.state === 'TurnOn' || x.state === 'Optional')));
                    runOptions.filter(o => o.Backend && supported(o)).forEach(runOption);

                    form.appendChild(el('h3', 'Input', 'sectionTitle'));
                    const sources = el('div', null, 'hwprobe-sources');

                        .appendChild(sources);

                    form.appendChild(el('h3', 'Output', 'sectionTitle'));
                    multiSelect(form, 'Codec', speedCodecs.map(c => ({ key: c.Key, text: c.Name })).concat(speedOutputs.filter(o => o.DecodeOnly).map(o => ({ key: o.Key, text: o.Label }))), chosenCodecs, () => update())
                        .appendChild(el('div', 'Every selected codec at every selected quality is processed for every selected input.', 'fieldDescription'));
                    multiSelect(form, 'Quality', speedQualities.map(q => ({ key: q.Key, text: q.Name })), chosenQualities, () => update())
                        .appendChild(el('div', 'Output size is determined by transcoded quality and codec.', 'fieldDescription'));

                    form.appendChild(el('h3', 'Transcoding Settings', 'sectionTitle'));
                    runOptions.filter(o => !o.Backend).forEach(runOption);
                    form.appendChild(el('h3', 'Accuracy and time', 'sectionTitle'));
                    options('Accuracy', Object.entries(methods).map(([key, [, text]]) => [key, text]), speedMethod, v => { speedMethod = v; });
                    options('Repeats', repeatOptions, speedRepeats, v => { speedRepeats = Number(v); });
                    options('Earlier results', [['true', 'Reuse when the settings match'], ['false', 'Measure everything again']], String(speedReuse), v => { speedReuse = v === 'true'; }, 'Reuses a measurement from an earlier run with the same input, output, backend, accuracy, repeats, and ffmpeg, and the same values for the settings that affect it, so a repeated comparison completes faster.');

                    options('Time limit per measurement', timeLimitOptions, speedTimeLimit === null ? '' : speedTimeLimit, v => { speedTimeLimit = v === '' ? null : Number(v); }, 'A measurement that reaches the limit stops and reports what it measured.');

                // Runs of the same command vary by a few percent, so smaller differences aren't shown as one.
                const noise = 0.05;

                // Which comparison rows are open, by test, kept across redraws.
                const speedOpen = new Set();

                const speedViews = [['bars', 'Bars'], ['relative', 'Relative to fastest'], ['values', 'Values']];
                let speedView = speedViews.some(([k]) => k === localStorage.getItem('hwprobe-speed-view')) ? localStorage.getItem('hwprobe-speed-view') : 'bars';

                // Rows grouped by video, one per output; one column per backend; comparisons fold under their row.
                function speedMatrix(r) {
                    const div = el('div');
                    const keyOf = x => x.type + ' ' + x.device;
                    const backends = [];
                    for (const x of r.results) {
                        if (!backends.some(b => keyOf(b) === keyOf(x))) {
                            backends.push(x);
                        }
                    }
                    const sameType = b => backends.filter(o => o.type === b.type).length > 1;
                    const columnName = b => b.type === 'none' ? 'Software' : (names[b.type] || b.type) + (sameType(b) ? ' ' + b.device : '');

                    if (!speedHistory.length && !speedLive) {
                        div.appendChild(el('p', 'Measured ' + new Date(r.generatedUtc).toLocaleString() + ', ' + methodName(r.method).toLowerCase() + ' accuracy', 'secondaryText'));
                    }
                    if (r.cancelled) {
                        div.appendChild(el('div', (r.cancelledForTranscode ? 'Cancelled when the server started transcoding' : 'Cancelled') + ': these are the measurements finished before then.', 'infoBanner'));
                    }

                    // A note shared by cells becomes one numbered footnote.
                    const footnotes = [];
                    const footnote = note => {
                        if (!note) {
                            return null;
                        }
                        const i = footnotes.indexOf(note);
                        return i === -1 ? footnotes.push(note) : i + 1;
                    };
                    const speedOf = x => x.fps && x.frameRate ? x.fps / x.frameRate : null;
                    // Fast accuracy derives the stream count from the speed, so only Standard and Thorough get a column for it.
                    const counted = r.method !== 'Quick';
                    // Results run in their planned order, so the first pending one is being measured.
                    const current = speedProgress && (speedProgress.Phase === 'Measuring' || speedProgress.Phase === 'Pausing') ? r.results.find(x => x.pending) : null;
                    const values = speedView === 'values';
                    const per = values && counted ? 2 : 1;
                    // Per backend: concurrent streams kept up with (Values view, when counted), and one transcode's speed as a value, a bar or a share of the row's fastest.
                    const cellsFor = (x, best, baseline, fastest) => {
                        const tint = x && x === best && backends.length > 1 ? ' hwprobe-best' : '';
                        const streams = el('td', null, 'hwprobe-num' + tint);
                        const speedCell = el('td', null, 'hwprobe-num' + tint);
                        const cells = per === 2 ? [streams, speedCell] : [speedCell];
                        if (!x) {
                            return cells;
                        }
                        if (x.pending) {
                            speedCell.textContent = x === current ? 'Measuring\u2026' : '\u2026';
                            speedCell.classList.add('secondaryText');
                            return cells;
                        }
                        const speed = speedOf(x);
                        const speedText = speed ? speed.toFixed(1) + '\u00d7' : '\u2013';
                        speedCell.dataset.sort = speed ? String(speed) : '';
                        streams.dataset.sort = x.streams === null || x.streams === undefined ? '' : String(x.streams);
                        if (!speed) {
                            speedCell.textContent = speedText;
                        } else if (speedView === 'relative') {
                            speedCell.textContent = Math.round(Math.min(1, speed / fastest) * 100) + '%';
                        } else if (speedView === 'bars') {
                            const bar = el('span', null, 'hwprobe-bar');
                            const fill = el('span');
                            fill.style.width = Math.max(1, Math.round(Math.min(1, speed / fastest) * 100)) + '%';
                            bar.appendChild(fill);
                            speedCell.appendChild(bar);
                            speedCell.appendChild(document.createTextNode(speedText));
                        } else {
                            streams.textContent = streamsText(x);
                            speedCell.textContent = speedText;
                        }
                        if (baseline && speed) {
                            speedCell.appendChild(el('span', ' ' + speedChange(x.fps, baseline.fps), 'hwprobe-small secondaryText'));
                        }
                        const n = footnote(x.note);
                        if (n) {
                            speedCell.appendChild(el('sup', String(n)));
                        }
                        const reused = x.reusedFromUtc ? footnote('Reused from a prior run.') : null;
                        if (reused) {
                            speedCell.appendChild(el('sup', String(reused)));
                        }
                        const facts = [];
                        if (speed && !values) {
                            facts.push(speedText + ' real time');
                        }
                        if (speed && !values && counted) {
                            facts.push(streamsText(x) + ' concurrent streams');
                        }
                        if (x.fps) {
                            facts.push(Math.round(x.fps) + ' frames a second');
                        }
                        if (x.note) {
                            facts.push(x.note);
                        }
                        if (x.reusedFromUtc) {
                            facts.push('Measured ' + new Date(x.reusedFromUtc).toLocaleString());
                        }
                        speedCell.title = facts.join('. ');
                        return cells;
                    };
                    // Values ranks by concurrent streams, then speed; the other views show speed alone, so they rank by it.
                    const bestOf = cells => cells.filter(x => x && x.fps).reduce((a, b) => {

                            return b;
                        }
                        const sa = !values || a.streams === null || a.streams === undefined ? -1 : a.streams;
                        const sb = !values || b.streams === null || b.streams === undefined ? -1 : b.streams;

                    const fastestOf = cells => Math.max(0, ...cells.filter(x => x && !x.pending).map(speedOf).filter(v => v));

                    const table = el('table', null, 'hwprobe-matrix hwprobe-full');
                    const columns = backends.length * per + 3;
                    if (per === 2) {
                        const top = el('tr');
                        top.appendChild(el('th'));
                        top.appendChild(el('th'));
                        top.appendChild(el('th'));
                        for (const b of backends) {
                            const th = el('th', columnName(b), 'hwprobe-num');
                            th.colSpan = per;
                            top.appendChild(th);
                        }
                        table.appendChild(top);
                        row(table, [el('th', 'Input'), el('th', 'Output'), el('th', 'Size')].concat(backends.flatMap(() => [el('th', 'Concurrent streams', 'hwprobe-num secondaryText'), el('th', 'Speed', 'hwprobe-num secondaryText')])));
                    } else {
                        row(table, [el('th', 'Input'), el('th', 'Output'), el('th', 'Size')].concat(backends.map(b => el('th', columnName(b), 'hwprobe-num'))));
                    }
                    let hasVariants = false;
                    for (const key of [...new Set(r.results.map(x => x.test))]) {
                        const base = backends.map(b => r.results.find(x => x.test === key && !x.variant && keyOf(x) === keyOf(b)));
                        const first = base.find(x => x) || r.results.find(x => x.test === key);
                        // Reports from before videos and outputs were recorded show their test's label alone.
                        const input = el('td');
                        input.dataset.sort = first.video || '';
                        if (first.video) {
                            input.appendChild(el('div', first.video));
                            input.appendChild(el('div', first.input || '', 'secondaryText hwprobe-small'));
                        }
                        const best = bestOf(base);
                        const fastest = fastestOf(r.results.filter(x => x.test === key));
                        const sized = base.find(x => x && x.outputSize);
                        row(table, [input, el('td', first.output || first.label || key), el('td', sized ? sized.outputSize : base.some(x => x && x.pending) ? '\u2026' : '', 'secondaryText')].concat(base.flatMap(x => cellsFor(x, best, null, fastest))));

                        const variants = [...new Set(r.results.filter(x => x.test === key && x.variant).map(x => x.variant))];
                        if (!variants.length) {
                            continue;
                        }
                        hasVariants = true;
                        const toggle = el('button', null, 'hwprobe-disclosure hwprobe-small secondaryText');
                        toggle.type = 'button';
                        const toggleRow = el('tr', null, 'hwprobe-variant');
                        const toggleCell = el('td');
                        toggleCell.colSpan = columns;
                        toggleCell.appendChild(toggle);
                        toggleRow.appendChild(toggleCell);
                        table.appendChild(toggleRow);
                        const rows = variants.map(v => {
                            const cells = backends.map(b => r.results.find(x => x.test === key && x.variant === v && keyOf(x) === keyOf(b)));
                            const tr = row(table, [el('td'), el('td', v), el('td')].concat(cells.flatMap((x, i) => cellsFor(x, null, base[i], fastest))));
                            tr.className = 'hwprobe-variant';
                            return tr;

                            if (speedOpen.has(key)) { speedOpen.delete(key); } else { speedOpen.add(key); }

                        });

                    }
                    // Old reports' comparison rows belong under their row, so those tables keep their order.
                    if (!hasVariants) {
                        sortable(table, 'results-' + per);
                    }
                    const scroll = el('div', null, 'hwprobe-scroll');
                    scroll.appendChild(table);
                    div.appendChild(scroll);
                    const views = el('div', null, 'hwprobe-row hwprobe-start hwprobe-views');
                    views.setAttribute('role', 'radiogroup');
                    views.setAttribute('aria-label', 'View');
                    views.appendChild(el('span', 'View', 'secondaryText'));
                    for (const [key, text] of speedViews) {
                        const label = el('label');
                        const radio = el('input');
                        radio.type = 'radio';
                        radio.name = 'hwprobeView';
                        radio.checked = key === speedView;
                        radio.addEventListener('change', () => {
                            speedView = key;
                            localStorage.setItem('hwprobe-speed-view', speedView);
                            renderSpeedResults();
                        });
                        label.appendChild(radio);
                        label.appendChild(document.createTextNode(' ' + text));
                        views.appendChild(label);
                    }
                    div.appendChild(views);

                    footnotes.forEach((note, i) => {
                        const line = el('div', null, 'fieldDescription');
                        line.appendChild(el('sup', String(i + 1)));
                        line.appendChild(document.createTextNode(' ' + note));
                        div.appendChild(line);
                    });
                    // The Values view ranks by streams first, which the highlight alone doesn't show.
                    if (backends.length > 1 && values && counted) {
                        div.appendChild(el('div', 'The highlighted cell keeps up with the most concurrent streams, then is the fastest, for the row.', 'fieldDescription'));
                    }

                    const credits = new Map();

                function settingsRows(t) {
                    const onOff = on => on ? 'On' : 'Off';
                    return [
                        ['enhancedNvdec', onOff(t.enhancedNvdec)],
                        ['preferNativeDecoder', onOff(t.preferNativeDecoder)],
                        ['lowPower', 'H.264 ' + onOff(t.lowPowerH264) + ', HEVC ' + onOff(t.lowPowerHevc)],
                        // Reports from before these settings were recorded have no algorithm or downmix.
                        ['tonemap', onOff(t.tonemap) + (t.vppTonemap ? ', VPP' : '') + (t.videoToolboxTonemap ? ', VideoToolbox' : '') + (t.tonemapAlgorithm ? ', ' + t.tonemapAlgorithm + ', mode ' + t.tonemapMode + ', range ' + t.tonemapRange + ', desat ' + t.tonemapDesat + ', peak ' + t.tonemapPeak + ', param ' + t.tonemapParam : '')],
                        ['encodingThreadCount', t.encodingThreadCount > 0 ? String(t.encodingThreadCount) : 'Automatic'],
                        ['audioVbr', onOff(t.audioVbr)],
                        ['downmix', t.downmixAlgorithm ? t.downmixAlgorithm + ', boost ' + t.downmixBoost : 'None'],
                        ['encoderPreset', t.encoderPreset || 'Auto (veryfast)'],
                        ['crf', 'H.265 ' + t.h265Crf + ', H.264 ' + t.h264Crf],
                        ['deinterlace', (t.bwdif ? 'BWDIF' : 'YADIF') + (t.doubleRate ? ', double rate' : '')],
                        ['audio', t.audioCopy ? 'Copied (passthrough)' : 'Transcoded to stereo AAC'],
                        ['burnIn', { text: 'Text (ASS)', image: 'Image (PGS)' }[t.burnIn] || 'None']
                    ].map(([key, value]) => [settingLabels[key] || key, value]);
                }

                // Status of a running speed run: test videos being prepared, then measurements with the time left.
                function speedProgressText(s) {
                    if (s.Phase === 'Cancelling') {
                        return 'Cancelling\u2026';
                    }
                    if (s.Phase === 'Deferring') {
                        return 'Waiting: the server is transcoding. Measured ' + (s.Done || 0) + ' of ' + s.Total + '; the interrupted measurement runs again when it ends.';
                    }
                    if (s.Phase === 'Paused') {
                        return 'Paused after ' + (s.Done || 0) + ' of ' + s.Total;
                    }
                    if (s.Phase === 'Pausing') {
                        return 'Pausing when this measurement finishes\u2026';
                    }
                    if (s.Phase === 'Preparing' || !s.Total) {
                        const ahead = s.Total ? timeLeft(s) : '';
                        return (s.Preparing || 'Preparing test videos') + (ahead ? '\u2026 ' + ahead : '\u2026');
                    }
                    const done = s.Done || 0;
                    const left = timeLeft(s);
                    return 'Measured ' + done + ' of ' + s.Total + (left ? ', ' + left : '');
                }

                // From the measurements so far; before the first, from the accuracy's typical time per measurement.
                function timeLeft(s) {
                    const done = s.Done || 0;
                    const remaining = s.Total - done;
                    if (remaining <= 0) {
                        return '';
                    }
                    let seconds;
                    if (done > 0 && s.MeasuringSeconds) {
                        seconds = s.MeasuringSeconds / done * remaining;
                    } else {
                        const per = methodSeconds[speedLive ? speedLive.method : speedMethod] || methodSeconds[defaultMethod];
                        seconds = remaining * (per[0] + per[1]) / 2 * (speedLive && speedLive.repeats ? speedLive.repeats : 1);
                    }
                    const minutes = Math.round(seconds / 60);
                    return seconds < 60 ? 'under a minute remains\u2026'
                        : minutes < 90 ? 'about ' + minutes + (minutes === 1 ? ' minute remains\u2026' : ' minutes remain\u2026')
                        : 'about ' + Math.round(minutes / 60) + ' hours remain\u2026';
                }

                function streamsText(x) {
                    if (x.streams === null || x.streams === undefined) {
                        return '-';
                    }
                    return x.capped ? x.streams + '+' : String(x.streams);
                }

                function speedChange(fps, baseFps) {
                    if (!fps || !baseFps) {
                        return '-';
                    }
                    const change = fps / baseFps - 1;
                    if (Math.abs(change) < noise) {
                        return 'same';
                    }
                    return (change > 0 ? '+' : '\u2212') + Math.round(Math.abs(change) * 100) + '%';
                }

                function renderReporting() {
                    const div = el('div');
                    div.appendChild(el('p', 'The report and every ffmpeg log of the last probe, to attach to a GitHub issue.', 'secondaryText'));
                    div.appendChild(el('div', 'The archive may include file paths, user names, and host names from this server.', 'infoBanner hwprobe-warning'));
                    const buttons = el('p');
                    const download = action('Download diagnostics', () => {
                        // ApiClient.ajax returns the raw response for a non-JSON request, with the session's token sent.
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Diagnostics') })
                            .then(response => response.blob())
                            .then(blob => {
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = 'hwprobe-diagnostics.zip';
                                a.click();
                                setTimeout(() => URL.revokeObjectURL(a.href), 60000);
                            }, () => { setMessage('Could not download diagnostics: run a probe first.'); })
                            .then(() => { download.disabled = false; });
                    }, 'raised button-submit');
                    buttons.appendChild(download);
                    buttons.appendChild(document.createTextNode(' '));
                    const issue = el('a', 'Report on GitHub', 'emby-button button-flat hwprobe-inline');
                    issue.href = 'https://github.com/Rinn/jellyfin-plugin-hwprobe/issues/new?template=hardware-report.yml';
                    issue.target = '_blank';
                    buttons.appendChild(issue);
                    div.appendChild(buttons);
                    return div;
                }

                function loadReport() {
                    const config = ApiClient.getNamedConfiguration('encoding').then(c => { encoding = c; }, () => { encoding = null; });
                    const server = ApiClient.getServerConfiguration().then(c => { trickplay = c.TrickplayOptions || null; }, () => { trickplay = null; });
                    const data = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Report'), dataType: 'json' })
                        .then(r => { report = r; }, () => { report = null; });
                    const changes = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/History'), dataType: 'json' })
                        .then(h => { history = h || []; }, () => { history = []; });
                    const pending = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/RestartRequired'), dataType: 'json' })
                        .then(r => { restartRequired = r === true; }, () => { restartRequired = false; });
                    const catalog = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Catalog'), dataType: 'json' }).then(useCatalog, () => {});
                    const speed = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Speed'), dataType: 'json' })
                        .then(r => { speedReport = r; speedViewing = null; }, () => { speedReport = null; speedViewing = null; });
                    const runs = ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedHistory'), dataType: 'json' })
                        .then(h => { speedHistory = h || []; }, () => { speedHistory = []; });
                    return Promise.all([config, server, data, changes, pending, catalog, speed, runs]).then(() => { renderChange(); render(); });
                }

                // jellyfin-web keeps a loaded plugin page until the browser reloads, so after an update this tab could
                // still be running the old page.
                let loadedVersion = null;
                let loaded = false;

                function loadStatus() {
                    // One poll at a time: a button's own loadStatus replaces the scheduled one.
                    clearTimeout(pollTimer);
                    return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/Status'), dataType: 'json' }).then(s => {
                        loadedVersion = loadedVersion || s.HwProbeVersion;
                        if (s.HwProbeVersion && s.HwProbeVersion !== loadedVersion) {
                            setMessage('HwProbe was updated. Reload the page to see the new version. ');
                            messageText.appendChild(action('Reload', () => location.reload(), 'raised'));
                        }
                        setRunning(s.State === 'Running');
                        if (running) {
                            const text = s.Activity === 'Speed'
                                ? speedProgressText(s)
                                : (s.Step || 'Probing') + (s.Total ? ' \u00b7 ' + (s.Done || 0) + ' of ' + s.Total + ' tests' : '\u2026');
                            statusText.textContent = text;
                            const wasProbing = !!probeProgress;
                            probeProgress = s.Activity === 'Speed' ? null : s;
                            if (loaded && !!probeProgress !== wasProbing) {
                                render();
                            } else if (probeProgress) {
                                renderCard();
                            }
                            speedUpdate();
                            // A page opened mid-run still needs its first render.
                            if (!loaded) {
                                loaded = true;
                                loadReport();
                            }
                            if (s.Activity === 'Speed') {
                                speedProgress = s;
                                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('HwProbe/SpeedProgress'), dataType: 'json' })
                                    .then(r => { speedLive = r; }, () => {}).then(() => renderSpeedResults(true)).then(() => { clearTimeout(pollTimer); pollTimer = setTimeout(loadStatus, 250); });
                            } else {
                                clearTimeout(pollTimer); pollTimer = setTimeout(loadStatus, 250);
                            }
                            return;
                        }
                        speedProgress = null;
                        speedLive = null;
                        probeProgress = null;
                        loaded = true;
                        const last = s.Activity === 'Speed' ? 'Last performance test' : 'Last probe';
                        statusText.textContent = s.LastError ? last + ' failed: ' + s.LastError : (s.LastCompletedUtc ? last + ' ' + new Date(s.LastCompletedUtc).toLocaleString() : '');
                        loadReport();
                    });
                }

                page.addEventListener('pageshow', loadStatus);
                page.addEventListener('pagehide', () => { clearTimeout(pollTimer); closeMenu(); });
            })();
        </script>
    </div>
</body>
</html>
